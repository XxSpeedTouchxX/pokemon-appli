.pkm-tks-cd-h { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cd); }
.pkm-tks-cd-row { display: flex; align-items: flex-start; gap: 4px; }
.pkm-tks-cd-row > span { min-width: 56px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 12px; background: rgba(0, 0, 0, 0.35); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
.pkm-tks-cd-row b { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 800; line-height: 1.1; color: #FFFFFF; font-variant-numeric: tabular-nums; }
.pkm-tks-cd-row small { font-size: 10.5px; font-weight: 700; color: #9AA8C3; }
.pkm-tks-cd-row > i { font-style: normal; font-size: 20px; font-weight: 800; line-height: 38px; color: var(--cd); animation: pkmCdBlink 1s steps(2, start) infinite; }
@keyframes pkmCdBlink { to { opacity: 0.25; } }
.pkm-tks-cd-bar { width: 100%; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.pkm-tks-cd-bar i { display: block; height: 100%; border-radius: 999px; background: var(--cd); transition: width 0.9s linear; }
.pkm-tks-cd-date { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #E2E8F5; }
.pkm-tks-cd-date svg { fill: none; stroke: var(--cd); stroke-width: 2; stroke-linecap: round; }
.pkm-tks-cd-last { font-size: 12.5px; font-weight: 800; color: #FF9A9A; animation: pkmNewTheme 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .pkm-tks-cd-row > i, .pkm-tks-cd-last { animation: none; } .pkm-tks-cd-bar i { transition: none; } }

/* Fiche d'un grade (2026-11-07, porteur) : PK gagnés au total (achats non déduits), progression, « Nouveau ». */
.pkm-gr-prog { width: 100%; box-sizing: border-box; margin-top: 6px; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 16px; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(255, 255, 255, 0.08); text-align: left; }
.pkm-gr-total { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #C9D3EA; }
.pkm-gr-total span { flex: 1; }
.pkm-gr-total b { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 800; color: #FFFFFF; }
.pkm-gr-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 12.5px; color: #9AA8C3; }
.pkm-gr-row b { font-weight: 800; color: #F3F6FC; }
.pkm-gr-row b.pkm-gr-ok { color: #3DDC84; }
.pkm-gr-row > i { grid-column: 1 / -1; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.pkm-gr-row > i > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #FFD60A, #3DDC84); }
.pkm-gr-prog small { font-size: 11.5px; line-height: 1.4; color: #AEB9D0; }
.pkm-gr-new { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 999px; background: #3DDC84; color: #062012; font-size: 10.5px; font-weight: 900; letter-spacing: 0.02em; vertical-align: 1px; }

/* Ticket acheté (2026-11-07, porteur) : ticket + « +1 », trois propositions (pkshop.js, ?anitk=1, 2 ou 3). */
.pkm-tkfx { position: fixed; inset: 0; z-index: 66; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.pkm-tkfx-box { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pkm-tkfx-tk { position: relative; display: block; transform: scale(1.7); filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.5)); }
.pkm-tkfx-tk .pkm-shop-ticket { display: flex; }
.pkm-tkfx-plus { position: absolute; top: -34px; right: -44px; font-family: 'Luckiest Guy', 'Sora', sans-serif; font-weight: 400; font-size: 46px; color: #FFD60A; -webkit-text-stroke: 2px #2A1300; paint-order: stroke fill; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); opacity: 0; }
.pkm-tkfx-cap { margin-top: 64px; padding: 6px 14px; border-radius: 999px; background: rgba(8, 12, 24, 0.82); color: #FFFFFF; font-size: 14px; font-weight: 800; opacity: 0; }
.pkm-tkfx-v0 .pkm-tkfx-box { animation: pkmTkFade 1.5s ease both; }
.pkm-tkfx-v0 .pkm-tkfx-plus, .pkm-tkfx-v0 .pkm-tkfx-cap { opacity: 1; }
@keyframes pkmTkFade { 0% { opacity: 0; } 15%, 80% { opacity: 1; } 100% { opacity: 0; } }
/* 1. Envol */
.pkm-tkfx-v1 .pkm-tkfx-tk { animation: pkmTkPop 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
.pkm-tkfx-v1 .pkm-tkfx-plus { animation: pkmTkPlus 1.6s ease-out 0.35s both; }
.pkm-tkfx-v1 .pkm-tkfx-cap, .pkm-tkfx-v2 .pkm-tkfx-cap, .pkm-tkfx-v3 .pkm-tkfx-cap { animation: pkmTkCap 2.3s ease 0.3s both; }
@keyframes pkmTkPop { 0% { transform: scale(0.2) rotate(-14deg); opacity: 0; } 60% { transform: scale(1.95) rotate(4deg); opacity: 1; } 100% { transform: scale(1.7) rotate(0); opacity: 1; } }
@keyframes pkmTkPlus { 0% { opacity: 0; transform: translateY(18px) scale(0.4); } 25% { opacity: 1; transform: translateY(0) scale(1.25); } 40% { transform: translateY(-4px) scale(1); } 85% { opacity: 1; transform: translateY(-26px); } 100% { opacity: 0; transform: translateY(-40px); } }
@keyframes pkmTkCap { 0% { opacity: 0; transform: translateY(8px); } 15%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }
/* 2. Tampon */
.pkm-tkfx-v2 .pkm-tkfx-tk { animation: pkmTkPop 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) both, pkmTkShake 0.32s ease-out 0.55s; }
.pkm-tkfx-stamp { position: absolute; left: 50%; top: 50%; padding: 2px 8px; border: 3px solid #E5484D; border-radius: 8px; color: #E5484D; background: rgba(255, 255, 255, 0.85); font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 0.08em; transform: translate(-50%, -50%) rotate(-14deg) scale(3); opacity: 0; animation: pkmTkStamp 0.32s cubic-bezier(0.5, 0, 0.9, 0.6) 0.45s forwards; }
@keyframes pkmTkStamp { to { opacity: 1; transform: translate(-50%, -50%) rotate(-14deg) scale(0.8); } }
@keyframes pkmTkShake { 0%, 100% { translate: 0 0; } 25% { translate: -4px 2px; } 50% { translate: 4px -2px; } 75% { translate: -2px 1px; } }
.pkm-tkfx-v2 .pkm-tkfx-plus { animation: pkmTkPlus 1.5s ease-out 0.75s both; }
/* 3. Brillance */
.pkm-tkfx-v3 .pkm-tkfx-tk { animation: pkmTkFlip 1.1s cubic-bezier(0.3, 0.7, 0.3, 1) both; }
@keyframes pkmTkFlip { 0% { transform: scale(0.3) rotateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: scale(1.7) rotateY(720deg); opacity: 1; } }
.pkm-tkfx-shine { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; }
.pkm-tkfx-shine::after { content: ''; position: absolute; top: -20%; bottom: -20%; width: 40%; left: -60%; background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0)); animation: pkmTkShine 0.8s ease-in-out 1.05s both; }
@keyframes pkmTkShine { to { left: 120%; } }
.pkm-tkfx-v3 .pkm-tkfx-plus { animation: pkmTkPlus 1.4s ease-out 1s both; }
.pkm-tkfx-sp { position: absolute; left: 50%; top: 38%; width: 7px; height: 7px; border-radius: 50%; background: #FFD60A; box-shadow: 0 0 8px #FFD60A; opacity: 0; animation: pkmFwSpark 0.9s cubic-bezier(0.15, 0.7, 0.3, 1) forwards; }

/* Achat direct confirmé (2026-11-07, porteur) : l'article, « Bravo ! », le message, confettis et feu d'artifice. */
.pkm-lotfx { position: fixed; inset: 0; z-index: 65; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(3, 6, 14, 0.72); animation: pkmTksFade 0.3s ease-out both; }
.pkm-lotfx-card { position: relative; width: 100%; max-width: 340px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 18px 18px; border-radius: 26px; border: 1px solid #FFD60A; background: radial-gradient(120% 80% at 50% 0%, rgba(255, 214, 10, 0.25), rgba(255, 214, 10, 0) 65%), #111A2C; color: #F3F6FC; text-align: center; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); animation: pkmLotIn 0.6s cubic-bezier(0.2, 1.3, 0.4, 1) both; }
@keyframes pkmLotIn { from { transform: translateY(60px) scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
.pkm-lotfx-glow { position: absolute; top: 18px; left: 50%; width: 220px; height: 220px; margin-left: -110px; border-radius: 50%; background: conic-gradient(from 0deg, rgba(255, 214, 10, 0.35), rgba(255, 214, 10, 0) 25%, rgba(255, 214, 10, 0.35) 50%, rgba(255, 214, 10, 0) 75%, rgba(255, 214, 10, 0.35)); animation: pkmSpin 6s linear infinite; pointer-events: none; }
.pkm-lotfx-img { position: relative; height: 170px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.55)); animation: pkmLotItem 0.9s cubic-bezier(0.2, 1.4, 0.4, 1) 0.15s both; }
.pkm-lotfx-wide { height: 140px; }
@keyframes pkmLotItem { 0% { transform: scale(0.3) rotate(-10deg); opacity: 0; } 70% { transform: scale(1.08) rotate(2deg); opacity: 1; } 100% { transform: none; opacity: 1; } }
.pkm-lotfx-card h2 { position: relative; margin: 2px 0 0; font-family: 'Luckiest Guy', 'Sora', sans-serif; font-weight: 400; font-size: 32px; color: #FFD60A; -webkit-text-stroke: 1.4px #2A1300; paint-order: stroke fill; }
.pkm-lotfx-card p { position: relative; margin: 0; font-size: 14.5px; line-height: 1.5; color: #E2E8F5; }
.pkm-lotfx-ok { position: relative; width: 100%; min-height: 48px; margin-top: 4px; border: 0; border-radius: 999px; background: #FFD60A; color: #0B1120; font: inherit; font-size: 15px; font-weight: 900; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .pkm-lotfx, .pkm-lotfx-card, .pkm-lotfx-img, .pkm-lotfx-glow { animation: none; } }
.pkm-tkfx::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(3, 6, 14, 0.62), rgba(3, 6, 14, 0.3) 70%); animation: pkmTkFade 2.4s ease both; }
.pkm-tkfx-v0::before { animation-duration: 1.5s; }

/* Boutons des jeux (2026-11-08, porteur) : prêt (jaune) ; pas encore prêt : « négatif », sombre bordé de rouge, sablier,
   temps à attendre ; un appui le fait trembler. Fermé au grade : grisé. */
.pkm-gm-go { height: 52px; border: 0; border-radius: 999px; background: var(--pkm-accent); color: var(--pkm-on-accent); font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease; }
.pkm-gm-go-no { background: #1A1424; color: #FF8A8A; box-shadow: inset 0 0 0 2px rgba(255, 92, 92, 0.75); font-size: clamp(12px, 3.6vw, 14px); gap: 6px; padding: 0 12px; white-space: nowrap; cursor: not-allowed; }
.pkm-gm-go-lock { opacity: 0.55; }
/* Sablier (2026-11-08, porteur : « plus visuel ») : verre, sable doré qui coule du haut vers le bas, filet de sable,
   puis le sablier se retourne ; halo rouge doux derrière. */
.pkm-gm-hg { position: relative; flex: none; width: 36px; height: 36px; margin: -4px 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: radial-gradient(circle, rgba(255, 92, 92, 0.35), rgba(255, 92, 92, 0) 70%); }
.pkm-gm-hg svg { display: block; overflow: visible; }
.pkm-gm-hg-flip { transform-origin: 16px 16px; animation: pkmGmHgFlip 3s cubic-bezier(0.6, 0, 0.3, 1) infinite; }
.pkm-gm-hg-glass { fill: rgba(255, 220, 220, 0.12); stroke: #FFC2C2; stroke-width: 1.6; stroke-linejoin: round; }
.pkm-gm-hg-cap { fill: #FF8A8A; stroke: #5A1E28; stroke-width: 1; }
.pkm-gm-hg-top, .pkm-gm-hg-bot { fill: #FFD60A; }
.pkm-gm-hg-top { transform-origin: 16px 15.4px; animation: pkmGmHgTop 3s linear infinite; }
.pkm-gm-hg-bot { transform-origin: 16px 24px; animation: pkmGmHgBot 3s linear infinite; }
.pkm-gm-hg-stream { stroke: #FFD60A; stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 1.6 1.8; animation: pkmGmHgStream 0.5s linear infinite, pkmGmHgStreamOn 3s linear infinite; }
@keyframes pkmGmHgFlip { 0%, 80% { transform: rotate(0deg); } 95%, 100% { transform: rotate(180deg); } }
@keyframes pkmGmHgTop { 0% { transform: scaleY(1); } 78%, 100% { transform: scaleY(0.08); } }
@keyframes pkmGmHgBot { 0% { transform: scaleY(0.1); } 78%, 100% { transform: scaleY(1); } }
@keyframes pkmGmHgStream { to { stroke-dashoffset: -3.4; } }
@keyframes pkmGmHgStreamOn { 0%, 76% { opacity: 1; } 80%, 100% { opacity: 0; } }
.pkm-gm-go-shake { animation: pkmGmNo 0.5s ease; }
@keyframes pkmGmNo { 0%, 100% { transform: translateX(0); } 15% { transform: translateX(-8px); } 30% { transform: translateX(7px); } 45% { transform: translateX(-5px); } 60% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
@media (prefers-reduced-motion: reduce) { .pkm-gm-hg *, .pkm-gm-go-shake { animation: none !important; } }

/* ——— 2XP PK (xppk.js, 2026-11-08) : 3 visuels proposés (?xpvis=1, 2, 3), une couleur par durée ——— */
.pkm-xp-sec { flex: none; display: flex; flex-direction: column; gap: 10px; }
.pkm-xp-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 8px; }
.pkm-xp-offer { --xc: #5EE0CF; --xd: #0E5C55; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; padding: 14px 6px 12px; border-radius: 20px; border: 1.5px solid color-mix(in srgb, var(--xc) 55%, transparent); background: radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--xc) 26%, transparent), transparent 70%), #111A2C; color: #F3F6FC; font: inherit; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.2s ease; }
.pkm-xp-offer:active { transform: scale(0.97); }
.pkm-xp-offer-b { --xc: #B18CFF; --xd: #3E2380; }
.pkm-xp-offer-c { --xc: #FFD60A; --xd: #7A5A00; }
.pkm-xp-offer-on { box-shadow: 0 0 0 3px var(--xc), 0 0 26px color-mix(in srgb, var(--xc) 55%, transparent); }
.pkm-xp-offer-short .pkm-shop-price { opacity: 0.55; }
.pkm-xp-ribbon { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); padding: 2px 8px; border-radius: 999px; background: var(--xc); color: #0B1120; font-size: 9.5px; font-weight: 800; white-space: nowrap; letter-spacing: 0.01em; }
.pkm-xp-title { font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700; }
.pkm-xp { position: relative; display: block; width: 84px; height: 84px; }
.pkm-xp-gem { position: absolute; left: 50%; top: 46%; width: 50px; height: 50px; transform: translate(-50%, -50%); filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45)); }
.pkm-xp-tag { position: absolute; right: -4px; top: 2px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; height: 24px; padding: 0 4px; border-radius: 8px; background: #0B1120; border: 2px solid var(--xc); color: var(--xc); font-family: 'Luckiest Guy', 'Sora', sans-serif; font-size: 17px; line-height: 1; transform: rotate(8deg); }
.pkm-xp-tag svg { display: block; overflow: visible; }
.pkm-xp-tag text { fill: currentColor; font-family: 'Luckiest Guy', 'Sora', sans-serif; font-size: 17px; }
.pkm-xp-v3 .pkm-xp-tag text { fill: #FFFFFF; filter: drop-shadow(0 0 3px var(--xc)) drop-shadow(0 0 6px var(--xc)); }
.pkm-xp-days { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); padding: 1px 9px; border-radius: 6px; background: var(--xc); color: #0B1120; font-size: 11px; font-weight: 800; white-space: nowrap; box-shadow: 0 2px 0 var(--xd); }
.pkm-xp-rays, .pkm-xp-halo { position: absolute; inset: 0; border-radius: 50%; display: none; }
/* 1. Gemme rayonnante */
.pkm-xp-v1 .pkm-xp-rays { display: block; inset: 2px; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--xc) 60%, transparent) 0deg 10deg, transparent 10deg 30deg); -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); mask: radial-gradient(circle, #000 30%, transparent 70%); animation: pkmXpSpin 9s linear infinite; }
.pkm-xp-v1 .pkm-xp-gem { animation: pkmXpBob 2.4s ease-in-out infinite; }
/* 2. Sablier de gemmes */
.pkm-xp-v2 .pkm-xp-gem { display: none; }
.pkm-xp-hg { position: absolute; left: 50%; top: 42%; width: 48px; height: 60px; transform: translate(-50%, -50%); overflow: visible; }
.pkm-xp-hg-cap { stroke: var(--xc); stroke-width: 5; stroke-linecap: round; fill: none; }
.pkm-xp-hg-glass { stroke: #DCE6FA; stroke-width: 2.6; fill: rgba(220, 230, 250, 0.08); stroke-linejoin: round; }
.pkm-xp-hg-top, .pkm-xp-hg-bot { fill: var(--xc); opacity: 0.9; }
.pkm-xp-hg-top { animation: pkmXpSandTop 3s ease-in infinite; transform-origin: 32px 14px; }
.pkm-xp-hg-bot { animation: pkmXpSandBot 3s ease-out infinite; transform-origin: 32px 70px; }
.pkm-xp-hg-flow { stroke: var(--xc); stroke-width: 2; stroke-dasharray: 3 4; animation: pkmXpFlow 0.6s linear infinite; }
.pkm-xp-fall { position: absolute; left: 50%; top: 30%; width: 13px; height: 13px; margin-left: -6.5px; animation: pkmXpFall 1.5s ease-in infinite; }
.pkm-xp-fall-2 { animation-delay: 0.75s; }
.pkm-xp-v2 .pkm-xp-tag { content: ''; }
/* 3. Double gemme */
.pkm-xp-v3 .pkm-xp-halo { display: block; inset: 10px; background: radial-gradient(circle, color-mix(in srgb, var(--xc) 55%, transparent), transparent 70%); animation: pkmXpPulse 1.8s ease-in-out infinite; }
.pkm-xp-v3 .pkm-xp-gem { left: 42%; animation: pkmXpTwinL 2.6s ease-in-out infinite; }
.pkm-xp-v3 .pkm-xp-gem2 { left: 58%; top: 50%; opacity: 0.85; filter: drop-shadow(0 0 8px var(--xc)); animation: pkmXpTwinR 2.6s ease-in-out infinite; }
.pkm-xp-v3 .pkm-xp-tag { color: #FFFFFF; text-shadow: 0 0 6px var(--xc), 0 0 12px var(--xc); }
.pkm-xp-orbit { position: absolute; inset: 4px; animation: pkmXpSpin 4s linear infinite; }
.pkm-xp-orbit b { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 8px var(--xc); }
.pkm-xp-orbit b:nth-child(1) { left: 50%; top: 0; } .pkm-xp-orbit b:nth-child(2) { left: 6%; bottom: 18%; } .pkm-xp-orbit b:nth-child(3) { right: 6%; bottom: 18%; }
.pkm-xp-live { margin: 0; padding: 10px 14px; border-radius: 16px; border: 1px solid rgba(255, 214, 10, 0.55); background: linear-gradient(90deg, rgba(255, 214, 10, 0.18), rgba(255, 214, 10, 0.04)); color: #F3F6FC; font-size: 13.5px; line-height: 1.4; }
.pkm-xp-live b { color: #FFD60A; }
.pkm-xp-live-gm { flex: none; }
.pkm-xp-ask { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 18px; border: 1px solid #24345C; background: #111A2C; color: #F3F6FC; }
.pkm-xp-ask p { margin: 0; font-size: 14px; font-weight: 700; }
.pkm-xp-ask .pkm-xp-miss { color: #F5B14C; font-size: 13px; }
.pkm-xp-won { position: relative; padding: 2px 10px; border-radius: 8px; background: #0B1120; border: 2px solid #FFD60A; color: #FFD60A; font-family: 'Luckiest Guy', 'Sora', sans-serif; font-size: 15px; }
@keyframes pkmXpSpin { to { transform: rotate(360deg); } }
@keyframes pkmXpBob { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -56%) scale(1.06); } }
@keyframes pkmXpPulse { 0%, 100% { opacity: 0.55; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.08); } }
@keyframes pkmXpTwinL { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-62%, -54%) rotate(-6deg); } }
@keyframes pkmXpTwinR { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-38%, -46%) rotate(6deg); } }
@keyframes pkmXpSandTop { 0% { transform: scaleY(1); } 90%, 100% { transform: scaleY(0.15); } }
@keyframes pkmXpSandBot { 0% { transform: scaleY(0.2); } 90%, 100% { transform: scaleY(1); } }
@keyframes pkmXpFlow { to { stroke-dashoffset: -7; } }
@keyframes pkmXpFall { 0% { transform: translateY(0) scale(0.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(26px) scale(1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pkm-xp *, .pkm-xp { animation: none !important; } }

/* ——— Scan (2026-11-08, porteur) : bulle des scans disponibles, consigne sous le cadre, aide illustrée ——— */
.pkm-scan-left { flex: 0 1 auto; min-width: 0; height: 44px; padding: 0 16px; box-sizing: border-box; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(var(--pkm-ink-rgb), 0.66); border: 1px solid rgba(var(--pkm-hl-rgb), 0.16); color: var(--pkm-t1); font-size: 14.5px; font-weight: 700; white-space: nowrap; }
.pkm-scan-left svg { flex: none; fill: none; stroke: var(--pkm-accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
/* Texte toujours dans la bulle (2026-11-13, porteur : « l'écriture du nombre de scans est hors de la bulle ») : à côté
   du compteur de scans bonus, la bulle rétrécit et son texte passe sur deux lignes (« 200 scans / disponibles »). */
.pkm-scan-left { overflow: hidden; padding: 0 14px 0 12px; }
.pkm-scan-left-t { min-width: 0; white-space: normal; line-height: 1.1; font-size: 14px; text-align: center; overflow-wrap: anywhere; }
@media (max-width: 359px) { .pkm-scan-left { gap: 5px; padding: 0 10px; } .pkm-scan-left svg { width: 15px; height: 15px; } .pkm-scan-left-t { font-size: 12px; } }
.pkm-scan-hint { position: relative; z-index: 2; max-width: 100%; padding: 6px 12px; border-radius: 999px; background: rgba(var(--pkm-ink-rgb), 0.7); color: var(--pkm-t1); font-size: 13px; font-weight: 600; text-align: center; }
.pkm-scan-helpbtn { justify-self: end; height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(var(--pkm-hl-rgb), 0.18); border-radius: 16px; background: rgba(var(--pkm-ink-rgb), 0.66); color: var(--pkm-white); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
.pkm-scan-helpbtn svg { fill: none; stroke: var(--pkm-accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pkm-scan-helpbtn .pkm-scan-helpdot { fill: var(--pkm-accent); }
.pkm-scanhelp-wrap { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; justify-content: flex-end; }
.pkm-scanhelp { position: relative; max-height: 88%; overflow-y: auto; scrollbar-width: none; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); border-radius: 28px 28px 0 0; border-top: 1px solid #2A3A5C; background: #0F1830; color: #F3F6FC; }
.pkm-scanhelp-grab { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.25); margin-bottom: 4px; }
.pkm-scanhelp h2 { margin: 0; font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; text-align: center; }
.pkm-scanhelp-sub { margin: -4px 0 4px; font-size: 13.5px; color: #9AA8C3; text-align: center; }
.pkm-scanhelp-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; counter-reset: tip; }
.pkm-scanhelp-tip { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 10px 14px; border-radius: 20px; border: 1px solid #24345C; background: radial-gradient(120% 70% at 50% 0%, rgba(255, 214, 10, 0.14), transparent 70%), #121C33; text-align: center; counter-increment: tip; }
.pkm-scanhelp-tip::before { content: counter(tip); position: absolute; left: 10px; top: 10px; width: 22px; height: 22px; border-radius: 50%; background: #FFD60A; color: #0B1120; font-size: 12.5px; font-weight: 800; line-height: 22px; }
.pkm-scanhelp-tip b { font-family: 'Sora', sans-serif; font-size: 14.5px; line-height: 1.25; }
.pkm-scanhelp-tip span:last-child { font-size: 12.5px; line-height: 1.35; color: #C9D3EA; }
.pkm-scanhelp-ill { display: block; width: 84px; height: 84px; }
.pkm-scanhelp-ill svg { display: block; width: 100%; height: 100%; overflow: visible; }
.pkm-scanhelp-search { height: 44px; border: 0; background: transparent; color: var(--pkm-link); font: inherit; font-size: 14.5px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
/* 1. Lumière */
.pkm-sh-rays path { stroke: #FFD60A; stroke-width: 4; stroke-linecap: round; }
.pkm-sh-rays { transform-origin: 40px 40px; animation: pkmShRays 2.4s ease-in-out infinite; }
.pkm-sh-sun { fill: #FFD60A; stroke: #0B1120; stroke-width: 3; }
.pkm-sh-bolt { fill: #0B1120; }
/* Cartes dessinées */
.pkm-sh-card { fill: #E9EEF8; stroke: #0B1120; stroke-width: 3; }
.pkm-sh-art { fill: #5EE0CF; }
/* 2. Reflets */
.pkm-sh-shine { fill: rgba(255, 255, 255, 0.95); transform: skewX(-20deg); animation: pkmShShine 2.2s ease-in-out infinite; }
.pkm-sh-no { fill: #0B1120; stroke: #FF5A5A; stroke-width: 4; }
.pkm-sh-noline { stroke: #FF5A5A; stroke-width: 4; stroke-linecap: round; }
/* 3. Remplir le cadre */
.pkm-sh-corner { fill: none; stroke: #FFD60A; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.pkm-sh-grow { transform-origin: 40px 40px; animation: pkmShGrow 2.6s ease-in-out infinite; }
/* 4. Téléphone stable */
.pkm-sh-body { fill: #1A2440; stroke: #DCE6FA; stroke-width: 3; }
.pkm-sh-screen { fill: #5EE0CF; opacity: 0.85; }
.pkm-sh-shake { fill: none; stroke: #9AA8C3; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; animation: pkmShShakeLines 2.8s ease-in-out infinite; }
.pkm-sh-phone { transform-origin: 40px 37px; animation: pkmShShake 2.8s ease-in-out infinite; }
.pkm-sh-ok { fill: #3DDC84; stroke: #0B1120; stroke-width: 3; animation: pkmShOk 2.8s ease-in-out infinite; transform-origin: 58px 60px; }
.pkm-sh-okline { fill: none; stroke: #0B1120; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; animation: pkmShOk 2.8s ease-in-out infinite; transform-origin: 58px 60px; }
@keyframes pkmShRays { 0%, 100% { opacity: 0.55; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.08); } }
@keyframes pkmShShine { 0% { transform: translateX(0) skewX(-20deg); } 60%, 100% { transform: translateX(80px) skewX(-20deg); } }
@keyframes pkmShGrow { 0%, 15% { transform: scale(0.62); } 55%, 85% { transform: scale(1); } 100% { transform: scale(0.62); } }
@keyframes pkmShShake { 0% { transform: rotate(0); } 6% { transform: rotate(-7deg); } 12% { transform: rotate(6deg); } 18% { transform: rotate(-5deg); } 24% { transform: rotate(4deg); } 30%, 100% { transform: rotate(0); } }
@keyframes pkmShShakeLines { 0%, 28% { opacity: 1; } 34%, 100% { opacity: 0; } }
@keyframes pkmShOk { 0%, 34% { opacity: 0; transform: scale(0.4); } 42% { opacity: 1; transform: scale(1.15); } 48%, 100% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pkm-scanhelp-ill * { animation: none !important; } .pkm-sh-ok, .pkm-sh-okline { opacity: 1; } }

/* ——— Lots limités et tirage mensuel d'une carte (2026-11-09, porteur) ——— */
/* Étoiles de rareté : double étoile argentée (ultra rare), une ou deux étoiles dorées (AR, ALT). */
.pkm-shop-stars { display: inline-flex; align-items: center; gap: 1px; vertical-align: -2px; }
.pkm-shop-stars svg { display: block; stroke: rgba(0, 0, 0, 0.55); stroke-width: 1.4; stroke-linejoin: round; }
.pkm-shop-stars-silver svg { fill: #E4E9F2; filter: drop-shadow(0 0 3px rgba(220, 230, 255, 0.55)); }
.pkm-shop-stars-gold svg { fill: #FFD23F; filter: drop-shadow(0 0 3px rgba(255, 200, 40, 0.6)); }
/* Cartes à gagner dans la fiche d'un ticket. */
.pkm-tkcs { display: flex; flex-direction: column; gap: 8px; }
.pkm-tkc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.pkm-tkc { position: relative; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 5px; padding: 8px; border-radius: 18px; border: 1.5px solid #24345C; background: #0B1120; color: #F3F6FC; font: inherit; text-align: left; cursor: pointer; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; }
.pkm-tkc:active { transform: scale(0.97); }
.pkm-tkc-on { border-color: var(--cd, #FFD60A); box-shadow: 0 0 0 2px var(--cd, #FFD60A), 0 8px 22px rgba(255, 214, 10, 0.22); }
.pkm-tks-sheet .pkm-tkc-on { border-color: var(--pkm-accent); box-shadow: 0 0 0 2px var(--pkm-accent), 0 8px 22px rgba(255, 214, 10, 0.22); }
.pkm-tkc-img { position: relative; display: block; aspect-ratio: 600 / 825; border-radius: 10px; overflow: hidden; background: #16223A; }
.pkm-tkc-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pkm-tkc-q { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 28px; font-weight: 800; color: #3A4A75; }
.pkm-tkc-n { position: absolute; left: 6px; top: 6px; padding: 2px 7px; border-radius: 999px; background: rgba(5, 9, 18, 0.82); color: #5EE0CF; font-size: 12px; font-weight: 800; }
.pkm-tkc-check { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 50%; background: var(--pkm-accent); opacity: 0; transform: scale(0.4); transition: opacity 0.18s, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
.pkm-tkc-check::after { content: ''; position: absolute; left: 8.5px; top: 4.5px; width: 5px; height: 10px; border: solid var(--pkm-on-accent); border-width: 0 2.6px 2.6px 0; transform: rotate(45deg); }
.pkm-tkc-on .pkm-tkc-check { opacity: 1; transform: none; }
.pkm-tkc-name { font-size: 13px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.pkm-tkc-info { font-size: 11px; line-height: 1.3; color: #9AA8C3; overflow-wrap: anywhere; }
.pkm-tkc-none { margin: 0; padding: 14px; border-radius: 16px; border: 1.5px dashed #3A4A75; font-size: 13.5px; line-height: 1.45; color: #C9D3EA; text-align: center; }
.pkm-tks-buy-off { opacity: 0.5; cursor: default; }
/* Stock d'un achat direct : « Plus que N ce mois-ci » et les points restants. */
.pkm-stock { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px; border-radius: 14px; background: rgba(94, 224, 207, 0.1); box-shadow: inset 0 0 0 1px rgba(94, 224, 207, 0.35); }
.pkm-stock-t { font-size: 13.5px; font-weight: 800; color: #5EE0CF; }
.pkm-stock-low { background: rgba(245, 177, 76, 0.12); box-shadow: inset 0 0 0 1px rgba(245, 177, 76, 0.45); }
.pkm-stock-low .pkm-stock-t { color: #F5B14C; }
.pkm-stock-out { background: rgba(255, 92, 92, 0.12); box-shadow: inset 0 0 0 1px rgba(255, 92, 92, 0.5); }
.pkm-stock-out .pkm-stock-t { color: #FF8A8A; text-transform: uppercase; letter-spacing: 0.06em; }
.pkm-stock-dots { display: flex; flex-wrap: wrap; gap: 4px; }
.pkm-stock-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); }
.pkm-stock-dot-on { background: currentColor; color: #5EE0CF; box-shadow: 0 0 6px rgba(94, 224, 207, 0.6); }
.pkm-stock-low .pkm-stock-dot-on { color: #F5B14C; box-shadow: 0 0 6px rgba(245, 177, 76, 0.6); }
.pkm-shop-img-out { filter: grayscale(1) brightness(0.7); }
/* Épuisé, ou achat du mois déjà fait : retour le 1er à 20 h, avec un compte à rebours. */
.pkm-lotwait { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px; border-radius: 16px; background: rgba(0, 0, 0, 0.3); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1); text-align: center; }
.pkm-lotwait > b { font-size: 14.5px; font-weight: 800; color: #F5B14C; }
.pkm-lotwait > span { font-size: 12.5px; line-height: 1.4; color: #C9D3EA; }
.pkm-lotwait-out > b { font-size: 16px; color: #FF8A8A; text-transform: uppercase; letter-spacing: 0.08em; }
.pkm-cdx { display: flex; align-items: flex-start; gap: 3px; }
.pkm-cdx > span { min-width: 44px; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 3px; border-radius: 10px; background: rgba(0, 0, 0, 0.35); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
.pkm-cdx b { font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 800; line-height: 1.1; color: #FFFFFF; font-variant-numeric: tabular-nums; }
.pkm-cdx small { font-size: 10px; font-weight: 700; color: #9AA8C3; }
.pkm-cdx > i { font-style: normal; font-size: 16px; font-weight: 800; line-height: 30px; color: #F5B14C; animation: pkmCdBlink 1s steps(2, start) infinite; }
@media (prefers-reduced-motion: reduce) { .pkm-cdx > i { animation: none; } .pkm-tkc-check { transition: none; } }
/* Panneau Admin › Cartes des tirages. */
.pkm-admz { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 18px; border: 1px solid #24345C; background: #111A2C; }
.pkm-admz h3 { margin: 0; font-size: 14px; font-weight: 700; color: #C9D3EA; }
.pkm-admz > p { margin: 0; font-size: 12.5px; line-height: 1.45; color: #9AA8C3; }
.pkm-admz-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pkm-admz-chip { align-self: flex-start; min-height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid #2A3A5C; background: transparent; color: #F3F6FC; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.pkm-admz-chip-on { border-color: var(--pkm-accent); background: var(--pkm-accent); color: var(--pkm-on-accent); }
.pkm-admz-q { height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #1E2B45; background: #0B1120; color: #F3F6FC; font: inherit; font-size: 15px; }
.pkm-admz-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pkm-admz-list li { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 14px; background: #0B1120; }
.pkm-admz-list img { flex: none; width: 40px; height: 55px; border-radius: 4px; object-fit: cover; }
.pkm-admz-list li > span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pkm-admz-list b { font-size: 13.5px; }
.pkm-admz-list small { font-size: 11.5px; color: #9AA8C3; overflow-wrap: anywhere; }
.pkm-admz-add, .pkm-admz-x { flex: none; min-height: 40px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
.pkm-admz-add { border: 0; background: var(--pkm-accent); color: var(--pkm-on-accent); }
.pkm-admz-x { border: 1px solid #2A3A5C; background: transparent; color: #FF8A8A; }
.pkm-admz-ok { flex: none; font-weight: 800; color: #5EE0CF !important; }
.pkm-admz-empty { margin: 0; font-size: 12.5px; color: #9AA8C3; }
.pkm-admz-err { margin: 0; font-size: 12.5px; color: #FF8A8A; }
/* Panneau Admin › Inscriptions en direct (2026-11-12, porteur). */
.pkm-sig { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 18px; border: 1px solid #24345C; background: #111A2C; }
.pkm-sig-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pkm-sig-top h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #C9D3EA; }
.pkm-sig-dot { width: 10px; height: 10px; border-radius: 50%; background: #3BD37A; box-shadow: 0 0 0 0 rgba(59, 211, 122, 0.6); animation: pkmSigPulse 1.6s ease-out infinite; }
@keyframes pkmSigPulse { 0% { box-shadow: 0 0 0 0 rgba(59, 211, 122, 0.6); } 100% { box-shadow: 0 0 0 9px rgba(59, 211, 122, 0); } }
.pkm-sig-live { margin: 0; font-size: 11.5px; color: #9AA8C3; }
.pkm-sig-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pkm-sig-stats > span { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; background: #0B1120; }

.pkm-xpb { position: absolute; z-index: 6; isolation: isolate; left: 4px; top: -13px; display: flex; align-items: center; justify-content: center; min-width: 30px; height: 15px; padding: 0 5px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #FFFFFF; font: 900 9px/1 'Sora', sans-serif; letter-spacing: 0.02em; color: #0B1120; opacity: 1; filter: none; -webkit-font-smoothing: antialiased; cursor: pointer; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35); background-repeat: no-repeat; background-size: 260% 100%, 100% 100%; background-position: 130% 0, 0 0; animation: pkmXpbShine 3.2s ease-in-out infinite; }

/* Calque de la partie : posé sur l'app, à sa taille. */
.pkm-sf { position: fixed; z-index: 3000; overflow: hidden; border-radius: inherit; background: #0B1120; color: #F3F6FC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; animation: pkmSfIn 0.3s ease-out both; }
@media (min-width: 521px) { .pkm-sf { border-radius: 42px; } }
@keyframes pkmSfIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: none; } }

.pkm-sf-hill { position: absolute; left: -12%; right: -12%; top: 37%; height: 12%; border-radius: 50%; background: #79CC5B; }
.pkm-sf-cloud { position: absolute; width: 74px; height: 24px; border-radius: 20px; background: #FFFFFF; opacity: 0.9; animation: pkmSfCloud 14s ease-in-out infinite alternate; }
.pkm-sf-cloud::before, .pkm-sf-cloud::after { content: ''; position: absolute; border-radius: 50%; background: #FFFFFF; }
.pkm-sf-cloud::before { width: 32px; height: 32px; left: 12px; top: -15px; }
.pkm-sf-cloud::after { width: 22px; height: 22px; left: 38px; top: -9px; }
@keyframes pkmSfCloud { to { translate: 26px 0; } }
.pkm-sf-bush { position: absolute; bottom: -20px; width: 32%; height: 80px; border-radius: 60px 60px 0 0; background: #3E9A3A; box-shadow: inset 0 8px 0 rgba(255, 255, 255, 0.12); }
.pkm-sf-mons { position: absolute; inset: 0; }
.pkm-sf-mon { position: absolute; left: 0; padding: 0; border: 0; background: transparent; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.pkm-sf-mon img { width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; filter: drop-shadow(0 6px 4px rgba(0, 0, 0, 0.25)); animation: pkmSfHop 0.5s ease-in-out infinite alternate; }

.pkm-sf-hit img { animation: pkmSfCaught 0.6s ease-in both; }

@keyframes pkmSfMark { from { transform: scale(0.5); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1.05); opacity: 0.9; } }
@keyframes pkmSfCaught { 0%, 40% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.2); opacity: 0; } }
@keyframes pkmSfShake { 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
.pkm-sf-pop { position: absolute; z-index: 3; font: 900 26px/1 'Sora', sans-serif; color: #FFFFFF; -webkit-text-stroke: 1.6px #0B1120; paint-order: stroke fill; text-shadow: 0 3px 0 #0B1120; pointer-events: none; animation: pkmSfPop 0.65s ease-out both; }

.pkm-sf-top { position: absolute; z-index: 6; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; align-items: center; gap: 8px; }

.pkm-sf-t { margin-left: auto; color: #FFD60A; min-width: 46px; justify-content: center; }
.pkm-sf-target { position: absolute; z-index: 4; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; background: rgba(11, 17, 32, 0.9); font: 700 13.5px/1 'Sora', sans-serif; white-space: nowrap; }
.pkm-sf-type { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px; background: var(--ty); color: #FFFFFF; font: 800 13px/1 'Sora', sans-serif; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2); }

.pkm-sf-panel:empty { display: none; }
/* Carte centrée quand elle tient, sinon lue depuis le haut (consigne plus longue en Normal et Difficile). */
.pkm-sf-panel > * { margin-top: auto; margin-bottom: auto; }
.pkm-sf-card { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 16px; border-radius: 26px; border: 1px solid #24345C; background: rgba(11, 17, 32, 0.96); text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); animation: pkmSfIn 0.3s ease-out both; }
.pkm-sf-h { margin: 0; font-family: 'Luckiest Guy', 'Sora', sans-serif; font-weight: 400; font-size: 29px; line-height: 1.1; color: #FFFFFF; letter-spacing: 0.02em; }
.pkm-sf-h em { font-style: normal; }
.pkm-sf-done { color: #FFD60A; }
.pkm-sf-p { margin: 0; font-size: 14px; line-height: 1.45; color: #C9D3EA; }
.pkm-sf-p b { color: #FFFFFF; }
.pkm-sf-wait { margin: 0; font: 700 15px/1.4 'Sora', sans-serif; color: #C9D3EA; }
.pkm-sf-ex { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.pkm-sf-ex img { width: 52px; height: 52px; border-radius: 14px; background: #16223A; image-rendering: pixelated; }

.pkm-sf-rules { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pkm-sf-rules div { padding: 8px 4px; border-radius: 14px; background: #16223A; font-size: 11.5px; color: #9AA8C3; }
.pkm-sf-rules b { display: block; font: 800 18px/1.2 'Sora', sans-serif; color: #FFFFFF; }
.pkm-sf-rules .pkm-sf-plus { color: #3BC48A; } .pkm-sf-rules .pkm-sf-minus { color: #FF6B6B; }
.pkm-sf-go { width: 100%; height: 54px; margin-top: 4px; border: 0; border-radius: 18px; background: #FFD60A; color: #0B1120; font: 800 17px/1 'Sora', sans-serif; box-shadow: 0 5px 0 #B38F00; cursor: pointer; }

.pkm-sf-count { width: 128px; height: 128px; border-radius: 64px; display: flex; align-items: center; justify-content: center; background: #0B1120; color: #FFD60A; font: 400 76px/1 'Luckiest Guy', 'Sora', sans-serif; box-shadow: 0 0 0 10px rgba(11, 17, 32, 0.25), 0 12px 30px rgba(0, 0, 0, 0.4); animation: pkmSfCount 0.65s ease-out both; }

.pkm-sf-boost { font-size: 12.5px; font-weight: 700; color: #FFD60A; }
.pkm-sf-h3 { margin: 6px 0 0; align-self: flex-start; font: 700 14px/1.2 'Sora', sans-serif; color: #C9D3EA; }
.pkm-sf-caught { width: 100%; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pkm-sf-caught div { position: relative; aspect-ratio: 1; border-radius: 14px; background: #16223A; display: flex; align-items: center; justify-content: center; }

.pkm-sf-c-ko { box-shadow: inset 0 0 0 2px #FF5A5F; }

.pkm-sf-c-ok::after { content: attr(data-pts); color: #3BC48A; } .pkm-sf-c-ko::after { content: attr(data-pts); color: #FF6B6B; }

@media (prefers-reduced-motion: reduce) { .pkm-sf-prev img, .pkm-sf-prev-ring, .pkm-sf-prev-pop, .pkm-sf-cloud, .pkm-sf-mon img { animation: none; } }
.pkm-sf-rule-ok b { color: #3BC48A; } .pkm-sf-rule-ko b { color: #FF6B6B; }
/* 3 niveaux du Safari (2026-11-13, porteur) : choix après « GO », niveau rappelé dans la consigne et le bilan, total
   négatif en rouge, avertissement de perte en Normal et Difficile. */
.pkm-sf-lvl1 b { color: #3BC48A; } .pkm-sf-lvl2 b { color: #FFB020; } .pkm-sf-lvl3 b { color: #FF5A4E; }
.pkm-sf-levels { gap: 10px; }
.pkm-sf-lv { position: relative; width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; padding: 12px 14px; border-radius: 18px; border: 2px solid var(--lv); background: linear-gradient(135deg, color-mix(in srgb, var(--lv) 22%, #111A2C), #111A2C 70%); color: #F3F6FC; font: inherit; text-align: left; cursor: pointer; box-shadow: 0 4px 0 color-mix(in srgb, var(--lv) 55%, #000); }

.pkm-sf-lv-speed { display: inline-flex; align-items: center; gap: 2px; padding: 4px 9px; border-radius: 999px; background: rgba(5, 8, 15, 0.55); font: 800 12px/1 'Sora', sans-serif; color: #FFFFFF; white-space: nowrap; }
.pkm-sf-lv-speed i { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 7px solid var(--lv); }
.pkm-sf-lv-speed i:last-of-type { margin-right: 4px; }
.pkm-sf-lv-pts { font-size: 13.5px; line-height: 1.35; color: #C9D3EA; }
.pkm-sf-lv-max { font-size: 12.5px; line-height: 1.35; color: #9AA8C3; }

.pkm-sf-plus { color: #3BC48A; font-weight: 800; } .pkm-sf-minus { color: #FF6B6B; font-weight: 800; }
.pkm-sf-lv-max b.pkm-sf-minus { color: #FF6B6B; }
.pkm-sf-lv-warn { font-size: 12.5px; line-height: 1.35; font-weight: 700; color: #FFC2BD; }
.pkm-sf-lv-safe { font-size: 12.5px; line-height: 1.35; font-weight: 700; color: #9BE7C4; }
.pkm-sf-lvchip { display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--lv); color: var(--lv); background: rgba(5, 8, 15, 0.5); font: 800 12.5px/1 'Sora', sans-serif; }
.pkm-sf-warn { width: 100%; box-sizing: border-box; margin: 0; padding: 10px 12px; border-radius: 14px; border: 1px solid #FF5A4E; background: rgba(224, 69, 58, 0.14); font-size: 13px; line-height: 1.4; color: #FFD9D6; text-align: left; }
.pkm-sf-warn b { color: #FFFFFF; }
.pkm-sf-safe { margin: 0; font-size: 13px; font-weight: 700; color: #9BE7C4; }
.pkm-sf-relv { min-height: 44px; border: 0; background: transparent; color: #B9C5FF; font: 700 13.5px/1 'Sora', sans-serif; cursor: pointer; }
.pkm-sf-pk-neg b, .pkm-sf-pk.pkm-sf-pk-neg { color: #FF6B6B; }
.pkm-sf-gain-neg { background: #E0453A; color: #FFFFFF; box-shadow: 0 8px 22px rgba(224, 69, 58, 0.45); }
.pkm-sf-lossmsg { margin: 0; font-size: 13.5px; line-height: 1.45; color: #FFD9D6; }

.pkm-hh-mid { padding-left: 10px; }

/* Zone de toucher de 44 px autour des soldes (pastilles de 34 px). */
.pkm-bal-row > .pkm-bal-btn { position: relative; }
.pkm-bal-row > .pkm-bal-btn::after { content: ''; position: absolute; left: 0; right: 0; top: -5px; bottom: -5px; }

/* Historique du prix (2026-11-13, porteur) : partie hachurée avant la première cote archivée (6M, 1A) ; lecture au doigt
   (trait, point et bulle « prix · date ») ; « 3M » retiré. */
.pkm-fh-box { touch-action: pan-y; cursor: crosshair; -webkit-user-select: none; user-select: none; }
.pkm-fh-svg { position: relative; z-index: 1; }
.pkm-fh-gap { position: absolute; z-index: 0; left: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: repeating-linear-gradient(135deg, rgba(154, 168, 195, 0.13) 0 6px, rgba(154, 168, 195, 0) 6px 12px); border-right: 1px dashed rgba(154, 168, 195, 0.45); }

.pkm-fh-scrub.pkm-fh-on { opacity: 1; }
.pkm-fh-cur { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid rgba(243, 246, 252, 0.7); }
.pkm-fh-cdot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; box-shadow: 0 0 0 3px #0B1120, 0 0 0 5px rgba(243, 246, 252, 0.6); }
.pkm-fh-tip { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 10px; border-radius: 12px; background: #F3F6FC; color: #0B1120; white-space: nowrap; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45); }
.pkm-fh-tip b { font: 800 14px/1.1 'Sora', sans-serif; font-variant-numeric: tabular-nums; }

.pkm-fh-hint { font-size: 11.5px; color: #9AA8C3; }

/* En-tête (2026-11-13, porteur) : emblème du grade et logo Dropicards remontés ; sur iPhone et iPad, l'en-tête descend
   de 16 px pour sortir de la bande floutée par iOS sous la barre d'état (le badge 2XP y prenait un voile). */
.pkm-hh-mid { position: relative; top: -10px; }
.pkm-ios .pkm-hh { padding-top: 26px !important; }
.pkm-ios .pkm-hh-mid { top: -20px; }
/* Logo Dropicards descendu de 6 px sous l'emblème du grade, qui ne bouge pas (2026-11-13, porteur). */
.pkm-hh-mid > .pkm-hh-grade + img { position: relative; top: 6px; }

/* Badge « 2XP » (2026-11-13, porteur) : couleurs pleines, sans ombre ni halo autour (le « voile ») ; un reflet brillant
   passe toutes les 3 s, seulement à l'intérieur de la bulle (calque de fond, coupé par ses bords arrondis). Au gain, le
   badge grossit un instant. */
.pkm-xpb { box-shadow: none !important; text-shadow: none; background-repeat: no-repeat !important; background-size: 260% 100%, 100% 100% !important; background-position: 140% 0, 0 0; animation: pkmXpbGlint 3s ease-in-out infinite !important; }
.pkm-xpb-pk { background-color: #FFD60A !important; background-image: linear-gradient(115deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.9) 50%, rgba(255, 255, 255, 0) 62%), linear-gradient(#FFD60A, #FFD60A) !important; }
.pkm-xpb-pa { background-color: #9B55F2 !important; background-image: linear-gradient(115deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.7) 50%, rgba(255, 255, 255, 0) 62%), linear-gradient(#9B55F2, #9B55F2) !important; }
@keyframes pkmXpbGlint { 0%, 62% { background-position: 140% 0, 0 0; } 100% { background-position: -40% 0, 0 0; } }
.pkm-xpb.pkm-xpb-hot { animation: pkmXpbGlint 3s ease-in-out infinite, pkmXpbPop 0.55s ease-in-out 4 !important; }
@keyframes pkmXpbPop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25) rotate(-6deg); } }
@media (prefers-reduced-motion: reduce) { .pkm-xpb, .pkm-xpb.pkm-xpb-hot { animation: none !important; } }

/* ——— Safari éclair, retouches (2026-11-13, porteur) ———
   Démonstration avant de jouer (carte du jeu et consigne) : un doigt touche un bon Pokémon (cercle vert, coche,
   « +2 » vert, « Bon Pokémon ! »), puis un mauvais (cercle rouge barré, il tremble, « −1 » rouge, « Erreur ! »), 6 s. */
.pkm-sf-demo { --my: 62px; position: relative; flex: none; width: 100%; height: 182px; border-radius: 18px; overflow: hidden; background: linear-gradient(180deg, #7FD3FF 0%, #BDEBFF 40%, #9BE07A 41%, #5DBB4A 100%); }

.pkm-sf-demo-eau { color: #6BB7FF; }
.pkm-sf-demo-mon { position: absolute; top: var(--my); width: 72px; height: 72px; }
.pkm-sf-demo-ok { left: calc(27% - 36px); }
.pkm-sf-demo-ko { left: calc(73% - 36px); animation: pkmSfDemoShake 6s linear infinite; }
.pkm-sf-demo-mon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 5px 3px rgba(0, 0, 0, 0.25)); }
.pkm-sf-demo-ok img { animation: pkmSfHop 0.5s ease-in-out infinite alternate, pkmSfDemoCaught 6s ease-in-out infinite; }
.pkm-sf-demo-ko img { animation: pkmSfHop 0.5s ease-in-out infinite alternate, pkmSfDemoDim 6s ease-in-out infinite; }
.pkm-sf-demo-ring { position: absolute; inset: -9px; border-radius: 50%; opacity: 0; }
.pkm-sf-demo-ok .pkm-sf-demo-ring { border: 5px solid #22C55E; background: rgba(34, 197, 94, 0.18); box-shadow: 0 0 0 3px #FFFFFF, 0 0 22px 4px rgba(34, 197, 94, 0.85); animation: pkmSfDemoRingOk 6s ease-out infinite; }
.pkm-sf-demo-ok .pkm-sf-demo-ring::after { content: '✓'; position: absolute; right: -8px; top: -8px; width: 24px; height: 24px; border-radius: 12px; background: #22C55E; color: #FFFFFF; border: 2px solid #FFFFFF; font: 900 14px/20px 'Sora', sans-serif; text-align: center; box-sizing: border-box; }
.pkm-sf-demo-ko .pkm-sf-demo-ring { border: 5px solid #FF3B44; background: linear-gradient(45deg, transparent 45%, #FF3B44 45% 55%, transparent 55%), linear-gradient(-45deg, transparent 45%, #FF3B44 45% 55%, transparent 55%), rgba(255, 59, 68, 0.16); box-shadow: 0 0 0 3px #FFFFFF, 0 0 22px 4px rgba(255, 59, 68, 0.8); animation: pkmSfDemoRingKo 6s ease-out infinite; }
.pkm-sf-demo-pop { position: absolute; left: 50%; top: -24px; margin-left: -20px; width: 40px; text-align: center; font: 900 25px/1 'Sora', sans-serif; -webkit-text-stroke: 1.6px #0B1120; paint-order: stroke fill; text-shadow: 0 3px 0 #0B1120; opacity: 0; }
.pkm-sf-demo-ok .pkm-sf-demo-pop { color: #3BE07A; animation: pkmSfDemoPopOk 6s ease-out infinite; }
.pkm-sf-demo-ko .pkm-sf-demo-pop { color: #FF4D55; animation: pkmSfDemoPopKo 6s ease-out infinite; }
.pkm-sf-demo-tag { position: absolute; left: 50%; bottom: -36px; transform: translateX(-50%); padding: 3px 9px; border-radius: 999px; color: #FFFFFF; font: 800 11.5px/1.3 'Sora', sans-serif; white-space: nowrap; opacity: 0; }

   dessiné (web/img/brand/pokedex.svg, gemme des PK sur l'objectif) : le Pokémon du moment sur l'écran de gauche, le solde
   de PA sur celui de droite. Puis l'écran « Route d'évolution » d'après la « Digivolution Route » de Digimon World Dusk
   (vidéo du porteur) : cadre néon magenta, fond bleu quadrillé, étiquettes cyan des étapes, socles lumineux reliés par
   un trait orange, branches en pointillés, étiquette verte sur le Pokémon touché, panneaux « actuel » et « sélectionné »,
   boutons en hexagone. Écrans du dessin, en pourcentage : gauche (45, 100, 120 × 70), droit (232, 92, 140 × 38) sur
   400 × 250. */
.pkm-dex { flex: none; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 16px 12px 14px; border-radius: 24px; border: 1px solid #3B2A6B;
  background: radial-gradient(120% 70% at 50% 0%, rgba(255, 63, 216, 0.18), rgba(255, 63, 216, 0) 60%), #111A2C; color: #F3F6FC; }

  background: repeating-linear-gradient(0deg, rgba(110, 255, 170, 0.06) 0 1px, transparent 1px 3px), radial-gradient(90% 90% at 50% 40%, rgba(60, 220, 140, 0.22), rgba(60, 220, 140, 0) 70%); }

.pkm-dex-fiche { container-type: inline-size; display: flex; flex-direction: column; gap: 10px; margin: 0 10px; padding: 10px; border-radius: 10px; border: 2px solid #8C7BFF; background: rgba(28, 27, 110, 0.85); }
/* Pokémon touché mis en avant (2026-10-30, porteur) : en grand sous un halo de projecteur, sa description à côté. */
.pkm-dex-fiche-top { display: grid; grid-template-columns: 142px minmax(0, 1fr); gap: 10px; align-items: start; }
/* Pokémon centré sur son socle par la mise en page (flex), sans translateX(-50%) : Safari calcule le pourcentage d'une
   animation au moment où elle démarre, avant que le GIF soit chargé (largeur 0), et laissait l'image décalée d'une
   demi-largeur vers la droite, sur le nom (2026-10-29, capture du porteur sur iPhone). */
.pkm-dex-show { position: relative; align-self: start; height: 196px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 24px; box-sizing: border-box; border-radius: 12px;
  background: radial-gradient(70% 90% at 50% 100%, rgba(124, 245, 255, 0.32), rgba(124, 245, 255, 0.08) 55%, rgba(124, 245, 255, 0) 75%), linear-gradient(180deg, rgba(11, 17, 32, 0.55), rgba(11, 17, 32, 0.15)); box-shadow: inset 0 0 0 1px rgba(124, 245, 255, 0.35); }
.pkm-dex-show .pkm-dex-ped { position: absolute; left: 0; right: 0; bottom: 8px; width: 118px; height: 30px; margin: 0 auto; transform: none; }
.pkm-dex-big { position: relative; z-index: 1; flex: none; width: auto; height: 96px; object-fit: contain; object-position: center bottom; image-rendering: pixelated; animation: pkmDexBob2 2.4s ease-in-out infinite; }
@keyframes pkmDexBob2 { 50% { transform: translateY(-3px); } }
.pkm-dex-id { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pkm-dex-id h3 { margin: 0; font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.pkm-dex-genus { font-size: 12.5px; font-weight: 700; color: #7CF5FF; }
.pkm-dex-types { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.pkm-dex-types b { padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25); }
.pkm-dex-info { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; border-radius: 6px; border: 2px solid #8C7BFF; background: rgba(74, 58, 220, 0.62); padding: 4px 8px; }
.pkm-dex-info span { display: flex; flex-direction: column; padding: 4px 0; border-bottom: 1px dotted rgba(255, 255, 255, 0.35); font-size: 12.5px; font-weight: 700; }
.pkm-dex-info em { font-style: normal; font-size: 11px; color: #7CF5FF; }
/* Commandes du Pokédex dessiné (2026-10-29, refaites le même jour : « pas du tout intuitif », porteur). Posées sur le
   dessin (web/img/brand/pokedex.svg, 400 × 250), elles se voient comme de vraies touches :
   - croix en relief (60 × 60 unités autour de la croix dessinée en 157 × 217), flèches claires ; chaque branche est un
     bouton triangulaire (clip-path) : tout le carré se touche, la direction dépend de l'endroit ; la croix bascule
     du côté appuyé ;
   - bouton vert « OK » en relief, qui brille et pulse quand son action est possible ;
   - écran qui change en glissant dans le sens de la flèche (les voyants du haut ne clignotent plus : 2026-11-01). */
.pkm-dex-pad { position: absolute; inset: 0; pointer-events: none; }
.pkm-dex-pad button { pointer-events: auto; -webkit-tap-highlight-color: transparent; }
.pkm-dex-cross { position: absolute; left: calc(128 * 100% / 400); top: calc(174 * 100% / 250); width: calc(62 * 100% / 400); aspect-ratio: 1; transition: transform 0.12s; filter: drop-shadow(0 3px 0 #3A0A0E) drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45)); }
.pkm-dex-cross-c { position: absolute; left: 33.3%; top: 33.3%; width: 33.4%; height: 33.4%; background: radial-gradient(circle at 50% 45%, #3A3A3A 0 28%, #1C1C1C 30%); }
.pkm-dex-k { position: absolute; padding: 0; border: 0; background: transparent; cursor: pointer; }
.pkm-dex-cross .pkm-dex-k { inset: 0; }
.pkm-dex-k-up { clip-path: polygon(0 0, 100% 0, 50% 50%); }
.pkm-dex-k-down { clip-path: polygon(0 100%, 100% 100%, 50% 50%); }
.pkm-dex-k-left { clip-path: polygon(0 0, 0 100%, 50% 50%); }
.pkm-dex-k-right { clip-path: polygon(100% 0, 100% 100%, 50% 50%); }
.pkm-dex-cross .pkm-dex-k > i { position: absolute; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #3B3B3B, #1C1C1C 70%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25); transition: background 0.1s; }
.pkm-dex-k-up > i { left: 33.3%; top: 0; width: 33.4%; height: 33.4%; border-radius: 4px 4px 0 0; }
.pkm-dex-k-down > i { left: 33.3%; bottom: 0; width: 33.4%; height: 33.4%; border-radius: 0 0 4px 4px; }
.pkm-dex-k-left > i { left: 0; top: 33.3%; width: 33.4%; height: 33.4%; border-radius: 4px 0 0 4px; }
.pkm-dex-k-right > i { right: 0; top: 33.3%; width: 33.4%; height: 33.4%; border-radius: 0 4px 4px 0; }
.pkm-dex-k > i > b { width: 46%; height: 40%; background: #E8ECF8; clip-path: polygon(50% 0, 100% 100%, 0 100%); transition: background 0.1s, transform 0.1s; }
.pkm-dex-k-down > i > b { transform: rotate(180deg); }
.pkm-dex-k-left > i > b { transform: rotate(-90deg); }
.pkm-dex-k-right > i > b { transform: rotate(90deg); }
.pkm-dex-cross .pkm-dex-k:active > i, .pkm-dex-cross .pkm-dex-k:focus-visible > i { background: #111111; }
.pkm-dex-cross .pkm-dex-k:active > i > b, .pkm-dex-cross .pkm-dex-k:focus-visible > i > b { background: #FFD60A; }
.pkm-dex-cross .pkm-dex-k:focus-visible { outline: none; }
.pkm-dex-cross:has(.pkm-dex-k-up:active) { transform: perspective(160px) rotateX(14deg); }
.pkm-dex-cross:has(.pkm-dex-k-down:active) { transform: perspective(160px) rotateX(-14deg); }
.pkm-dex-cross:has(.pkm-dex-k-left:active) { transform: perspective(160px) rotateY(-14deg); }
.pkm-dex-cross:has(.pkm-dex-k-right:active) { transform: perspective(160px) rotateY(14deg); }
.pkm-dex-k-a { left: calc(38 * 100% / 400); top: calc(188 * 100% / 250); width: calc(70 * 100% / 400); height: calc(36 * 100% / 250); border-radius: 9px; border: 2px solid #3A0A0E; background: linear-gradient(180deg, #DDFFE6 0%, #A6F7BB 45%, #74E893 100%); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.8), inset 0 -3px 0 rgba(36, 140, 70, 0.45), 0 2px 5px rgba(0, 0, 0, 0.35); color: #0B3A20; font: inherit; font-family: 'Sora', sans-serif; font-size: clamp(12px, 4vw, 17px); font-weight: 800; letter-spacing: 0.04em; display: flex; align-items: center; justify-content: center; transition: transform 0.08s, box-shadow 0.08s; }
.pkm-dex-k-a:active { transform: translateY(1px); box-shadow: inset 0 2px 3px rgba(36, 140, 70, 0.5), 0 1px 2px rgba(0, 0, 0, 0.35); }
.pkm-dex-k-a:focus-visible { outline: 3px solid #FFD60A; outline-offset: 2px; }
.pkm-dex-a-on { animation: pkmDexAGlow 1.6s ease-in-out infinite; }
/* Assez de PA pour débloquer ou faire évoluer le Pokémon affiché (2026-10-31, porteur) : « OK » bondit, brille et un
   reflet le traverse, pour donner envie d'appuyer. */
.pkm-dex-a-go { overflow: hidden; animation: pkmDexAGo 1.1s ease-in-out infinite; }
.pkm-dex-a-go::after { content: ''; position: absolute; top: -20%; bottom: -20%; left: -60%; width: 40%; background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0)); transform: skewX(-18deg); animation: pkmDexShine 1.6s ease-in-out infinite; pointer-events: none; }
@keyframes pkmDexAGo { 0%, 100% { transform: none; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.8), inset 0 -3px 0 rgba(36, 140, 70, 0.45), 0 0 8px 2px rgba(166, 247, 187, 0.55); }
  40% { transform: translateY(-2px) scale(1.06); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.9), inset 0 -3px 0 rgba(36, 140, 70, 0.45), 0 0 20px 6px rgba(166, 247, 187, 0.95); }
  60% { transform: translateY(0) scale(0.98); } }
@keyframes pkmDexShine { 0%, 30% { left: -60%; } 70%, 100% { left: 130%; } }
@keyframes pkmDexAGlow { 50% { box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.8), inset 0 -3px 0 rgba(36, 140, 70, 0.45), 0 0 16px 4px rgba(166, 247, 187, 0.9); } }
/* Voyants : clignent à chaque touche (key change → l'animation repart). */
/* Voyants rouge, jaune, vert du haut : dessinés sur l'appareil, sans clignotement (2026-11-01, porteur). */
/* Écran : le Pokémon arrive du côté de la flèche, avec un petit grésillement. */
/* (opacité et position seulement : un filtre trahirait la silhouette d'un Pokémon pas encore vu) */
.pkm-dex-lcd-l img.pkm-lcd-in { animation: pkmLcdIn 0.3s ease-out, pkmDexBob 2.4s ease-in-out 0.3s infinite; }
.pkm-lcd-left { --dx: -60%; } .pkm-lcd-right { --dx: 60%; } .pkm-lcd-up { --dy: -60%; } .pkm-lcd-down { --dy: 60%; }
@keyframes pkmLcdIn { 0% { opacity: 0; transform: translate(var(--dx, 0), var(--dy, 0)); } 45% { opacity: 1; } 60% { opacity: 0.35; } 75% { opacity: 1; } 100% { opacity: 1; transform: none; } }
/* Première utilisation : flèches qui s'allument à tour de rôle, doigt qui tape, bulle d'explication. */
.pkm-dex-pad-tip0 .pkm-dex-cross { animation: pkmDexHalo 1.6s ease-in-out infinite; }
@keyframes pkmDexHalo { 50% { filter: drop-shadow(0 3px 0 #3A0A0E) drop-shadow(0 0 10px rgba(255, 214, 10, 0.95)); } }
.pkm-dex-pad-tip0 .pkm-dex-k > i > b { animation: pkmDexArrow 2.4s infinite; }
.pkm-dex-pad-tip0 .pkm-dex-k-up > i > b { animation-delay: 0s; } .pkm-dex-pad-tip0 .pkm-dex-k-right > i > b { animation-delay: 0.6s; }
.pkm-dex-pad-tip0 .pkm-dex-k-down > i > b { animation-delay: 1.2s; } .pkm-dex-pad-tip0 .pkm-dex-k-left > i > b { animation-delay: 1.8s; }
@keyframes pkmDexArrow { 0%, 20% { background: #FFD60A; } 25%, 100% { background: #E8ECF8; } }
.pkm-dex-pad-tip1 .pkm-dex-k-a { animation: pkmDexAGlow 1s ease-in-out infinite; }
.pkm-dex-hand { position: absolute; z-index: 2; pointer-events: none; color: #FFFFFF; }
.pkm-dex-hand-cross { left: calc(162 * 100% / 400); top: calc(204 * 100% / 250); }
.pkm-dex-hand-a { left: calc(86 * 100% / 400); top: calc(210 * 100% / 250); }
.pkm-dex-finger { display: block; animation: pkmDexTap 1.2s ease-in-out infinite; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.7)); }
.pkm-dex-finger svg { display: block; fill: #FFFFFF; stroke: #0B1120; stroke-width: 1.4; stroke-linejoin: round; }
@keyframes pkmDexTap { 0%, 100% { transform: translate(6px, 8px) scale(1); } 45% { transform: translate(0, 0) scale(0.92); } 55% { transform: translate(0, 0) scale(0.92); } }
.pkm-dex-tip { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; margin: 2px 10px 0; padding: 10px 12px; border-radius: 12px; border: 2px solid #FFD60A; background: #1A1F4A; color: #FFFFFF; box-shadow: 0 0 18px rgba(255, 214, 10, 0.35); animation: pkmDexTipIn 0.35s ease-out; }
.pkm-dex-tip b { grid-column: 1; font-family: 'Sora', sans-serif; font-size: 14px; color: #FFD60A; }
.pkm-dex-tip span { grid-column: 1; font-size: 13px; line-height: 1.35; color: #E2E6FF; }
.pkm-dex-tip button { grid-column: 2; grid-row: 1 / span 2; min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFD60A; color: #0B1120; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
@keyframes pkmDexTipIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
/* Légende sous l'appareil : les deux commandes dessinées en petit. */
.pkm-dex-legend { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0; padding: 0 6px; font-size: 12px; font-weight: 700; color: #C9D3EA; }
.pkm-dex-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.pkm-dex-lg-cross { width: 16px; height: 16px; flex: none; background: linear-gradient(#E8ECF8, #E8ECF8) center / 100% 34% no-repeat, linear-gradient(#E8ECF8, #E8ECF8) center / 34% 100% no-repeat; }
.pkm-dex-lg-a { flex: none; padding: 1px 6px; border-radius: 5px; border: 1px solid #3A0A0E; background: linear-gradient(180deg, #DDFFE6, #74E893); color: #0B3A20; font-style: normal; font-size: 10.5px; font-weight: 800; }
/* « Ses cartes » : mes cartes du Pokémon, ses cartes les plus chères, toutes ses cartes (2026-10-29). */
.pkm-dex-tcg { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 10px; border: 1px solid rgba(124, 245, 255, 0.45); background: rgba(10, 14, 52, 0.6); }
.pkm-dex-tcg h4 { margin: 0; font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; color: #7CF5FF; }
.pkm-dex-tcg-note, .pkm-dex-tcg-sub { margin: 0; font-size: 12.5px; color: #C9D3EA; }
.pkm-dex-mine { display: flex; flex-direction: column; gap: 4px; }
.pkm-dex-mine-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pkm-dex-mine-h b, .pkm-dex-tcg-h { font-size: 13.5px; font-weight: 800; color: #FFFFFF; }
.pkm-dex-mine-h strong { font-family: 'Sora', sans-serif; font-size: 16px; color: #FFD60A; white-space: nowrap; }
.pkm-dex-mine-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
.pkm-dex-mine-card { position: relative; width: 46px; padding: 0; border: 0; border-radius: 4px; background: transparent; cursor: pointer; }
.pkm-dex-mine-card img { display: block; width: 46px; height: 64px; object-fit: cover; border-radius: 4px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }
.pkm-dex-mine-card b { position: absolute; right: -4px; bottom: -4px; padding: 0 5px; border-radius: 999px; background: #FFD60A; color: #0B1120; font-size: 11px; font-weight: 800; line-height: 17px; }
.pkm-dex-more { font-size: 12px; font-weight: 700; color: #C9D3EA; }
.pkm-dex-top { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.pkm-dex-top button { display: grid; grid-template-columns: 18px 40px minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 8px; background: rgba(255, 255, 255, 0.07); color: #FFFFFF; font: inherit; text-align: left; cursor: pointer; }
.pkm-dex-top i { font-style: normal; font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 800; color: #FFD60A; text-align: center; }
.pkm-dex-top img { width: 40px; height: 56px; object-fit: cover; border-radius: 3px; }
.pkm-dex-top span { display: flex; flex-direction: column; min-width: 0; }
.pkm-dex-top span b { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pkm-dex-top span span { font-size: 11.5px; color: #C9D3EA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pkm-dex-top strong { font-family: 'Sora', sans-serif; font-size: 14px; color: #FFD60A; white-space: nowrap; }
.pkm-dex-tcg-all { display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border: 2px solid #7CF5FF; border-radius: 999px; background: transparent; color: #7CF5FF; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
.pkm-dex-tcg-all svg { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
/* Vu (scan d'une de ses cartes) : en couleur mais assourdi tant qu'il n'est pas attrapé (2026-10-29). */
.pkm-dex-lock.pkm-dex-seen img { filter: saturate(0.75) brightness(0.88); }
/* Ma progression : attrapés et vus, par stade et par type (2026-10-29). */
.pkm-dex-prog { display: flex; flex-direction: column; gap: 6px; margin: 0 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(124, 245, 255, 0.45); background: rgba(10, 14, 52, 0.7); color: #FFFFFF; }
.pkm-dex-prog-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pkm-dex-prog-h b { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; color: #7CF5FF; }
.pkm-dex-prog-h span { font-size: 13px; font-weight: 800; color: #FFD60A; }
.pkm-dex-pbar { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12.5px; }
.pkm-dex-pbar em { font-style: normal; font-weight: 700; color: #C9D3EA; }
.pkm-dex-pbar i { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
.pkm-dex-pbar i b { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #3DDC84, #9FF5C0); }
.pkm-dex-pbar-seen i b { background: linear-gradient(90deg, #7CF5FF, #C9F9FF); }
.pkm-dex-pbar strong { font-family: 'Sora', sans-serif; font-size: 13px; white-space: nowrap; }
/* Barres alignées (2026-11-01, soir, porteur : « 56/56 n'est pas aligné avec les autres ») : colonne du compte de
   largeur fixe, chiffres de même largeur, calés à droite ; les 5 barres commencent et finissent au même endroit. */
.pkm-dex-pbar-s { grid-template-columns: 116px minmax(0, 1fr) 64px; }
.pkm-dex-pbar-s strong { text-align: right; font-variant-numeric: tabular-nums; }
.pkm-dex-prog-tip { margin: 0; font-size: 12px; color: #C9D3EA; }
.pkm-dex-prog-more summary { cursor: pointer; font-size: 13px; font-weight: 800; color: #7CF5FF; min-height: 32px; display: flex; align-items: center; }
.pkm-dex-prog-st { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 10px; }
.pkm-dex-prog-ty { display: flex; flex-wrap: wrap; gap: 6px; }
.pkm-dex-prog-ty button { min-height: 32px; padding: 4px 10px; border: 0; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25); }
.pkm-dex-prog-ty b { font-weight: 800; opacity: 0.9; }
.pkm-dex-text { margin: 6px 0 0; padding: 8px 10px; border-radius: 6px; background: #0E1626; color: #B8FFD2; font-size: 13px; line-height: 1.5; font-weight: 600; box-shadow: inset 0 0 12px rgba(60, 220, 140, 0.18); }
.pkm-dex-secret { margin: 6px 0 0; padding: 8px 10px; border-radius: 8px; background: rgba(11, 17, 32, 0.6); font-size: 12.5px; font-weight: 700; color: #E2E6FF; }
.pkm-dex-act-btn { min-height: 50px; border: 0; border-radius: 999px; background: #FFD60A; color: #0B1120; font: inherit; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 0 0 3px rgba(255, 214, 10, 0.25), 0 6px 16px rgba(0, 0, 0, 0.35); }
.pkm-dex-act-off { background: #3A3F78; color: #E2E6FF; box-shadow: none; cursor: default; }
.pkm-dex-rules { margin: 0; padding: 0 4px; font-size: 12px; line-height: 1.45; color: #9AA8C3; }
/* « Mon Pokédex » : liste complète */
.pkm-dexl-wrap { position: absolute; inset: 0; z-index: 32; display: flex; flex-direction: column; background: rgba(3, 6, 14, 0.7); }
.pkm-dexl { flex: 1; min-height: 0; margin-top: 28px; display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 0; border-radius: 26px 26px 0 0; border: 3px solid #FF3FD8; border-bottom: 0; color: #FFFFFF;
  background: linear-gradient(rgba(96, 120, 255, 0.14) 1px, transparent 1px) 0 0 / 12px 12px, linear-gradient(90deg, rgba(96, 120, 255, 0.14) 1px, transparent 1px) 0 0 / 12px 12px, #15166A; animation: pkmDexlUp 0.48s cubic-bezier(0.32, 0.72, 0, 1) both; }
.pkm-dexl-wrap { animation: pkmDexlFade 0.32s ease-out both; }
@keyframes pkmDexlUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes pkmDexlFade { from { background-color: rgba(3, 6, 14, 0); } to { background-color: rgba(3, 6, 14, 0.7); } }
@media (prefers-reduced-motion: reduce) { .pkm-dexl, .pkm-dexl-wrap { animation: none; } }
.pkm-dexl-head { display: flex; align-items: center; gap: 10px; }
.pkm-dexl-head img { flex: none; width: 56px; height: 35px; }
.pkm-dexl-head > span { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 12.5px; color: #E2E6FF; }
.pkm-dexl-head h2 { margin: 0; font-family: 'Luckiest Guy', 'Sora', sans-serif; font-weight: 400; font-size: 24px; color: #FFD60A; -webkit-text-stroke: 1.2px #3A0A3A; paint-order: stroke fill; }
.pkm-dexl-x { flex: none; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #8C7BFF; background: #1C1B6E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.pkm-dexl-x svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

/* Boîte mystère (2026-11-12) : même colonne que les photos et les tickets. */

/* Abonnement Premium (2026-11-06, porteur) : bannière dorée qui brille et écran de l'offre. */
.pkm-prem-banner { position: relative; flex: none; width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 12px; border: 2px solid #FFD60A; border-radius: 22px; overflow: hidden; background: linear-gradient(115deg, #E9EDF3 0%, #C3CBD8 22%, #FFFFFF 42%, #B4BDCB 62%, #EEF1F6 82%, #CDD4DF 100%); color: #141A26; font: inherit; text-align: left; cursor: pointer; box-shadow: 0 0 0 3px rgba(255, 214, 10, 0.35), 0 0 22px rgba(255, 200, 0, 0.55), 0 10px 26px rgba(20, 26, 38, 0.35); overflow: visible; isolation: isolate; }
.pkm-prem-banner::after { content: ''; position: absolute; inset: -2px; border-radius: 22px; box-shadow: 0 0 0 4px rgba(255, 214, 10, 0.6), 0 0 30px rgba(255, 200, 0, 0.8); opacity: 0.2; pointer-events: none; animation: pkmPremGold 2.8s ease-in-out infinite; will-change: opacity; }
.pkm-prem-shinebox { position: absolute; inset: 0; border-radius: 20px; overflow: hidden; pointer-events: none; }
@keyframes pkmPremGold { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
.pkm-prem-banner:active { transform: scale(0.985); }
.pkm-prem-shine { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; transform: translateX(-160%) skewX(-18deg); will-change: transform; background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0)); animation: pkmPremShine 3.2s ease-in-out infinite; pointer-events: none; }
@keyframes pkmPremShine { 0%, 55% { transform: translateX(-160%) skewX(-18deg); } 100% { transform: translateX(330%) skewX(-18deg); } }
.pkm-prem-crown { position: relative; flex: none; width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 35%, #FFF3A6, #FFD60A 55%, #E09A00); box-shadow: 0 0 18px rgba(255, 214, 10, 0.7); animation: pkmPremPulse 2.4s ease-in-out infinite; }
@keyframes pkmPremPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.pkm-prem-btxt { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pkm-prem-btxt b { font-family: 'Sora', sans-serif; font-size: 16.5px; letter-spacing: -0.01em; color: #10151F; }
.pkm-prem-btxt span { font-size: 12.5px; line-height: 1.35; color: #2E3646; }
.pkm-prem-btxt i { font-style: normal; font-size: 12.5px; font-weight: 800; color: #FFE46B; }
.pkm-prem-go { position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; background: #FFD60A; color: #2B124C; box-shadow: 0 0 0 2px #B8860B; }
.pkm-prem-go svg { display: block; margin-left: 2px; }
.pkm-prem-sheet { position: relative; width: 100%; max-width: 480px; max-height: 92vh; max-height: calc(100svh - env(safe-area-inset-top, 0px) - 44px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; will-change: transform; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 0 16px 24px; border-radius: 28px 28px 0 0; border-top: 1px solid rgba(255, 230, 120, 0.5); background: #120B24; color: #F3F6FC; }
.pkm-prem-hero { position: relative; margin: 0 -16px; padding: 34px 16px 18px; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; background: radial-gradient(120% 100% at 50% 0%, #7B3FF2 0%, #3A1A78 55%, #120B24 100%); }
.pkm-prem-crown-xl { width: 76px; height: 76px; border-radius: 24px; }
.pkm-prem-hero h2 { margin: 6px 0 0; font-family: 'Sora', sans-serif; font-size: 24px; }
.pkm-prem-hero h2 em { font-style: normal; background: linear-gradient(90deg, #FFE46B, #FFD60A, #FFB000); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pkm-prem-hero p { margin: 0; font-size: 14px; color: #E2D6FF; }

.pkm-prem-perks li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(178, 107, 255, 0.1); border: 1px solid rgba(178, 107, 255, 0.25); }
.pkm-prem-ico { flex: none; width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: rgba(255, 214, 10, 0.16); }

.pkm-prem-perks small { display: block; font-size: 12.5px; line-height: 1.35; color: #BDB0DA; }
.pkm-prem-plans { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 4px; }
.pkm-prem-plan { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 22px 8px 14px; border-radius: 20px; border: 2px solid #3A2B5E; background: #1B1233; color: #F3F6FC; font: inherit; cursor: pointer; }
.pkm-prem-plan-on { border-color: #FFD60A; background: linear-gradient(180deg, rgba(255, 214, 10, 0.16), rgba(255, 214, 10, 0.02)), #1B1233; box-shadow: 0 0 22px rgba(255, 214, 10, 0.28); }
.pkm-prem-tag { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 3px 10px; border-radius: 999px; background: #FFD60A; color: #2B124C; font-size: 11px; font-weight: 800; }
.pkm-prem-pname { font-size: 13.5px; font-weight: 700; color: #CFC3EE; }
.pkm-prem-price { font-family: 'Sora', sans-serif; font-size: 24px; }

@media (prefers-reduced-motion: reduce) { .pkm-prem-shine, .pkm-prem-crown { animation: none; } }
