:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
/* Démo Dropicards : un seul thème sombre, celui de l'app. Téléphone plein écran ; sur ordinateur, téléphone centré. */
:root { --ground: #05080F; --app: #0B1120; --ink: #F3F6FC; --muted: #7D8BA8; --accent: #A8B6FF; --bezel: #161E2F; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
#shell { height: 100%; box-sizing: border-box; padding-inline: 16px; padding-block: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
#app { width: 390px; max-width: 100%; height: 844px; max-height: calc(100% - 34px); flex: none; border-radius: 42px; overflow: hidden; background: var(--app); box-shadow: 0 0 0 10px var(--bezel), 0 30px 80px rgba(0, 0, 0, 0.6); }
.pkm-caption { margin: 0; max-width: 390px; font-size: 12px; line-height: 1.4; color: var(--muted); text-align: center; }
@media (max-width: 520px) {
  #shell { padding-inline: 0; padding-block: 0; }
  #app { width: 100%; height: 100%; max-height: none; border-radius: 0; box-shadow: none; }
  .pkm-caption { display: none; }
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, button { -webkit-tap-highlight-color: transparent; }
/* Recherche de l'accueil : sa propre croix (44 px), pas celle du navigateur. */
input[aria-label="Rechercher dans le catalogue"]::-webkit-search-cancel-button { display: none; }
@keyframes pkmSpin { to { transform: rotate(360deg); } }
/* Compagnon de l'accueil : léger flottement, arrêté si l'utilisateur limite les animations. */
@keyframes pkmFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
/* Radar de l'accueil : une boutique apparaît (et devient cliquable) quand le faisceau passe sur elle. */
@keyframes pkmReveal { from { opacity: 0; visibility: hidden; } to { opacity: 1; visibility: visible; } }
.pkm-buddy { animation: pkmFloat 2.8s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .pkm-buddy { animation: none; } }
/* Petit radar du titre « Boutiques autour de toi » : un point s'allume quand le faisceau passe dessus. */
@keyframes pkmBlip { 0% { opacity: 1; transform: scale(1.3); } 70%, 100% { opacity: 0.2; transform: scale(1); } }
/* Montant de la collection à la manière du logo : lettres blanches, contour noir (8 directions) et ombre portée noire. */
.pkm-logo-text { text-shadow: 0.05em 0 0 #111111, -0.05em 0 0 #111111, 0 0.05em 0 #111111, 0 -0.05em 0 #111111, 0.036em 0.036em 0 #111111, -0.036em 0.036em 0 #111111, 0.036em -0.036em 0 #111111, -0.036em -0.036em 0 #111111, 0.09em 0.06em 0 #111111, 0.076em 0.096em 0 #111111, 0.04em 0.11em 0 #111111, 0.076em 0.024em 0 #111111, 0.004em 0.096em 0 #111111; }
/* PK gagnés : « +10 PK » sous le compteur, qui monte puis s'efface (affiché sans mouvement si l'utilisateur limite les animations). */
@keyframes pkmGain { 0% { opacity: 0; transform: translateY(6px); } 12%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-4px); } }
.pkm-gain { animation: pkmGain 2.6s ease-out forwards; }
@media (prefers-reduced-motion: reduce) { .pkm-gain { animation: none; } }
/* Compte : texte qui s'écrit lettre par lettre (boîte de dialogue), triangle qui clignote, blocs qui se déplient. */
@keyframes pkmShow { to { opacity: 1; } }
@keyframes pkmBlink { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes pkmRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.pkm-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pkm-type-c { opacity: 0; animation: pkmShow 1ms linear forwards; }
.pkm-dialog-next { opacity: 0; animation: pkmBlink 0.9s steps(1) infinite; }
.pkm-rise { animation: pkmRise 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.pkm-chevron { transition: transform 0.25s ease; }
@media (prefers-reduced-motion: reduce) { .pkm-type-c, .pkm-rise, .pkm-dialog-next { animation: none; opacity: 1; } .pkm-chevron { transition: none; } }
/* Vues et bulle d'infos (views.js) : menu et bulle apparaissent en douceur ; « + » tourne en « × ». */
@keyframes pkmPop { from { opacity: 0; transform: translateY(-6px) scale(0.97); } to { opacity: 1; transform: none; } }
.pkm-pop { animation: pkmPop 0.18s ease-out both; transform-origin: top right; }
.pkm-plus { transition: transform 0.2s ease; }
@media (prefers-reduced-motion: reduce) { .pkm-pop { animation: none; } .pkm-plus { transition: none; } }
/* Mode Admin, animations désactivées : plus aucune animation ni transition. */
section[aria-label="Panneau Admin"] > *, section[aria-label="Informations légales"] > *, section[aria-label="Modifier l’ajout"] > * { flex-shrink: 0; }
html.pkm-calm *, html.pkm-calm *::before, html.pkm-calm *::after { animation: none !important; transition: none !important; }
/* Scan : ligne de lecture qui parcourt le cadre (arrêtée si l'utilisateur limite les animations : classe pkm-anim). */
@keyframes pkmScanLine { from { top: 4%; } to { top: 94%; } }

<body>
<!-- Animation d'entrée « Ouverture de booster » (K1, 2026-10-09), insérée par build.mjs dans web/index.html.
     Un booster Dropicards tombe et tremble ; l'éclair du logo le déchire ; le haut s'envole ; cinq cartes jaillissent en
     éventail ; la carte « O » grandit et laisse place au logo. 2 s au plus ; un appui la passe.
     Version complète au premier lancement de la journée, version éclair (0,6 s) ensuite ; fondu simple si l'utilisateur
     limite les animations ; rien si le mode Admin coupe les animations, ni dans un navigateur piloté par des tests
     (?intro=1 force la version complète, ?intro=court la version éclair). Elle joue pendant le chargement de l'app, sans la retarder. Dessin en SVG, animations en CSS. -->
<style>
#pkm-intro { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer;
  background: radial-gradient(120% 55% at 0% 0%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%), radial-gradient(110% 60% at 100% 100%, rgba(255, 140, 0, 0.28), rgba(255, 140, 0, 0) 70%), linear-gradient(165deg, #FFE45C 0%, #FFD60A 45%, #FFB703 100%); }
#pkm-intro svg { width: min(100vw, 460px); height: auto; max-height: 100vh; overflow: visible; }
#pkm-intro g, #pkm-intro path, #pkm-intro rect, #pkm-intro image { transform-box: fill-box; transform-origin: center; }
#pkm-intro.pi-out { animation: piOut 0.22s ease-in forwards; }
#pkm-intro.pi-full { animation: piOut 0.22s ease-in 1.78s forwards; }
#pkm-intro.pi-short { animation: piOut 0.2s ease-in 0.42s forwards; }
#pkm-intro.pi-calm { animation: piOut 0.3s ease-in 0.35s forwards; }
@keyframes piOut { to { opacity: 0; visibility: hidden; } }
/* Version complète */
.pi-full .pi-pack { animation: piDrop 0.36s cubic-bezier(0.2, 0.9, 0.3, 1.25) both, piShake 0.28s ease-in-out 0.36s 1, piFall 0.42s cubic-bezier(0.5, 0, 0.9, 0.4) 1.08s forwards; }
.pi-full .pi-top { animation: piRip 0.36s cubic-bezier(0.3, 0.6, 0.4, 1) 0.7s forwards; }
.pi-full .pi-bolt { opacity: 0; animation: piBolt 0.3s ease-out 0.6s both; }
.pi-full .pi-flash { opacity: 0; animation: piFlash 0.22s ease-out 0.66s both; }
.pi-full .pi-card { opacity: 0; animation: piFan 0.46s cubic-bezier(0.2, 0.9, 0.3, 1.15) both, piAway 0.3s ease-in 1.26s forwards; }
.pi-full .pi-c1 { --x: -118px; --y: -228px; --r: -32deg; animation-delay: 0.8s, 1.26s; }
.pi-full .pi-c2 { --x: -60px; --y: -262px; --r: -16deg; animation-delay: 0.83s, 1.29s; }
.pi-full .pi-c4 { --x: 60px; --y: -262px; --r: 16deg; animation-delay: 0.86s, 1.29s; }
.pi-full .pi-c5 { --x: 118px; --y: -228px; --r: 32deg; animation-delay: 0.89s, 1.26s; }
.pi-full .pi-c3 { --x: 0px; --y: -280px; --r: 0deg; animation: piFan 0.46s cubic-bezier(0.2, 0.9, 0.3, 1.15) 0.8s both, piGrow 0.36s cubic-bezier(0.3, 0.7, 0.3, 1) 1.22s forwards; }
.pi-full .pi-logo { opacity: 0; animation: piPop 0.34s cubic-bezier(0.2, 0.9, 0.3, 1.3) 1.42s both; }
.pi-full .pi-spark { opacity: 0; animation: piSpark 0.5s ease-out 1.5s both; }
/* Version éclair et animations réduites : le logo seul */
.pi-short .pi-pack, .pi-short .pi-card, .pi-short .pi-bolt, .pi-short .pi-flash, .pi-short .pi-spark,
.pi-calm .pi-pack, .pi-calm .pi-card, .pi-calm .pi-bolt, .pi-calm .pi-flash, .pi-calm .pi-spark { display: none; }
.pi-short .pi-logo { animation: piPop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
@keyframes piDrop { from { opacity: 0; transform: translateY(-120px) scale(0.86); } to { opacity: 1; transform: none; } }
@keyframes piShake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-3.5deg); } 45% { transform: rotate(3.5deg); } 70% { transform: rotate(-2deg); } 85% { transform: rotate(1.5deg); } }
@keyframes piFall { to { transform: translateY(520px) rotate(8deg); opacity: 0; } }
@keyframes piRip { to { transform: translate(130px, -150px) rotate(38deg); opacity: 0; } }
@keyframes piBolt { 0% { opacity: 0; transform: scale(0.4) rotate(-12deg); } 35% { opacity: 1; transform: scale(1.12) rotate(4deg); } 100% { opacity: 0; transform: scale(1.3); } }
@keyframes piFlash { 0% { opacity: 0; } 30% { opacity: 0.85; } 100% { opacity: 0; } }
@keyframes piFan { 0% { opacity: 0; transform: translate(0, 40px) rotate(0); } 12% { opacity: 1; } 100% { opacity: 1; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }

<script>
(function () {
  var el = document.getElementById('pkm-intro');
  if (!el) return;
  var done = function () { if (el && el.parentNode) el.parentNode.removeChild(el); el = null; };
  try {
    var q = location.search, force = /[?&]intro=(1|court)(&|$)/.test(q);
    var admin = {};
    try { admin = (JSON.parse(localStorage.getItem('pkm-collection-v1') || '{}') || {}).admin || {}; } catch (e) { admin = {}; }
    if (!force && (navigator.webdriver || /[?&]intro=0(&|$)/.test(q) || (admin.on && admin.flags && admin.flags.motion === false))) { done(); return; }
    var d = new Date(), day = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(), seen = '';
    try { seen = localStorage.getItem('pkm-intro') || ''; localStorage.setItem('pkm-intro', day); } catch (e) { seen = ''; }
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.className = calm ? 'pi-calm' : (/[?&]intro=court(&|$)/.test(q) || (seen === day && !/[?&]intro=1(&|$)/.test(q)) ? 'pi-short' : 'pi-full');
    el.addEventListener('animationend', function (e) { if (e.target === el) done(); });
    el.addEventListener('click', function () { if (el) { el.className = 'pi-out'; } });
    setTimeout(done, 3000); // filet de sécurité
  } catch (e) { done(); }
})();
</script>
