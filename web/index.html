:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
/* Démo Dropicards : un seul thème sombre, celui de l'app. Téléphone plein écran ; sur ordinateur, téléphone centré. */
:root { --ground: #05080F; --app: #0B1120; --ink: #F3F6FC; --muted: #7D8BA8; --accent: #A8B6FF; --bezel: #161E2F; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
#shell { height: 100%; box-sizing: border-box; padding-inline: 16px; padding-block: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
#app { width: 390px; max-width: 100%; height: 844px; max-height: calc(100% - 34px); flex: none; border-radius: 42px; overflow: hidden; background: var(--app); box-shadow: 0 0 0 10px var(--bezel), 0 30px 80px rgba(0, 0, 0, 0.6); }
.pkm-caption { margin: 0; max-width: 390px; font-size: 12px; line-height: 1.4; color: var(--muted); text-align: center; }
@media (max-width: 520px) {
  #shell { padding-inline: 0; padding-block: 0; }
  #app { width: 100%; height: 100%; max-height: none; border-radius: 0; box-shadow: none; }
  .pkm-caption { display: none; }
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, button { -webkit-tap-highlight-color: transparent; }
/* Recherche de l'accueil : sa propre croix (44 px), pas celle du navigateur. */
input[aria-label="Rechercher dans le catalogue"]::-webkit-search-cancel-button { display: none; }
@keyframes pkmSpin { to { transform: rotate(360deg); } }
/* Compagnon de l'accueil : léger flottement, arrêté si l'utilisateur limite les animations. */
@keyframes pkmFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
/* Radar de l'accueil : une boutique apparaît (et devient cliquable) quand le faisceau passe sur elle. */
@keyframes pkmReveal { from { opacity: 0; visibility: hidden; } to { opacity: 1; visibility: visible; } }
.pkm-buddy { animation: pkmFloat 2.8s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .pkm-buddy { animation: none; } }
/* Petit radar du titre « Boutiques autour de toi » : un point s'allume quand le faisceau passe dessus. */
@keyframes pkmBlip { 0% { opacity: 1; transform: scale(1.3); } 70%, 100% { opacity: 0.2; transform: scale(1); } }
/* Montant de la collection à la manière du logo : lettres blanches, contour noir (8 directions) et ombre portée noire. */
/* Montant de la collection (2026-10-12) : police droite (Sora), blanc, contour noir net et ombre droite. */
.pkm-strict-text { text-shadow: 0.045em 0 0 #111111, -0.045em 0 0 #111111, 0 0.045em 0 #111111, 0 -0.045em 0 #111111, 0.032em 0.032em 0 #111111, -0.032em 0.032em 0 #111111, 0.032em -0.032em 0 #111111, -0.032em -0.032em 0 #111111, 0 0.09em 0 #111111, 0.03em 0.09em 0 #111111, -0.03em 0.09em 0 #111111; }
.pkm-logo-text { text-shadow: 0.05em 0 0 #111111, -0.05em 0 0 #111111, 0 0.05em 0 #111111, 0 -0.05em 0 #111111, 0.036em 0.036em 0 #111111, -0.036em 0.036em 0 #111111, 0.036em -0.036em 0 #111111, -0.036em -0.036em 0 #111111, 0.09em 0.06em 0 #111111, 0.076em 0.096em 0 #111111, 0.04em 0.11em 0 #111111, 0.076em 0.024em 0 #111111, 0.004em 0.096em 0 #111111; }
/* PK gagnés : « +10 PK » sous le compteur, qui monte puis s'efface (affiché sans mouvement si l'utilisateur limite les animations). */
@keyframes pkmGain { 0% { opacity: 0; transform: translateY(6px); } 12%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-4px); } }
.pkm-gain { animation: pkmGain 2.6s ease-out forwards; }
@media (prefers-reduced-motion: reduce) { .pkm-gain { animation: none; } }
/* Compte : texte qui s'écrit lettre par lettre (boîte de dialogue), triangle qui clignote, blocs qui se déplient. */
@keyframes pkmShow { to { opacity: 1; } }
@keyframes pkmBlink { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes pkmRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.pkm-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pkm-type-c { opacity: 0; animation: pkmShow 1ms linear forwards; }
.pkm-dialog-next { opacity: 0; animation: pkmBlink 0.9s steps(1) infinite; }
.pkm-rise { animation: pkmRise 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.pkm-chevron { transition: transform 0.25s ease; }
@media (prefers-reduced-motion: reduce) { .pkm-type-c, .pkm-rise, .pkm-dialog-next { animation: none; opacity: 1; } .pkm-chevron { transition: none; } }
/* Vues et bulle d'infos (views.js) : menu et bulle apparaissent en douceur ; « + » tourne en « × ». */
@keyframes pkmPop { from { opacity: 0; transform: translateY(-6px) scale(0.97); } to { opacity: 1; transform: none; } }
.pkm-pop { animation: pkmPop 0.18s ease-out both; transform-origin: top right; }
.pkm-plus { transition: transform 0.2s ease; }
@media (prefers-reduced-motion: reduce) { .pkm-pop { animation: none; } .pkm-plus { transition: none; } }
/* Mode Admin, animations désactivées : plus aucune animation ni transition. */
section[aria-label="Panneau Admin"] > *, section[aria-label="Informations légales"] > *, section[aria-label="Modifier l’ajout"] > *, section[aria-label="Importer un tableur"] > * { flex-shrink: 0; }
html.pkm-calm *, html.pkm-calm *::before, html.pkm-calm *::after { animation: none !important; transition: none !important; }
/* « Toutes les séries » : barre des séries en verre sombre, collée en haut pendant le défilement. */
nav[aria-label="Aller à une série"] { background: rgba(10, 17, 48, 0.88); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); }
/* Scan : ligne de lecture qui parcourt le cadre (arrêtée si l'utilisateur limite les animations : classe pkm-anim). */
@keyframes pkmScanLine { from { top: 4%; } to { top: 94%; } }
/* ——— Fonds animés (K2) et micro-animations (K3) ; fx.js choisit le décor ; 2026-10-09 ———
   Calque décoratif derrière l'app (#pkm-fx, 8 éléments), en CSS seulement : rien ne tourne en JavaScript.
   Décor selon le contexte (classes sur <html>) : accueil (reflet holo et étincelles), Marché (gemmes qui montent),
   Territoire (ondes radar), compagnons à thème (bulles pour Kyogre, braises pour Groudon, éclairs et pluie pour
   Rayquaza). Réglages › « Fonds animés » : Animés, Calmes (deux fois plus lents, plus discrets) ou Sans.
   Arrêtés si l'app est cachée, si l'appareil demande moins d'animations ou si l'Admin coupe les animations. */
.pkm-root { isolation: isolate; }
#pkm-fx { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; display: none;
  /* En-tête toujours net (2026-10-25, porteur) : ni reflet ni étincelle derrière les PK, le logo et l'avatar. */
  -webkit-mask-image: linear-gradient(180deg, transparent 0, transparent 150px, #000 230px); mask-image: linear-gradient(180deg, transparent 0, transparent 150px, #000 230px); }
html.pkm-fx-on:not(.pkm-classic) #pkm-fx { display: block; }
#pkm-fx i { position: absolute; display: block; opacity: 0; will-change: transform, opacity; }
html.pkm-fx-paused #pkm-fx i, html.pkm-fx-paused #pkm-fx::before { animation-play-state: paused !important; }
html.pkm-fx-calm #pkm-fx i, html.pkm-fx-calm #pkm-fx::before { animation-duration: var(--fx-d2, 30s) !important; }
html.pkm-fx-calm #pkm-fx { opacity: 0.6; }

/* Accueil (et autres écrans) : reflet holo qui traverse lentement, étincelles. */
#pkm-fx::before { content: ''; position: absolute; inset: -40% -60%; opacity: 0;
  background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, 0.16) 46%, rgba(255, 190, 240, 0.1) 50%, rgba(170, 230, 255, 0.12) 54%, transparent 62%); }
html.pkm-fx-holo #pkm-fx::before { animation: pkmFxHolo 11s ease-in-out infinite; --fx-d2: 22s; }
@keyframes pkmFxHolo { 0% { opacity: 0; transform: translateX(-45%); } 15% { opacity: 1; } 55% { opacity: 1; transform: translateX(45%); } 70%, 100% { opacity: 0; transform: translateX(45%); } }
html.pkm-fx-holo #pkm-fx i { width: 10px; height: 10px; animation: pkmFxSpark 6s ease-in-out infinite;
  background: radial-gradient(circle, #FFFFFF 0 18%, transparent 20%), linear-gradient(0deg, transparent 44%, rgba(255, 255, 255, 0.9) 47% 53%, transparent 56%), linear-gradient(90deg, transparent 44%, rgba(255, 255, 255, 0.9) 47% 53%, transparent 56%); }
@keyframes pkmFxSpark { 0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); } 50% { opacity: 0.85; transform: scale(1) rotate(45deg); } }

/* Marché : petites gemmes qui montent. */
html.pkm-fx-gems #pkm-fx i { width: 12px; height: 14px; bottom: -20px; animation: pkmFxRise 14s linear infinite;
  clip-path: polygon(50% 0, 100% 30%, 100% 70%, 50% 100%, 0 70%, 0 30%); background: linear-gradient(160deg, #FFF1A0, #FFD60A 45%, #E8A000); }
@keyframes pkmFxRise { 0% { opacity: 0; transform: translateY(0) rotate(0deg); } 10% { opacity: 0.55; } 85% { opacity: 0.45; } 100% { opacity: 0; transform: translateY(-110vh) rotate(160deg); } }

/* Territoire : ondes radar depuis le bas de l'écran. */
html.pkm-fx-radar #pkm-fx i { left: 50%; bottom: 8%; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.35); animation: pkmFxWave 6s ease-out infinite; }
@keyframes pkmFxWave { 0% { opacity: 0.7; transform: scale(0.2); } 100% { opacity: 0; transform: scale(14); } }

/* Kyogre (océan) : bulles ; Groudon (volcan) : braises. */
html.pkm-fx-bubbles #pkm-fx i { bottom: -20px; width: 14px; height: 14px; border-radius: 50%; animation: pkmFxRise 12s ease-in infinite;
  border: 1.5px solid rgba(220, 245, 255, 0.55); background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.5), transparent 45%); }
html.pkm-fx-embers #pkm-fx i { bottom: -10px; width: 5px; height: 5px; border-radius: 50%; animation: pkmFxRise 9s ease-in infinite;
  background: #FFB347; box-shadow: 0 0 8px 2px rgba(255, 120, 40, 0.7); }

/* Rayquaza (ouragan) : pluie fine et éclair. */
html.pkm-fx-storm #pkm-fx i { top: -30%; width: 1.5px; height: 70px; background: linear-gradient(transparent, rgba(220, 255, 245, 0.45));
  transform: rotate(14deg); animation: pkmFxRain 1.6s linear infinite; --fx-d2: 3.2s; }
@keyframes pkmFxRain { 0% { opacity: 0; transform: translate(0, 0) rotate(14deg); } 10% { opacity: 1; } 100% { opacity: 0.6; transform: translate(-30vh, 140vh) rotate(14deg); } }
html.pkm-fx-storm #pkm-fx::before { inset: 0; background: rgba(230, 255, 250, 0.22); animation: pkmFxFlash 13s linear infinite; --fx-d2: 26s; }
@keyframes pkmFxFlash { 0%, 90%, 93%, 100% { opacity: 0; } 91%, 94% { opacity: 1; } }

/* Positions et décalages des 8 éléments (communs à tous les décors). */
#pkm-fx i:nth-child(1) { left: 8%; top: 18%; animation-delay: 0s; }
#pkm-fx i:nth-child(2) { left: 26%; top: 62%; animation-delay: -1.7s; }
#pkm-fx i:nth-child(3) { left: 44%; top: 34%; animation-delay: -3.1s; }
#pkm-fx i:nth-child(4) { left: 63%; top: 80%; animation-delay: -4.6s; }
#pkm-fx i:nth-child(5) { left: 81%; top: 22%; animation-delay: -2.4s; }
#pkm-fx i:nth-child(6) { left: 92%; top: 55%; animation-delay: -5.5s; }
#pkm-fx i:nth-child(7) { left: 15%; top: 88%; animation-delay: -7.2s; }
#pkm-fx i:nth-child(8) { left: 53%; top: 8%; animation-delay: -8.8s; }
html.pkm-fx-radar #pkm-fx i:nth-child(n) { left: 50%; top: auto; }
html.pkm-fx-radar #pkm-fx i:nth-child(2) { animation-delay: -2s; } html.pkm-fx-radar #pkm-fx i:nth-child(3) { animation-delay: -4s; }
html.pkm-fx-radar #pkm-fx i:nth-child(n+4) { display: none; }
html.pkm-fx-gems #pkm-fx i:nth-child(n), html.pkm-fx-bubbles #pkm-fx i:nth-child(n), html.pkm-fx-embers #pkm-fx i:nth-child(n) { top: auto; }
html.pkm-fx-storm #pkm-fx i:nth-child(n) { top: -30%; }

/* ——— Micro-animations (K3) : éléments ajoutés au-dessus de l'app, retirés après l'animation ——— */
.pkm-burst { position: fixed; z-index: 80; width: 0; height: 0; pointer-events: none; }
.pkm-burst i { position: absolute; left: -6px; top: -8px; width: 12px; height: 16px; opacity: 0; animation: pkmBurst 0.9s cubic-bezier(0.15, 0.7, 0.3, 1) forwards; }
.pkm-burst-card i { border-radius: 2px; background: linear-gradient(160deg, #FFFFFF, #FFE36B 60%, #FFB800); box-shadow: 0 0 0 1px rgba(17, 17, 17, 0.6); }
.pkm-burst-gem i { width: 11px; height: 13px; clip-path: polygon(50% 0, 100% 30%, 100% 70%, 50% 100%, 0 70%, 0 30%); background: linear-gradient(160deg, #FFF1A0, #FFD60A 45%, #E8A000); animation-name: pkmGemRain; animation-duration: 1.1s; }
.pkm-burst-star i { width: 14px; height: 14px; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: #FFE36B; animation-duration: 1.2s; }
@keyframes pkmBurst { 0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(0.6); } 100% { opacity: 0; transform: translate(var(--bx), var(--by)) rotate(var(--br)) scale(1); } }
@keyframes pkmGemRain { 0% { opacity: 0; transform: translate(0, 0) scale(0.5); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--bx), calc(var(--by) * -1 + 60px)) rotate(var(--br)) scale(1); } }
/* Palier franchi ou compagnon débloqué : halo sous le message. */
@keyframes pkmHalo { 0% { box-shadow: 0 0 0 0 rgba(255, 214, 10, 0.75); } 100% { box-shadow: 0 0 0 18px rgba(255, 214, 10, 0); } }
.pkm-halo { animation: pkmHalo 0.9s ease-out 2; }
@media (prefers-reduced-motion: reduce) { #pkm-fx { display: none !important; } .pkm-burst { display: none; } .pkm-halo { animation: none; } }
html.pkm-calm #pkm-fx, html.pkm-calm .pkm-burst { display: none !important; }

/* Jeux (games.js) : booster qui flotte, tremble et se déchire ; carte du gain qui jaillit ; pièce qui tourne. */
@keyframes pkmGmFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
@keyframes pkmGmShake { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-7deg) scale(1.03); } 30% { transform: rotate(7deg) scale(1.05); } 45% { transform: rotate(-9deg) scale(1.06); } 60% { transform: rotate(9deg) scale(1.08); } 80% { transform: rotate(-4deg) scale(1.1); } }
@keyframes pkmGmTearTop { to { transform: translate(60px, -90px) rotate(28deg); opacity: 0; } }
@keyframes pkmGmPackOut { to { transform: translateY(70px) scale(0.92); opacity: 0; } }
@keyframes pkmGmReveal { 0% { transform: translateY(60px) scale(0.6) rotateY(90deg); opacity: 0; } 60% { transform: translateY(-10px) scale(1.06) rotateY(0); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes pkmGmShine { from { background-position: 120% 0; } to { background-position: -120% 0; } }
@keyframes pkmGmSpin { to { transform: rotate(360deg); } }
/* Pièce (2026-10-12) : 2,9 s, 16 ou 17 demi-tours ; elle monte en tournant vite, puis ralentit longuement en retombant. */
@keyframes pkmGmCoin { 0% { transform: translateY(0) rotateY(0) scale(1); } 28% { transform: translateY(-120px) rotateY(calc(var(--end) * 0.5)) scale(1.08); } 58% { transform: translateY(-46px) rotateY(calc(var(--end) * 0.84)) scale(1.04); } 82% { transform: translateY(0) rotateY(calc(var(--end) * 0.97)) scale(1.03); } 91% { transform: translateY(-8px) rotateY(calc(var(--end) * 0.995)) scale(1.01); } 100% { transform: translateY(0) rotateY(var(--end)) scale(1); } }
.pkm-gm-float { animation: pkmGmFloat 3s ease-in-out infinite; }
.pkm-gm-shake { animation: pkmGmShake 0.75s ease-in-out both; }
.pkm-gm-shine { animation: pkmGmShine 2.4s linear infinite; }
.pkm-gm-reveal { animation: pkmGmReveal 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.pkm-gm-rays { animation: pkmGmSpin 8s linear infinite; }
.pkm-gm-coin { position: relative; width: 140px; height: 140px; transform-style: preserve-3d; }
.pkm-gm-flip { animation: pkmGmCoin 2.9s cubic-bezier(0.25, 0.1, 0.25, 1) both; will-change: transform; }
.pkm-gm-face { position: absolute; inset: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 4px solid #111111; }
.pkm-gm-win { background: radial-gradient(circle at 35% 30%, #FFF2A8, #FFD60A 45%, #D99A00 100%); box-shadow: inset 0 0 0 6px rgba(255, 255, 255, 0.35), 0 10px 24px rgba(0, 0, 0, 0.45); }
.pkm-gm-lose { transform: rotateY(180deg); background: radial-gradient(circle at 35% 30%, #D9DEE8, #8C95A8 50%, #4A5265 100%); box-shadow: inset 0 0 0 6px rgba(255, 255, 255, 0.25), 0 10px 24px rgba(0, 0, 0, 0.45); }
.pkm-gm-dead { display: inline-block; width: 64px; height: 64px; background: #5B6478; clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); box-shadow: inset 0 0 0 3px #2C3240; opacity: 0.9; }
@media (prefers-reduced-motion: reduce) { .pkm-gm-float, .pkm-gm-shine, .pkm-gm-rays { animation: none; } }
.pkm-gm-boost { background: radial-gradient(120% 90% at 50% 0%, rgba(255, 214, 10, 0.18), rgba(255, 214, 10, 0) 60%), var(--pkm-card); }
.pkm-gm-top { position: absolute; left: 0; right: 0; top: 0; height: 30px; border-radius: 14px 14px 4px 4px; background: repeating-linear-gradient(90deg, #111111 0 6px, #2A2A2A 6px 9px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4); }
.pkm-gm-body { position: absolute; left: 0; right: 0; top: 26px; bottom: 0; border-radius: 6px 6px 16px 16px; border: 3px solid #111111; background: linear-gradient(160deg, #FFE46B 0%, #FFD60A 38%, #F2A900 70%, #FFE46B 100%); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45), inset 0 0 0 2px rgba(255, 255, 255, 0.35); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.pkm-gm-tag { position: relative; padding: 2px 10px; border-radius: 999px; background: #111111; color: #FFD60A; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; }
.pkm-gm-card { position: relative; width: 160px; height: 224px; border-radius: 16px; border: 3px solid #111111; background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 60%), #0B1120; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.pkm-gm-rays { position: absolute; inset: -40px; border-radius: 50%; background: repeating-conic-gradient(rgba(255, 214, 10, 0.28) 0deg 10deg, rgba(255, 214, 10, 0) 10deg 22deg); }
.pkm-gm-label { position: relative; font-family: 'Luckiest Guy', 'Sora', sans-serif; font-size: 22px; letter-spacing: 0.04em; color: #111111; }

/* Ciseaux qui ouvrent le haut du booster (2026-10-12, à la place de la main) : ils arrivent sur le coin gauche, coupent
   le long du haut en claquant (bord blanc dentelé qui avance), puis la bande s'envole. Phase « tear » : 1,15 s. */
@keyframes pkmGmCut { 0% { transform: translate(-80px, 4px) rotate(0); opacity: 0; } 16% { transform: translate(-34px, 4px); opacity: 1; }
  26% { transform: translate(-30px, 4px) rotate(-8deg); } 33% { transform: translate(-6px, 4px) rotate(4deg); } 40% { transform: translate(18px, 4px) rotate(-8deg); }
  47% { transform: translate(42px, 4px) rotate(4deg); } 54% { transform: translate(66px, 4px) rotate(-8deg); } 61% { transform: translate(90px, 4px) rotate(4deg); }
  70% { transform: translate(116px, 4px) rotate(-6deg); opacity: 1; } 100% { transform: translate(200px, -10px) rotate(10deg); opacity: 0; } }
@keyframes pkmGmRip { 0%, 26% { width: 0; } 70% { width: 100%; } 100% { width: 100%; } }
@keyframes pkmGmTearPeel { 0%, 70% { transform: none; } 80% { transform: translateY(-6px) rotate(-3deg); } 100% { transform: translate(90px, -120px) rotate(30deg); opacity: 0; } }
.pkm-gm-hand { position: absolute; left: 0; top: -2px; width: 58px; height: 58px; z-index: 3; opacity: 0; pointer-events: none; transform-origin: 50% 50%; background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2080%2080%22%3E%3Cg%20stroke%3D%22%23111111%22%20stroke-width%3D%223.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M40%2040%20L74%2030%20L76%2036%20Z%22%20fill%3D%22%23E8EDF5%22/%3E%3Cpath%20d%3D%22M40%2040%20L74%2050%20L76%2044%20Z%22%20fill%3D%22%23C9D3EA%22/%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2240%22%20r%3D%223.5%22%20fill%3D%22%23111111%22/%3E%3Cpath%20d%3D%22M40%2040%20L24%2030%22%20fill%3D%22none%22/%3E%3Cpath%20d%3D%22M40%2040%20L24%2050%22%20fill%3D%22none%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2226%22%20r%3D%2210%22%20fill%3D%22%23FFD60A%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2254%22%20r%3D%2210%22%20fill%3D%22%23FFD60A%22/%3E%3C/g%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2226%22%20r%3D%224.5%22%20fill%3D%22%23111111%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2254%22%20r%3D%224.5%22%20fill%3D%22%23111111%22/%3E%3C/svg%3E") center / contain no-repeat; }
.pkm-gm-rip { position: absolute; left: 0; top: 24px; height: 7px; width: 0; z-index: 2; background: linear-gradient(135deg, #FFFFFF 25%, transparent 25%) -4px 0 / 8px 8px, linear-gradient(225deg, #FFFFFF 25%, transparent 25%) -4px 0 / 8px 8px; }
.pkm-gm-tear { animation: pkmGmPackOut 0.5s 0.95s ease-in both; }
.pkm-gm-tear .pkm-gm-hand { animation: pkmGmCut 1.15s linear both; }
.pkm-gm-tear .pkm-gm-rip { animation: pkmGmRip 1.15s linear both; }
.pkm-gm-tear .pkm-gm-top { animation: pkmGmTearPeel 1.15s cubic-bezier(0.45, 0, 0.25, 1) both; }

/* Déblocage d'un compagnon (2026-10-12) : 3 s. Fond sombre, cadenas doré qui tremble (0-0,7 s), anse qui s'ouvre
   lentement (0,7-1,3 s), cadenas qui éclate (1,3-1,6 s) avec une pluie de confettis, Pokémon qui jaillit avec des rayons,
   nom débloqué ; fondu de sortie à 2,7 s. */
@keyframes pkmUnlIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pkmUnlOut { to { opacity: 0; } }
@keyframes pkmUnlShake { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-10deg); } 35% { transform: rotate(9deg); } 55% { transform: rotate(-7deg); } 75% { transform: rotate(5deg); } 90% { transform: rotate(-2deg); } }
@keyframes pkmUnlShackle { 0%, 23% { transform: translateY(0) rotate(0); } 43%, 100% { transform: translateY(-16px) rotate(-32deg); } }
@keyframes pkmUnlLockGone { 0%, 43% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.28); opacity: 1; } 56%, 100% { transform: scale(0.1); opacity: 0; } }
@keyframes pkmUnlBurst { 0%, 44% { transform: scale(0.2); opacity: 0; } 50% { opacity: 1; } 64%, 100% { transform: scale(2.8); opacity: 0; } }
@keyframes pkmUnlMon { 0%, 44% { transform: scale(0) rotate(-20deg); opacity: 0; } 58% { transform: scale(1.2) rotate(5deg); opacity: 1; } 66%, 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes pkmUnlText { 0%, 52% { transform: translateY(14px); opacity: 0; } 66%, 100% { transform: none; opacity: 1; } }
@keyframes pkmUnlConfetti { 0%, 42% { transform: translate(0, 0) rotate(0); opacity: 0; } 45% { opacity: 1; } 100% { transform: translate(var(--dx), 520px) rotate(var(--r)); opacity: 1; } }
.pkm-unl { position: absolute; inset: 0; z-index: 60; overflow: hidden; border: 0; padding: 0; margin: 0; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(60% 45% at 50% 45%, rgba(255, 214, 10, 0.28), rgba(11, 17, 32, 0.92) 70%); color: #FFFFFF; animation: pkmUnlIn 0.25s ease-out both, pkmUnlOut 0.3s 2.7s ease-in forwards; }
.pkm-unl-rays { position: absolute; left: 50%; top: 45%; width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%; background: repeating-conic-gradient(rgba(255, 214, 10, 0.3) 0deg 9deg, rgba(255, 214, 10, 0) 9deg 20deg); animation: pkmGmSpin 7s linear infinite, pkmUnlIn 0.7s 1.35s both; }
.pkm-unl-lock { position: absolute; left: 50%; top: 45%; width: 80px; height: 96px; margin: -48px 0 0 -40px; animation: pkmUnlShake 0.7s ease-in-out both, pkmUnlLockGone 3s ease-in both; }
.pkm-unl-shackle { position: absolute; left: 16px; top: 0; width: 48px; height: 50px; border: 9px solid #111111; border-bottom: 0; border-radius: 26px 26px 0 0; box-sizing: border-box; background: transparent; box-shadow: inset 0 0 0 3px #F2C200; transform-origin: 85% 100%; animation: pkmUnlShackle 3s cubic-bezier(0.34, 1.3, 0.5, 1) both; }
.pkm-unl-body { position: absolute; left: 0; bottom: 0; width: 80px; height: 58px; border-radius: 14px; border: 4px solid #111111; box-sizing: border-box; background: radial-gradient(circle at 50% 42%, #111111 0 7px, transparent 8px), linear-gradient(160deg, #FFE46B, #FFD60A 45%, #D99A00); }
.pkm-unl-burst { position: absolute; left: 50%; top: 45%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0 12%, rgba(255, 214, 10, 0.7) 30%, rgba(255, 214, 10, 0) 62%); animation: pkmUnlBurst 3s ease-out both; }
.pkm-unl-mon { position: relative; width: 128px; height: 128px; image-rendering: pixelated; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.35)); animation: pkmUnlMon 3s cubic-bezier(0.3, 1.2, 0.5, 1) both; }
.pkm-unl-title { position: relative; font-family: 'Luckiest Guy', 'Sora', sans-serif; font-size: 30px; letter-spacing: 0.03em; color: #FFFFFF; text-shadow: 0.05em 0 0 #111111, -0.05em 0 0 #111111, 0 0.05em 0 #111111, 0 -0.05em 0 #111111, 0.05em 0.08em 0 #111111; animation: pkmUnlText 3s ease-out both; }
.pkm-unl-sub { position: relative; font-size: 14px; font-weight: 700; color: #FFD60A; animation: pkmUnlText 3.1s ease-out both; }
.pkm-unl-conf { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; opacity: 0; animation: pkmUnlConfetti 3s cubic-bezier(0.25, 0.6, 0.5, 1) both; }
.pkm-unl-c0 { background: #FFD60A; } .pkm-unl-c1 { background: #5EE0CF; } .pkm-unl-c2 { background: #FF7AD9; } .pkm-unl-c3 { background: #A8B6FF; } .pkm-unl-c4 { background: #FFFFFF; }
@media (prefers-reduced-motion: reduce) { .pkm-unl, .pkm-unl * { animation-duration: 0.01s !important; animation-delay: 0s !important; } .pkm-unl-lock, .pkm-unl-burst, .pkm-unl-conf { display: none; } .pkm-unl { animation: pkmUnlOut 0.3s 2.7s forwards; } }

/* Roulette (2026-10-12) : roue à 4 secteurs proportionnels aux chances (÷2 15 %, ×2 10 %, +100 40 %, −100 35 %),
   aiguille fixe en haut ; 7 tours en 4,3 s, longue décélération. */
.pkm-gm-wheelbox { position: relative; width: 220px; height: 220px; margin: 4px auto 0; }
.pkm-gm-wheel { position: absolute; inset: 0; border-radius: 50%; border: 5px solid #111111; box-sizing: border-box; transform: rotate(var(--spin)); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45), inset 0 0 0 4px rgba(255, 255, 255, 0.25);
  background: conic-gradient(#8C95A8 0deg 54deg, #FF7AD9 54deg 90deg, #FFD60A 90deg 234deg, #4A5265 234deg 360deg); }
.pkm-gm-wspin { transition: transform 4.3s cubic-bezier(0.12, 0.7, 0.12, 1); }
.pkm-gm-wlabel { position: absolute; left: 50%; top: 50%; width: 70px; margin: -11px 0 0 -35px; padding: 3px 0; border-radius: 999px; background: #111111; text-align: center; font-size: 12px; font-weight: 800; line-height: 16px; color: #FFFFFF; white-space: nowrap; }
.pkm-gm-needle { position: absolute; left: 50%; top: -10px; z-index: 2; width: 0; height: 0; margin-left: -13px; border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 30px solid #111111; filter: drop-shadow(0 2px 0 rgba(255, 255, 255, 0.4)); }
.pkm-gm-needle::after { content: ''; position: absolute; left: -8px; top: -27px; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 19px solid #FFD60A; }
.pkm-gm-hub { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 4px solid #111111; box-sizing: border-box; background: radial-gradient(circle at 35% 30%, #FFF2A8, #FFD60A 50%, #D99A00); }
.pkm-gm-wdot { flex: none; width: 12px; height: 12px; border-radius: 3px; border: 2px solid #111111; }
.pkm-gm-w0 { background: #8C95A8; } .pkm-gm-w1 { background: #FF7AD9; } .pkm-gm-w2 { background: #FFD60A; } .pkm-gm-w3 { background: #4A5265; }

/* PK shop (2026-10-12) : carte d'article et ticket doré. */
.pkm-shop-item { background: radial-gradient(120% 90% at 0% 0%, rgba(255, 214, 10, 0.16), rgba(255, 214, 10, 0) 60%), #111A2C; }
.pkm-shop-ticket { flex: none; position: relative; width: 82px; height: 56px; border-radius: 10px; border: 3px solid #111111; box-sizing: border-box; background: linear-gradient(135deg, #FFE46B, #FFD60A 50%, #F2A900); transform: rotate(-6deg); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: center; }
.pkm-shop-ticket::before, .pkm-shop-ticket::after { content: ''; position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: #111A2C; border: 3px solid #111111; box-sizing: border-box; }
.pkm-shop-ticket::before { left: -9px; } .pkm-shop-ticket::after { right: -9px; }
.pkm-shop-ticket-in { font-family: 'Luckiest Guy', 'Sora', sans-serif; font-size: 15px; letter-spacing: 0.06em; color: #111111; border-top: 2px dashed #111111; border-bottom: 2px dashed #111111; padding: 2px 4px; }

/* PK shop (2026-10-12) : visuel d'un lot (booster 30 ans) ; barre des tickets sous le solde de PK (en-tête et boutique),
   affichée seulement quand on en possède. */
.pkm-shop-img { flex: none; display: block; width: 70px; height: auto; transform: rotate(-4deg); filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45)); }
.pkm-tk-head { display: block; margin-top: 2px; padding: 0; border: 0; background: transparent; cursor: pointer; font: inherit; }
.pkm-tk-head .pkm-tk-bar { margin-top: 0; height: 20px; font-size: 11.5px; }
/* Compteur resserré quand la barre des tickets est affichée (2026-10-14) : pastille de 28 px au lieu de 34. */
.pkm-pk-tk > button { height: 30px !important; }
.pkm-pk-tk > button > span { height: 28px !important; font-size: 13px !important; padding-right: 10px !important; }
.pkm-pk-tk > button > span > img { width: 22px !important; height: 22px !important; }
.pkm-tk-bar { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px 0 6px; border-radius: 999px; background: #111A2C; border: 1px solid #1E2B45; color: #F3F6FC; font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 700; white-space: nowrap; align-self: flex-start; margin-top: 4px; }
.pkm-tk-mini { position: relative; width: 18px; height: 12px; border-radius: 3px; border: 1.5px solid #111111; box-sizing: border-box; background: linear-gradient(135deg, #FFE46B, #FFD60A 50%, #F2A900); }
.pkm-tk-mini::before, .pkm-tk-mini::after { content: ''; position: absolute; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: #111A2C; }
.pkm-tk-mini::before { left: -3px; } .pkm-tk-mini::after { right: -3px; }

/* Mon profil (2026-10-14) : pastille appareil photo sur la bulle, champs « Informations du dresseur ». */
.pkm-pf-cam { position: absolute; left: -4px; bottom: -2px; width: 26px; height: 26px; border-radius: 13px; background: var(--pkm-accent); color: #111111; border: 2px solid #121C33; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
.pkm-tr-in { box-sizing: border-box; width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 14px; border: 1px solid #2A3A5C; background: #0B1322; color: #F3F6FC; font: inherit; font-size: 16px; font-weight: 500; }
.pkm-tr-in::placeholder { color: #7D8BA8; }

/* « Contenu possible et chances » (2026-10-14) : flèche qui montre qu'on peut toucher, tournée quand c'est ouvert. */
.pkm-gm-sum { list-style: none; }
.pkm-gm-sum::-webkit-details-marker { display: none; }
.pkm-gm-chev { flex: none; width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: rgba(255, 214, 10, 0.16); color: var(--pkm-accent); transition: transform 0.25s ease; }
details[open] > .pkm-gm-sum .pkm-gm-chev { transform: rotate(180deg); }

/* Roulette (2026-10-14) : confettis quand le solde monte, nuage de pluie et roue qui tremble quand il baisse. */
.pkm-gm-wfx { position: absolute; inset: -20px -8px; pointer-events: none; overflow: hidden; z-index: 3; }
.pkm-gm-wconf { animation-name: pkmGmWConf; animation-duration: 2.4s; }
@keyframes pkmGmWConf { 0% { transform: translate(0, -10px) rotate(0); opacity: 0; } 8% { opacity: 1; } 100% { transform: translate(var(--dx), 300px) rotate(var(--r)); opacity: 1; } }
.pkm-gm-wpop { position: absolute; left: 50%; top: 50%; padding: 6px 14px; border-radius: 999px; font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 800; white-space: nowrap; transform: translate(-50%, -50%); animation: pkmGmWPop 2.5s ease-out both; }
.pkm-gm-wpop-win { background: var(--pkm-accent); color: #111111; border: 3px solid #111111; }
.pkm-gm-wpop-lose { background: #2B3448; color: #D7DEEE; border: 3px solid #111111; }
@keyframes pkmGmWPop { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 14% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 24%, 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -70%) scale(0.95); opacity: 0; } }
.pkm-gm-cloud { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); animation: pkmGmCloud 2.5s ease-out both; }
@keyframes pkmGmCloud { 0% { transform: translate(-50%, -40px); opacity: 0; } 15%, 82% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -10px); opacity: 0; } }
.pkm-gm-drop { position: absolute; top: 58px; width: 4px; height: 12px; border-radius: 2px; background: #8FB4FF; opacity: 0; animation: pkmGmDrop 0.7s 3 linear both; }
@keyframes pkmGmDrop { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(150px); opacity: 0; } }
.pkm-gm-wsad .pkm-gm-wheel { filter: saturate(0.35) brightness(0.8); transition: filter 0.4s; }
.pkm-gm-wsad { animation: pkmGmShake 0.5s 0.1s ease-in-out 2; }
@keyframes pkmGmShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) { .pkm-gm-wfx *, .pkm-gm-wsad { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } .pkm-gm-wconf, .pkm-gm-drop { display: none; } }
.pkm-gm-cloud-body { fill: #5A6782; stroke: #2B3448; stroke-width: 3; }
.pkm-gm-cloud-face { fill: none; stroke: #1B2233; stroke-width: 3; stroke-linecap: round; }
.pkm-tr-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0 2px; border-top: 1px solid #1E2B45; }
.pkm-tr-k { font-size: 13px; font-weight: 700; color: #C9D3EA; }
.pkm-tr-v { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; text-align: right; }

/* Grades (2026-10-16) : grade actuel du profil, fiche d'un grade, avantages. */
.pkm-gr-hero { filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.45)); }
.pkm-gr-perk { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.4; }
.pkm-gr-tick { flex: none; position: relative; width: 20px; height: 20px; margin-top: 1px; border-radius: 10px; background: var(--pkm-accent); border: 1.5px solid #111111; box-sizing: border-box; }
.pkm-gr-tick::after { content: ''; position: absolute; left: 5px; top: 2.5px; width: 5px; height: 9px; border: solid #111111; border-width: 0 2.2px 2.2px 0; transform: rotate(45deg); }

/* Passage de grade (2026-10-16, allongé d'une seconde le même jour à la demande du porteur, d'après les promotions de rang de League of Legends) : l'ancien emblème se charge
   d'énergie (étincelles qui convergent, tremblement), éclate dans un flash et une onde de choc, le nouvel emblème
   s'abat avec des rayons qui tournent et un reflet, puis le nom du grade. --gu : couleur du nouveau grade. */
.pkm-gu { position: absolute; inset: 0; z-index: 70; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: radial-gradient(70% 50% at 50% 42%, rgba(30, 40, 70, 0.92), rgba(5, 8, 15, 0.97) 75%); color: #FFFFFF; animation: pkmGuIn 0.35s ease-out both; }
@keyframes pkmGuIn { from { opacity: 0; } to { opacity: 1; } }
.pkm-gu-rays { position: absolute; left: 50%; top: 42%; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, var(--gu) 0deg 6deg, transparent 6deg 22deg); -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%); mask-image: radial-gradient(circle, #000 0%, transparent 62%); opacity: 0; animation: pkmGuRays 1.2s 2.45s ease-out forwards, pkmGuSpin 18s 2.45s linear infinite; }
@keyframes pkmGuRays { from { opacity: 0; transform: scale(0.4); } to { opacity: 0.3; transform: scale(1); } }
@keyframes pkmGuSpin { to { rotate: 360deg; } }
.pkm-gu-stage { position: relative; width: 220px; height: 220px; flex: none; }
.pkm-gu-old, .pkm-gu-new { position: absolute; left: 10px; top: 10px; width: 200px; height: 200px; }
.pkm-gu-old { animation: pkmGuCharge 2.35s ease-in both, pkmGuBreak 0.35s 2.35s ease-out forwards; }
@keyframes pkmGuCharge { 0% { transform: scale(0.85); opacity: 0; filter: brightness(1); } 15% { transform: scale(1); opacity: 1; } 55% { transform: translate(-2px, 1px) scale(1.02); filter: brightness(1.2) drop-shadow(0 0 8px var(--gu)); } 65% { transform: translate(3px, -2px) scale(1.03); } 75% { transform: translate(-3px, 2px) scale(1.04); } 85% { transform: translate(3px, 1px) scale(1.05); filter: brightness(1.8) drop-shadow(0 0 22px var(--gu)); } 100% { transform: translate(0, 0) scale(1.06); filter: brightness(2.6) drop-shadow(0 0 30px #FFFFFF); } }
@keyframes pkmGuBreak { to { transform: scale(1.5); opacity: 0; filter: brightness(3) blur(6px); } }
.pkm-gu-spark { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--gu); box-shadow: 0 0 8px var(--gu), 0 0 2px #FFFFFF; opacity: 0; animation: pkmGuSpark 0.9s ease-in both; }
@keyframes pkmGuSpark { 0% { opacity: 0; transform: translate(var(--x), var(--y)) scale(0.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(0, 0) scale(1.4); } }
.pkm-gu-flash { position: fixed; inset: 0; background: #FFFFFF; opacity: 0; pointer-events: none; animation: pkmGuFlash 0.55s 2.35s ease-out both; }
@keyframes pkmGuFlash { 0% { opacity: 0; } 18% { opacity: 0.85; } 100% { opacity: 0; } }
.pkm-gu-shard { position: absolute; left: 50%; top: 50%; width: 12px; height: 18px; margin: -9px 0 0 -6px; background: var(--gu); border: 1.5px solid #111111; clip-path: polygon(50% 0, 100% 100%, 0 80%); opacity: 0; animation: pkmGuShard 0.85s 2.38s cubic-bezier(0.2, 0.7, 0.3, 1) forwards; }
@keyframes pkmGuShard { 0% { opacity: 0; transform: translate(0, 0) rotate(0); } 4% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }
.pkm-gu-new { opacity: 0; animation: pkmGuNew 0.75s 2.5s cubic-bezier(0.2, 1.4, 0.4, 1) forwards, pkmGuGlow 3.2s 3.9s ease-in-out infinite; }
@keyframes pkmGuNew { 0% { opacity: 0; transform: scale(1.9); filter: brightness(3) drop-shadow(0 0 30px #FFFFFF); } 45% { opacity: 1; transform: scale(0.94); } 100% { opacity: 1; transform: scale(1); filter: brightness(1) drop-shadow(0 0 22px var(--gu)); } }
.pkm-gu-kicker, .pkm-gu-name, .pkm-gu-sub, .pkm-gu-go { position: relative; opacity: 0; animation: pkmGuText 0.6s ease-out forwards; }
.pkm-gu-kicker { margin-top: 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gu); animation-delay: 3.05s; }
.pkm-gu-name { max-width: 100%; box-sizing: border-box; white-space: nowrap; letter-spacing: 0.02em; font-family: 'Luckiest Guy', 'Sora', sans-serif; font-size: clamp(18px, 6.6vw, 34px); line-height: 1.05; text-align: center; color: #FFFFFF; -webkit-text-stroke: 1.5px #111111; text-shadow: 0 3px 0 #111111, 0 0 22px var(--gu); padding: 0 16px; animation-name: pkmGuName; animation-delay: 3.2s; }
@keyframes pkmGuName { 0% { opacity: 0; transform: scale(1.25); filter: blur(4px); } 100% { opacity: 1; transform: none; filter: none; } }
.pkm-gu-sub { max-width: 300px; font-size: 13.5px; line-height: 1.45; color: #C9D3EA; text-align: center; animation-delay: 3.5s; }
.pkm-gu-go { margin-top: 14px; min-width: 200px; height: 50px; border: 2px solid #111111; border-radius: 999px; background: #FFD60A; color: #111111; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; animation-delay: 3.9s; }
@keyframes pkmGuText { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* Éclat final (d'après la vidéo LoL du porteur) : un voile de lumière glisse sur l'emblème seul (calque découpé à la
   forme exacte de l'emblème, --gu-mask), l'emblème s'éclaire au passage, puis se calme ; toutes les 3,2 s. */
@keyframes pkmGuGlow { 0%, 30%, 100% { filter: brightness(1) drop-shadow(0 0 14px var(--gu)); } 13% { filter: brightness(1.35) drop-shadow(0 0 14px var(--gu)); } }
.pkm-gu-sheen { position: absolute; left: 10px; top: 10px; width: 200px; height: 200px; pointer-events: none; -webkit-mask-image: var(--gu-mask); mask-image: var(--gu-mask); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; background: linear-gradient(115deg, transparent 0%, transparent 38%, rgba(255, 255, 255, 0.15) 44%, rgba(255, 255, 255, 0.85) 50%, rgba(255, 255, 255, 0.15) 56%, transparent 62%, transparent 100%); background-size: 300% 100%; background-position: 100% 0; opacity: 0; animation: pkmGuSheen 3.2s 3.9s ease-in-out infinite; }
@keyframes pkmGuSheen { 0% { background-position: 100% 0; opacity: 1; } 26% { background-position: 0% 0; opacity: 1; } 27%, 100% { background-position: 0% 0; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pkm-gu *, .pkm-gu::after { animation-duration: 0.01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } .pkm-gu-old, .pkm-gu-spark, .pkm-gu-shard, .pkm-gu-flash, .pkm-gu-sheen { display: none; } }

/* En-tête de l'accueil (2026-10-16) : PK à gauche, logo au centre, avatar avec l'emblème du grade à droite. */
.pkm-hh-left > span { align-items: flex-start !important; }
.pkm-hh-left .pkm-tk-head { align-self: flex-start; }
.pkm-hh-grade { position: absolute; right: -8px; bottom: -8px; width: 34px; height: 34px; display: block; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5)); pointer-events: none; }
/* Écran d'une extension façon vidéo du porteur (2026-10-17, setview.js) : progression, taille de la grille, raretés,
   cœur (favori) et « + » (ajout avec la cote du jour) sur chaque carte. */
.pkm-sv-bar { display: block; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.pkm-sv-bar-in { display: block; height: 100%; min-width: 2px; border-radius: 4px; background: var(--pkm-accent); transition: width 0.4s ease; }
.pkm-sv-sizes { flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid #1E2B45; background: #111A2C; }
.pkm-sv-size { height: 40px; padding: 0; border: 0; border-radius: 999px; background: transparent; color: #C9D3EA; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.pkm-sv-size-on { background: #26345A; color: #FFFFFF; box-shadow: inset 0 0 0 1px #3A4A75; }
.pkm-rar { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 4px; box-sizing: border-box; border-radius: 10px; background: #0B1120; font-size: 11px; line-height: 1; letter-spacing: -0.06em; color: #FFFFFF; }
.pkm-rar-c, .pkm-rar-u { color: #C9D3EA; }
.pkm-rar-ur { color: #D9E2F2; }
.pkm-rar-ir, .pkm-rar-sir, .pkm-rar-hr { color: #FFD60A; }
.pkm-rar-pk { color: #FFE14D; text-shadow: 0 0 4px rgba(255, 90, 60, 0.9); }
.pkm-rar-cc { color: #0B1120; background: #FFD60A; font-size: 10px; font-weight: 800; letter-spacing: 0; }
.pkm-rar-p { color: #A8B6FF; font-weight: 800; letter-spacing: 0; }
.pkm-rar-sh { color: #7CF5FF; }
.pkm-rar-ace { color: #FF8AD8; }
.pkm-rar-fu { color: #5BE08F; }
.pkm-rar-ra { color: #FFB347; }
.pkm-rar-n { color: #9AA8C3; }
.pkm-sv-card { position: relative; min-width: 0; }
.pkm-sv-open { display: flex; flex-direction: column; align-items: stretch; gap: 5px; width: 100%; min-width: 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: center; cursor: pointer; }
.pkm-sv-pic { position: relative; display: block; width: 100%; aspect-ratio: 600 / 825; border-radius: 5% / 3.6%; overflow: hidden; background: #16213A; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
/* Cartes toujours en couleur (2026-10-17, porteur) ; les cartes possédées portent leur pastille ×N. */
.pkm-sv-num, .pkm-sv-qty { position: absolute; bottom: 3.5%; padding: 1px 6px; border-radius: 6px; background: rgba(8, 13, 26, 0.86); color: #FFFFFF; font-size: 10.5px; font-weight: 700; line-height: 1.35; font-variant-numeric: tabular-nums; }
.pkm-sv-num { left: 5%; }
.pkm-sv-qty { right: 5%; box-shadow: inset 0 0 0 1px var(--pkm-accent); }
.pkm-sv-name { font-size: 12.5px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--pkm-t1); }
.pkm-sv-meta { display: flex; justify-content: center; align-items: center; gap: 5px; min-width: 0; font-size: 11.5px; font-weight: 700; color: var(--pkm-t2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pkm-sv-flag { flex: none; width: 14px; height: 10px; border-radius: 2px; }
.pkm-sv-fav, .pkm-sv-add { position: absolute; top: 4px; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 16px; background: rgba(8, 13, 26, 0.8); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
.pkm-sv-fav { left: 4px; }
.pkm-sv-add { right: 4px; }
.pkm-sv-fav svg, .pkm-sv-add svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.pkm-sv-fav-on { color: #FF5A7A; }
.pkm-sv-fav-on svg { fill: currentColor; }
.pkm-sv-add:active, .pkm-sv-fav:active { transform: scale(0.9); }
.pkm-sv-s .pkm-sv-name { font-size: 11px; }
.pkm-sv-s .pkm-sv-meta { font-size: 10px; gap: 3px; }
.pkm-sv-s .pkm-sv-flag { width: 11px; height: 8px; }
.pkm-sv-s .pkm-sv-num, .pkm-sv-s .pkm-sv-qty { font-size: 9px; padding: 0 4px; }
.pkm-sv-s .pkm-sv-fav, .pkm-sv-s .pkm-sv-add { top: 2px; width: 26px; height: 26px; border-radius: 13px; }
.pkm-sv-s .pkm-sv-fav { left: 2px; }
.pkm-sv-s .pkm-sv-add { right: 2px; }
.pkm-sv-s .pkm-sv-fav svg, .pkm-sv-s .pkm-sv-add svg { width: 14px; height: 14px; }
.pkm-sv-l .pkm-sv-name { font-size: 14.5px; }
.pkm-sv-l .pkm-sv-meta { font-size: 13px; }
.pkm-sv-l .pkm-sv-num, .pkm-sv-l .pkm-sv-qty { font-size: 12px; padding: 2px 8px; }
.pkm-sv-l .pkm-sv-fav, .pkm-sv-l .pkm-sv-add { top: 6px; width: 38px; height: 38px; border-radius: 19px; }
.pkm-sv-l .pkm-sv-fav { left: 6px; }
.pkm-sv-l .pkm-sv-add { right: 6px; }
.pkm-sv-l .pkm-sv-fav svg, .pkm-sv-l .pkm-sv-add svg { width: 20px; height: 20px; }
@media (prefers-reduced-motion: reduce) { .pkm-sv-bar-in { transition: none; } }
/* Séries (2026-10-17, vidéo du porteur) : les extensions d'une série ouverte se déplient vers le bas, ligne après ligne. */
.pkm-ser-unfold { animation: pkmSerUnfold 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) both; transform-origin: top center; }
.pkm-ser-unfold > button { animation: pkmSerTile 0.36s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.pkm-ser-unfold > button:nth-child(n+4) { animation-delay: 0.05s; }
.pkm-ser-unfold > button:nth-child(n+7) { animation-delay: 0.1s; }
.pkm-ser-unfold > button:nth-child(n+10) { animation-delay: 0.15s; }
.pkm-ser-unfold > button:nth-child(n+13) { animation-delay: 0.2s; }
@keyframes pkmSerUnfold { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes pkmSerTile { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pkm-ser-unfold, .pkm-ser-unfold > button { animation: none; } }
/* Accueil : valeur des cartes et du scellé sous « Mon classeur » (2026-10-17, home.js), quelques visuels en éventail. */
.pkm-hb-type-v { font-size: 20px; font-size: min(20px, 5.4vw); }
.pkm-hb-fan { position: absolute; right: 8px; bottom: 8px; width: 104px; height: 64px; pointer-events: none; }
.pkm-hb-fan img { position: absolute; bottom: 0; display: block; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45); }
.pkm-hb-fan-c0, .pkm-hb-fan-c1, .pkm-hb-fan-c2 { width: 40px; aspect-ratio: 600 / 825; height: auto; border-radius: 3px; object-fit: cover; }
.pkm-hb-fan-c0 { right: 6px; transform: rotate(10deg); z-index: 1; }
.pkm-hb-fan-c1 { right: 30px; bottom: 4px; transform: rotate(0deg); z-index: 2; }
.pkm-hb-fan-c2 { right: 54px; transform: rotate(-10deg); z-index: 1; }
.pkm-hb-fan-s0, .pkm-hb-fan-s1 { width: 62px; height: 56px; object-fit: contain; box-shadow: none; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45)); }
.pkm-hb-fan-s0 { right: 0; z-index: 2; }
.pkm-hb-fan-s1 { right: 40px; bottom: 6px; z-index: 1; }
.pkm-hb-type:active { transform: scale(0.98); }
/* Mon classeur · vitrine en verre éclairée du scellé (2026-10-21, choix du porteur) : 3 produits par tablette,
   lumière en haut, tablettes en verre, reflets ; pastille de prix identique à celle des cartes. */
.pkm-vit { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; padding: 18px 6px 8px; border-radius: 18px; border: 1px solid #3A4A75; background: linear-gradient(180deg, rgba(168, 182, 255, 0.12), rgba(8, 13, 26, 0.6)); overflow: hidden; }
.pkm-vit::before { content: ""; position: absolute; left: 8%; right: 8%; top: 0; height: 5px; border-radius: 0 0 6px 6px; background: #FFF6C2; box-shadow: 0 0 22px 8px rgba(255, 236, 150, 0.45); }
.pkm-vit-slot { position: relative; height: 132px; min-width: 0; }
.pkm-vit-slot::after { content: ""; position: absolute; left: 0; right: 0; bottom: 16px; height: 8px; background: linear-gradient(rgba(220, 235, 255, 0.55), rgba(160, 190, 255, 0.15)); box-shadow: 0 0 12px rgba(168, 182, 255, 0.35); }
.pkm-vit-item { position: absolute; inset: 0; z-index: 1; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.pkm-vit-photo { position: absolute; left: 5%; right: 5%; top: 4px; bottom: 24px; display: flex; align-items: flex-end; justify-content: center; }
.pkm-vit-photo > img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.6)); -webkit-box-reflect: below 2px linear-gradient(transparent 74%, rgba(255, 255, 255, 0.16)); }
.pkm-vit-art { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; box-shadow: 0 8px 12px rgba(0, 0, 0, 0.5); }
.pkm-vit-art > img { width: 80%; height: 70%; object-fit: contain; }

/* Fiche d'une carte ou d'un produit (2026-10-21, vidéos du porteur) : panneau qui monte du bas. */
.pkm-fi-wrap { position: absolute; inset: 0; z-index: 18; display: flex; flex-direction: column; background: rgba(3, 6, 14, 0.62); }
.pkm-fi-back { flex: 0 0 52px; padding: 0; border: 0; background: transparent; cursor: pointer; }
.pkm-fi { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; box-sizing: border-box; background: #0F1828; border-top: 1px solid #24345C; border-radius: 28px 28px 0 0; padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 12px; color: #F3F6FC; }
.pkm-fi-grip { flex: none; align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #2A3A5C; }
.pkm-fi-head { flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.pkm-fi-title { margin: 0; font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.25; }
.pkm-fi-num { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; color: #9AA8C3; white-space: nowrap; }
.pkm-fi-setlogo { display: block; height: 30px; max-width: 140px; object-fit: contain; object-position: left center; margin-top: 4px; }
.pkm-fi-x { flex: none; width: 44px; height: 44px; padding: 0; border: 1px solid #1E2B45; border-radius: 22px; background: #111A2C; color: #F3F6FC; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.pkm-fi-x svg, .pkm-fi-main svg, .pkm-fi-fold svg { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pkm-fi-visual { flex: none; align-self: center; position: relative; padding: 0; border: 0; background: transparent; cursor: zoom-in; display: flex; justify-content: center; }
.pkm-fi-card { display: block; width: 190px; aspect-ratio: 600 / 825; border-radius: 4.8% / 3.4%; background: #16213A; object-fit: cover; box-shadow: 0 0 40px rgba(255, 214, 10, 0.25), 0 18px 40px rgba(0, 0, 0, 0.55); }
.pkm-fi-photo { display: block; width: 240px; max-height: 210px; object-fit: contain; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.55)); }
.pkm-fi-art { display: flex; align-items: center; justify-content: center; width: 240px; aspect-ratio: 4 / 3; border-radius: 16px; }
.pkm-fi-art img { width: 80%; height: 70%; object-fit: contain; }
.pkm-fi-rarity { align-self: center; font-size: 12.5px; font-weight: 700; color: #FFD66B; }
.pkm-fi-price { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pkm-fi-cote { font-family: 'Sora', sans-serif; font-size: 34px; font-weight: 700; line-height: 1.15; color: #FFFFFF; font-variant-numeric: tabular-nums; padding: 0 0.1em 0.06em; }
.pkm-fi-src { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #C9D3EA; }
.pkm-fi-flag { width: 16px; height: 11px; border-radius: 2px; }
.pkm-fi-owned { font-size: 12.5px; color: #9AA8C3; }
.pkm-fi-main { flex: none; height: 52px; border: 0; border-radius: 999px; background: var(--pkm-accent); color: var(--pkm-on-accent); font: inherit; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.pkm-fi-pair { display: flex; justify-content: center; gap: 18px; }
.pkm-fi-link { min-height: 36px; padding: 0 4px; border: 0; background: transparent; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.pkm-fi-sold { color: #3DDC84; }
.pkm-fi-del { color: #FF8A8A; }
.pkm-fi-box { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 20px; border: 1px solid #24345C; background: #121C33; }
.pkm-fi-h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; color: #F3F6FC; }
.pkm-fi-chip { padding: 2px 8px; border-radius: 999px; background: rgba(168, 182, 255, 0.14); color: #B9C5FF; font-size: 11.5px; font-weight: 700; }
.pkm-fi-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.pkm-fi-row-l { flex: 1; min-width: 0; font-size: 13.5px; color: #C9D3EA; }
.pkm-fi-row-v { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: #F3F6FC; }
.pkm-fi-tag { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.pkm-fi-note { font-size: 12px; line-height: 1.45; color: #9AA8C3; }
.pkm-fi-buy { height: 46px; border-radius: 999px; background: #F3F6FC; color: #0B1120; font-size: 14.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; }
.pkm-fi-ebay { min-height: 40px; display: flex; align-items: center; justify-content: center; color: #B9C5FF; font-size: 13.5px; font-weight: 700; text-decoration: none; }
.pkm-fi-big { font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; color: #F3F6FC; }
.pkm-fi-axis { display: flex; justify-content: space-between; font-size: 11px; color: #7D8BA8; }
.pkm-fi-fold { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; padding: 0; border: 0; background: transparent; color: #F3F6FC; font: inherit; font-size: 14.5px; font-weight: 700; text-align: left; cursor: pointer; }
.pkm-fi-fold[aria-expanded="true"] svg { transform: rotate(180deg); }
.pkm-fi-copy { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; padding: 6px 0; border: 0; border-top: 1px solid #1E2B45; background: transparent; color: #C9D3EA; font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.pkm-fi-full { flex: none; height: 46px; border: 1px solid #2A3A5C; border-radius: 999px; background: transparent; color: #F3F6FC; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
/* Mon classeur (2026-10-21, demande du porteur) : la page des cartes se tourne comme dans un classeur (la nouvelle
   page pivote depuis la reliure) ; pochettes vides pour garder la même hauteur de page ; « Tout afficher ». */
.pkm-hk-grid { transform-origin: left center; }
.pkm-turn-next-0 { animation: pkmTurnNextA 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both; transform-origin: left center; }
.pkm-turn-next-1 { animation: pkmTurnNextB 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both; transform-origin: left center; }
.pkm-turn-prev-0 { animation: pkmTurnPrevA 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both; transform-origin: right center; }
.pkm-turn-prev-1 { animation: pkmTurnPrevB 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both; transform-origin: right center; }
@keyframes pkmTurnNextA { 0% { transform: perspective(1400px) rotateY(-92deg); filter: brightness(0.55); } 60% { filter: brightness(0.85); } 100% { transform: perspective(1400px) rotateY(0); filter: none; } }
@keyframes pkmTurnNextB { 0% { transform: perspective(1400px) rotateY(-92deg); filter: brightness(0.55); } 60% { filter: brightness(0.85); } 100% { transform: perspective(1400px) rotateY(0); filter: none; } }
@keyframes pkmTurnPrevA { 0% { transform: perspective(1400px) rotateY(92deg); filter: brightness(0.55); } 60% { filter: brightness(0.85); } 100% { transform: perspective(1400px) rotateY(0); filter: none; } }
@keyframes pkmTurnPrevB { 0% { transform: perspective(1400px) rotateY(92deg); filter: brightness(0.55); } 60% { filter: brightness(0.85); } 100% { transform: perspective(1400px) rotateY(0); filter: none; } }
@media (prefers-reduced-motion: reduce) { .pkm-turn-next-0, .pkm-turn-next-1, .pkm-turn-prev-0, .pkm-turn-prev-1 { animation: none; } }
.pkm-hk-pocket { display: block; width: 100%; aspect-ratio: 600 / 825; box-sizing: border-box; border-radius: 5% / 3.6%; border: 1.5px dashed rgba(168, 182, 255, 0.22); background: rgba(255, 255, 255, 0.03); }
.pkm-hk-all { min-height: 28px; padding: 0; border: 0; background: transparent; color: #B9C5FF; font: inherit; font-size: 12.5px; font-weight: 700; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
/* « Tout afficher » du classeur (2026-10-21, vidéo du porteur) : écran plein, classé par valeur, grille de 3. */
.pkm-hf { position: absolute; inset: 0; z-index: 17; overflow-y: auto; scrollbar-width: none; box-sizing: border-box; padding: 18px 14px calc(28px + env(safe-area-inset-bottom)); background: #0B1120; color: #F3F6FC; display: flex; flex-direction: column; gap: 12px; }
.pkm-hf-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.pkm-hf-title { margin: 0; font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.pkm-hf-sub { margin: 0; font-size: 12.5px; color: #9AA8C3; }
.pkm-hf-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.pkm-hf-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.pkm-hf-tile { position: relative; display: block; width: 100%; aspect-ratio: 600 / 825; padding: 0; border: 0; border-radius: 5% / 3.6%; overflow: hidden; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.08); cursor: pointer; }
.pkm-hf-card { display: block; width: 100%; height: 100%; object-fit: cover; }
.pkm-hf-photo { position: absolute; left: 6%; top: 8%; width: 88%; height: 70%; object-fit: contain; }
.pkm-hf-grade { position: absolute; top: 5px; right: 5px; padding: 1px 6px; border-radius: 6px; background: #FFFFFF; color: #0B1120; font-size: 10.5px; font-weight: 800; }
.pkm-hf-qty { position: absolute; top: 5px; left: 5px; padding: 1px 7px; border-radius: 999px; background: rgba(8, 13, 26, 0.82); border: 1px solid rgba(168, 182, 255, 0.5); color: #FFFFFF; font-size: 11px; font-weight: 700; }
.pkm-hf-pill { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); max-width: 92%; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 999px; background: rgba(8, 13, 26, 0.86); color: #FFFFFF; font-size: 11px; font-weight: 700; line-height: 1.2; white-space: nowrap; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); }
.pkm-hf-more { align-self: center; height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid #2A3A5C; background: #111A2C; color: #F3F6FC; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
/* « Tout afficher » du scellé (2026-10-22, demande du porteur) : 2 par ligne, photos plus grandes. */
.pkm-hf-grid-s { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pkm-hf-grid-s .pkm-hf-tile { aspect-ratio: 1 / 1.08; border-radius: 16px; }
.pkm-hf-grid-s .pkm-hf-photo { left: 4%; top: 4%; width: 92%; height: 76%; }

/* États des cartes (2026-10-22) : six choix sur 3 colonnes (ajout, scan, modification d'un ajout). */
[role="group"][aria-label="État de l’exemplaire"], [role="group"][aria-label="État"] { display: grid !important; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }

/* Ajout d'un seul article (2026-10-22) : centré et agrandi. */
.pkm-art-one { justify-content: center; }
.pkm-art-one > button { width: calc(var(--wk, 1) * 156px) !important; align-items: center; text-align: center !important; padding: 8px 8px 10px !important; }
.pkm-art-one > button > span { align-self: stretch; }
.pkm-art-one > button > span:first-child { height: 196px !important; }
.pkm-art-one > button > span:first-child > img[data-fallback] { width: auto !important; height: 176px !important; aspect-ratio: 63 / 88; margin-top: 0 !important; border-radius: 7px !important; object-fit: contain !important; }
.pkm-art-one > button > span:first-child > img[loading] { object-fit: contain !important; padding: 8px; box-sizing: border-box; }
.pkm-art-one > button > span:first-child > img[data-broken]:not([loading]) { width: 80% !important; height: 60% !important; }
.pkm-art-one > button > span:nth-child(2) { font-size: 15px !important; white-space: normal !important; display: -webkit-box !important; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
.pkm-art-one > button > span:nth-child(3) { font-size: 13.5px !important; }

/* Radar (2026-10-24) : le panneau défile au lieu de comprimer ses blocs (liste et résultats rognés sinon). */
#pkm-radar-sheet > * { flex-shrink: 0; }

/* Petit radar de l'accueil (2026-10-24) : un repère de localisation surgit à chaque passage du faisceau. */
.pkm-hr-pin { position: absolute; width: 12px; height: 15px; margin: -16px 0 0 -6px; color: #FFFFFF; opacity: 0; transform-origin: 50% 100%; animation: pkmPinPop 3s ease-out infinite; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.6)); }
.pkm-hr-pin svg { display: block; width: 100%; height: 100%; }
@keyframes pkmPinPop { 0% { opacity: 0; transform: translateY(4px) scale(0.2); } 7% { opacity: 1; transform: translateY(-1px) scale(1.2); } 13% { transform: none; } 45% { opacity: 1; transform: none; } 62%, 100% { opacity: 0; transform: translateY(-3px) scale(0.85); } }
@media (prefers-reduced-motion: reduce) { .pkm-hr-pin { animation: none; opacity: 1; } }

/* Radar : aide au zoom après le scan (2026-10-25, porteur) : main qui pince, dessinée d'après sa photo, d'un seul trait et dans le rond. */
.pkm-zoomhint { animation: pkmZhIn 0.35s ease-out both; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45); }
@keyframes pkmZhIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: none; } }
/* Le tracé se déforme (animation SVG) : la main reste d'un seul trait pendant tout le geste. Image fixe, doigts écartés,
   si l'utilisateur limite les animations ou si l'Admin les coupe. */
.pkm-zh-static { display: none; }
@media (prefers-reduced-motion: reduce) { .pkm-zoomhint { animation: none; } .pkm-zh-anim { display: none; } .pkm-zh-static { display: inline; } }
html.pkm-calm .pkm-zh-anim { display: none; } html.pkm-calm .pkm-zh-static { display: inline; }

<body>
<!-- Animation d'entrée « Ouverture de booster » (K1, 2026-10-09), insérée par build.mjs dans web/index.html.
     Un booster Dropicards tombe et tremble ; l'éclair du logo le déchire ; le haut s'envole ; des gemmes PK (la monnaie de
     l'app) jaillissent en éventail à la place des cartes (2026-10-25, porteur) ; la gemme du milieu grandit et laisse place
     au logo, qui reste affiché 0,5 s de plus. 3,5 s au plus (2026-10-25, porteur) ; un appui la passe.
     Version complète à chaque démarrage (2026-10-11, demande du porteur ; avant : une fois par jour, puis 0,6 s), y compris
     au retour dans l'app installée après 10 min en arrière-plan ; fondu simple si l'utilisateur limite les animations ; rien si le mode Admin coupe les animations, ni dans un navigateur piloté par des tests
     (?intro=1 force la version complète, ?intro=court la version éclair). Elle joue pendant le chargement de l'app, sans la retarder. Dessin en SVG, animations en CSS. -->
<style>
#pkm-intro { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer;
  background: radial-gradient(110% 60% at 100% 100%, rgba(255, 140, 0, 0.28), rgba(255, 140, 0, 0) 70%), linear-gradient(165deg, #FFE45C 0%, #FFD60A 45%, #FFB703 100%); }
#pkm-intro svg { width: min(100vw, 460px); height: auto; max-height: 100vh; overflow: visible; }
#pkm-intro g, #pkm-intro path, #pkm-intro rect, #pkm-intro image { transform-box: fill-box; transform-origin: center; }
/* Sortie (2026-10-25, porteur) : l'écran d'intro glisse vers le haut, opaque, au lieu de s'effacer par-dessus l'app :
   un fondu laissait voir l'en-tête à travers un voile jaune, comme flou. */
#pkm-intro.pi-out { animation: piWipe 0.3s cubic-bezier(0.5, 0, 0.75, 0) forwards; }
#pkm-intro.pi-full { animation: piWipe 0.38s cubic-bezier(0.5, 0, 0.75, 0) 3.12s forwards; }
#pkm-intro.pi-short { animation: piWipe 0.26s cubic-bezier(0.5, 0, 0.75, 0) 0.36s forwards; }
#pkm-intro.pi-calm { animation: piOut 0.3s ease-in 0.35s forwards; }
@keyframes piOut { to { opacity: 0; visibility: hidden; } }
@keyframes piWipe { to { transform: translateY(-100%); visibility: hidden; } }
/* Version complète : les temps de 2026-10-09 multipliés par 1,5, puis le logo seul tenu 0,5 s de plus (3,5 s, 2026-10-25) */
.pi-full .pi-pack { animation: piDrop 0.54s cubic-bezier(0.2, 0.9, 0.3, 1.25) both, piShake 0.42s ease-in-out 0.54s 1, piFall 0.63s cubic-bezier(0.5, 0, 0.9, 0.4) 1.62s forwards; }
.pi-full .pi-top { animation: piRip 0.54s cubic-bezier(0.3, 0.6, 0.4, 1) 1.05s forwards; }
.pi-full .pi-bolt { opacity: 0; animation: piBolt 0.45s ease-out 0.9s both; }
.pi-full .pi-flash { opacity: 0; animation: piFlash 0.33s ease-out 0.99s both; }
.pi-full .pi-card { opacity: 0; animation: piFan 0.69s cubic-bezier(0.2, 0.9, 0.3, 1.15) both, piAway 0.45s ease-in 1.89s forwards; }
.pi-full .pi-c6 { --x: -150px; --y: -140px; --r: -40deg; animation-delay: 1.2s, 1.86s; }
.pi-full .pi-c1 { --x: -112px; --y: -224px; --r: -24deg; animation-delay: 1.23s, 1.89s; }
.pi-full .pi-c2 { --x: -58px; --y: -268px; --r: -12deg; animation-delay: 1.26s, 1.935s; }
.pi-full .pi-c4 { --x: 58px; --y: -268px; --r: 12deg; animation-delay: 1.29s, 1.935s; }
.pi-full .pi-c5 { --x: 112px; --y: -224px; --r: 24deg; animation-delay: 1.32s, 1.89s; }
.pi-full .pi-c7 { --x: 150px; --y: -140px; --r: 40deg; animation-delay: 1.35s, 1.86s; }
.pi-full .pi-c3 { --x: 0px; --y: -290px; --r: 0deg; animation: piFan 0.69s cubic-bezier(0.2, 0.9, 0.3, 1.15) 1.2s both, piGrow 0.54s cubic-bezier(0.3, 0.7, 0.3, 1) 1.83s forwards; }
.pi-full .pi-logo { opacity: 0; animation: piPop 0.51s cubic-bezier(0.2, 0.9, 0.3, 1.3) 2.13s both; }
.pi-full .pi-spark { opacity: 0; animation: piSpark 0.75s ease-out 2.25s both; }
/* Version éclair et animations réduites : le logo seul */
.pi-short .pi-pack, .pi-short .pi-card, .pi-short .pi-bolt, .pi-short .pi-flash, .pi-short .pi-spark,
.pi-calm .pi-pack, .pi-calm .pi-card, .pi-calm .pi-bolt, .pi-calm .pi-flash, .pi-calm .pi-spark { display: none; }
.pi-short .pi-logo { animation: piPop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
@keyframes piDrop { from { opacity: 0; transform: translateY(-120px) scale(0.86); } to { opacity: 1; transform: none; } }
@keyframes piShake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-3.5deg); } 45% { transform: rotate(3.5deg); } 70% { transform: rotate(-2deg); } 85% { transform: rotate(1.5deg); } }
@keyframes piFall { to { transform: translateY(520px) rotate(8deg); opacity: 0; } }

<script>
(function () {
  var el = document.getElementById('pkm-intro');
  if (!el) return;
  var timer = 0, hiddenAt = 0;
  var done = function () { clearTimeout(timer); if (el) { el.style.display = 'none'; el.className = ''; } };
  var play = function (kind) {
    if (!el) return;
    el.style.display = '';
    el.className = '';
    void el.offsetWidth; // relance les animations CSS depuis le début
    el.className = kind;
    clearTimeout(timer);
    timer = setTimeout(done, kind === 'pi-full' ? 4500 : 1200); // filet de sécurité
  };
  try {
    var q = location.search, force = /[?&]intro=(1|court)(&|$)/.test(q);
    var admin = {};
    try { admin = (JSON.parse(localStorage.getItem('pkm-collection-v1') || '{}') || {}).admin || {}; } catch (e) { admin = {}; }
    if (!force && (navigator.webdriver || /[?&]intro=0(&|$)/.test(q) || (admin.on && admin.flags && admin.flags.motion === false))) { el.parentNode.removeChild(el); el = null; return; }
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var kind = function () { return calm ? 'pi-calm' : /[?&]intro=court(&|$)/.test(q) ? 'pi-short' : 'pi-full'; };
    el.addEventListener('animationend', function (e) { if (e.target === el) done(); });
    el.addEventListener('click', function () { if (el && el.className !== 'pi-out') { el.className = 'pi-out'; } });
    play(kind());
    // App installée sur le téléphone : elle reprend souvent sans recharger la page. Après 10 min en arrière-plan,
    // le retour compte comme un démarrage et rejoue l'animation complète.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') hiddenAt = Date.now();
      else if (hiddenAt && Date.now() - hiddenAt > 600000) { hiddenAt = 0; play(kind()); }
    });
  } catch (e) { done(); }
})();
</script>
