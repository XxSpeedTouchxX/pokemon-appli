/* Couronne dessinée (plus d'emoji, qui pouvait être coupé en haut) ; fenêtre à la hauteur visible du téléphone. */
.pkm-prem-crown-svg { width: 70%; height: 70%; overflow: visible; }
/* Icônes des avantages : scanner, radar (comme sur l'accueil), 2XP. */
.pkm-prem-scan { width: 26px; height: 26px; fill: none; stroke: #FFD60A; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.pkm-prem-scan-card { stroke: #E2D6FF; stroke-width: 1.8; }
.pkm-prem-scan-laser { stroke: #FF5A5A; stroke-width: 2.4; animation: pkmPremLaser 1.8s ease-in-out infinite alternate; }
/* Le même scanner dans le bouton du scan de la barre du bas (couleur du bouton). */
.pkm-navscan { width: 32px; height: 32px; stroke: currentColor; stroke-width: 2.6; }
.pkm-navscan .pkm-prem-scan-card { stroke: currentColor; stroke-width: 2; opacity: 0.85; }
.pkm-navscan .pkm-prem-scan-laser { stroke: #0B1120; stroke-width: 2.6; }
@keyframes pkmPremLaser { from { transform: translateY(-7px); } to { transform: translateY(7px); } }
.pkm-prem-radar { position: relative; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle, rgba(94, 224, 207, 0.22), rgba(94, 224, 207, 0.04) 70%); box-shadow: inset 0 0 0 1px rgba(94, 224, 207, 0.45); }
.pkm-prem-radar i { position: absolute; border-radius: 50%; }
.pkm-prem-radar-r1 { inset: 6px; box-shadow: inset 0 0 0 1px rgba(94, 224, 207, 0.4); }
.pkm-prem-radar-r2 { inset: 11px; box-shadow: inset 0 0 0 1px rgba(94, 224, 207, 0.3); }
.pkm-prem-radar-sweep { inset: 0; background: conic-gradient(from 0deg, rgba(94, 224, 207, 0) 0deg, rgba(94, 224, 207, 0) 270deg, rgba(94, 224, 207, 0.6) 360deg); animation: pkmSpin 3s linear infinite; }
.pkm-prem-radar-dot { left: 13px; top: 13px; width: 6px; height: 6px; background: #5EE0CF; }
@media (prefers-reduced-motion: reduce) { .pkm-prem-scan-laser, .pkm-prem-radar-sweep { animation: none; } }

/* Retour au PK shop (2026-11-07, porteur). */
.pkm-prem-back { position: absolute; z-index: 2; left: 14px; top: 16px; width: 44px; height: 44px; padding: 0; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 22px; background: rgba(18, 11, 36, 0.55); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.pkm-prem-back svg { display: block; margin-left: -2px; }
/* Icônes animées des avantages (2026-11-07, porteur) : classeur d'où une carte sort et rentre, double XP des PA,
   graphique qui se dessine (flèche jaune retirée le 2026-11-07, porteur). Toutes dans la même case de 38 px, alignées. */
.pkm-prem-bind, .pkm-prem-hist { width: 28px; height: 28px; overflow: visible; }
.pkm-prem-bind-body { fill: #FFD60A; stroke: #7A4A00; stroke-width: 1.5; }
.pkm-prem-bind-spine { fill: #E09A00; stroke: #7A4A00; stroke-width: 1.5; }
.pkm-prem-bind-ring { fill: none; stroke: #E8ECF2; stroke-width: 2; stroke-linecap: round; }
.pkm-prem-bind-label { fill: #FFF3A6; stroke: #7A4A00; stroke-width: 1; }
.pkm-prem-bind-gem { fill: #FFD60A; stroke: #7A4A00; stroke-width: 1.1; stroke-linejoin: round; }
.pkm-prem-bind-card { fill: #E2D6FF; stroke: #5B2BD6; stroke-width: 1.4; animation: pkmPremCard 2.6s ease-in-out infinite; }
@keyframes pkmPremCard { 0%, 15% { transform: translateY(5px); } 45%, 62% { transform: translateY(-5px) rotate(-5deg); } 90%, 100% { transform: translateY(5px); } }
.pkm-prem-bind-card { transform-box: fill-box; transform-origin: 50% 100%; }
.pkm-prem-hist-axis { fill: none; stroke: #8E82B3; stroke-width: 1.6; stroke-linecap: round; }
.pkm-prem-hist-line { fill: none; stroke: #5EE0CF; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: pkmPremDraw 3s ease-in-out infinite; }
@keyframes pkmPremDraw { 0% { stroke-dashoffset: 40; } 45%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -40; } }
.pkm-prem-xp { position: relative; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; }
.pkm-prem-xp-drop { display: block; filter: drop-shadow(0 0 6px rgba(178, 107, 255, 0.85)); animation: pkmPremBob 2s ease-in-out infinite; }
@keyframes pkmPremBob { 0%, 100% { transform: translateY(-2px) scale(1); } 50% { transform: translateY(1px) scale(1.08); } }
.pkm-prem-perks .pkm-prem-xp-tag { display: flex; align-items: center; justify-content: center; box-sizing: border-box; height: 13px; position: absolute; right: -2px; bottom: 0; padding: 4.5px 4px 0; border-radius: 5px; background: linear-gradient(180deg, #FFE46B, #FFB000); color: #2B124C; font-family: 'Luckiest Guy', 'Sora', sans-serif; font-size: 8.5px; line-height: 1; font-weight: 900; text-align: center; box-shadow: 0 0 0 1.2px #7A4A00; animation: pkmPremTag 2s ease-in-out infinite; }
@keyframes pkmPremTag { 0%, 70%, 100% { transform: scale(1) rotate(-6deg); } 80% { transform: scale(1.25) rotate(4deg); } 90% { transform: scale(0.95) rotate(-8deg); } }
.pkm-prem-xp-spark { position: absolute; left: 4px; top: 3px; width: 7px; height: 7px; background: #FFFFFF; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: pkmPremSpark 2s ease-in-out infinite; }
@keyframes pkmPremSpark { 0%, 40%, 100% { opacity: 0; transform: scale(0.4); } 60% { opacity: 1; transform: scale(1.2) rotate(45deg); } }
.pkm-prem-ico { overflow: visible; }
@media (prefers-reduced-motion: reduce) { .pkm-prem-bind-card, .pkm-prem-hist-line, .pkm-prem-xp-drop, .pkm-prem-xp-tag, .pkm-prem-xp-spark, .pkm-prem-banner, .pkm-prem-banner::after { animation: none; } .pkm-prem-hist-line { stroke-dashoffset: 0; } }
/* Paiement branché (2026-11-07) : abonné Premium, erreur, bouton occupé, paiement sécurisé. */
.pkm-prem-cta[aria-disabled="true"] { opacity: 0.75; cursor: progress; }
.pkm-prem-mine { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 18px; border: 2px solid #FFD60A; background: linear-gradient(180deg, rgba(255, 214, 10, 0.16), rgba(255, 214, 10, 0.03)), #1B1233; }
.pkm-prem-mine b { font-size: 17px; color: #FFE46B; }
.pkm-prem-mine span { font-size: 14px; line-height: 1.45; color: #E7E2F5; }
.pkm-prem-err { margin: 0; padding: 10px 12px; border-radius: 12px; background: rgba(255, 99, 99, 0.14); color: #FFB4B4; font-size: 13.5px; line-height: 1.45; }
.pkm-prem-secure { background: rgba(94, 224, 207, 0.1); color: #BFEFE8; }
.pkm-prem-cgv { align-self: center; min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #CFC4F5; font: inherit; font-size: 13.5px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
/* Soutenir Dropicards (2026-11-09) : main ouverte qui tient un cœur qui bat. */
.pkm-prem-heart { width: 30px; height: 30px; overflow: visible; }
.pkm-prem-heart-h { fill: #FF5C8A; stroke: #7A1238; stroke-width: 1.2; transform-box: fill-box; transform-origin: 50% 70%; animation: pkmPremBeat 1.3s ease-in-out infinite; }
.pkm-prem-heart-hand { fill: none; stroke: #FFD23F; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pkm-prem-heart-rays { fill: none; stroke: #FF9DBA; stroke-width: 1.6; stroke-linecap: round; animation: pkmPremRays 1.3s ease-in-out infinite; }
@keyframes pkmPremBeat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(0.98); } 45% { transform: scale(1.1); } }
@keyframes pkmPremRays { 0%, 100% { opacity: 0.2; } 30% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pkm-prem-heart-h, .pkm-prem-heart-rays { animation: none; } }

/* L'offre Premium s'ouvre au-dessus de l'écran « Mon avatar » (2026-11-12) : elle restait cachée dessous et réapparaissait après « Valider mon avatar ». */
.pkm-pas-wrap.pkm-prem-wrap { z-index: 85; }

/* Fenêtres d'infos qui montent du bas (2026-11-08, porteur) : même mouvement que « Mon Pokédex » (dex.css). La fermeture
   glissée est dans sheet.js. */
.pkm-sheet { animation: pkmDexlUp 0.48s cubic-bezier(0.32, 0.72, 0, 1) both; }
:has(> .pkm-sheet) { animation: pkmSheetFade 0.32s ease-out both; }

html.pkm-calm .pkm-sheet, html.pkm-calm :has(> .pkm-sheet) { animation: none; }

/* « Ma progression » (2026-11-08, porteur) : saison, carte du joueur, podium, classement, lots. */
.pkm-pg-banner { flex: none; display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 22px; border: 1px solid #5B4A12; background: linear-gradient(120deg, rgba(255, 214, 10, 0.22), rgba(255, 214, 10, 0) 55%), #121C33; color: #F3F6FC; font: inherit; text-align: left; cursor: pointer; }
.pkm-pg-banner > span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pkm-pg-banner b { font-family: 'Sora', sans-serif; font-size: 17px; }
.pkm-pg-banner small { font-size: 12.5px; color: #C9D3EA; }
.pkm-pg-banner svg { flex: none; fill: none; stroke: #FFD60A; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pkm-pg-banner-cup { flex: none; filter: drop-shadow(0 4px 8px rgba(255, 190, 0, 0.35)); animation: pkmPgBob 2.6s ease-in-out infinite; }
@keyframes pkmPgBob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-3px) rotate(4deg); } }

.pkm-pg-season { flex: none; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6px 12px; padding: 14px 16px; border-radius: 22px; border: 1px solid #5B4A12; background: radial-gradient(120% 90% at 0% 0%, rgba(255, 214, 10, 0.25), rgba(255, 214, 10, 0) 60%), #121C33; color: #F3F6FC; }
.pkm-pg-sbadge { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 6px; border-radius: 999px; background: #FFD60A; color: #0B1120; }
.pkm-pg-sbadge b { font-family: 'Luckiest Guy', 'Sora', sans-serif; font-weight: 400; font-size: 19px; letter-spacing: 0.04em; line-height: 1; padding-top: 3px; }
.pkm-pg-stext { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pkm-pg-stext b { font-size: 14.5px; }
.pkm-pg-stext span { font-size: 12px; color: #C9D3EA; }
.pkm-pg-sbar { grid-column: 1 / -1; display: block; height: 8px; border-radius: 4px; background: #24345C; overflow: hidden; }
.pkm-pg-sbar > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #FFD60A, #FF9F1C); }

.pkm-pg-card { flex: none; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 18px 16px 16px; border-radius: 26px; border: 1px solid #3B4F86; background: linear-gradient(150deg, #1C2C57, #0F1830 60%, #241650); color: #F3F6FC; box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35); }
.pkm-pg-card::before { content: ''; position: absolute; inset: -40% -20% auto auto; width: 70%; height: 120%; background: radial-gradient(closest-side, rgba(255, 214, 10, 0.18), rgba(255, 214, 10, 0)); pointer-events: none; }
.pkm-pg-card-top { position: relative; display: flex; align-items: center; gap: 12px; }

/* Cadres animés (2026-11-10, porteur) : un anneau dessiné autour de l'élément (::before, découpé en anneau par un
   masque), sans toucher à son contenu. Utilisés sur l'aperçu, la bulle de Mon profil, l'avatar de l'en-tête et les
   vignettes du choix. --frw : épaisseur de l'anneau. Prix proposés, à confirmer (avatar.js, AV_FRAMES). */
@property --pkm-fra { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.pkm-fr { position: relative; --frw: 4px; }
.pkm-fr-aucun::before, .pkm-fr-aucun::after { content: none; }
.pkm-fr:not(.pkm-fr-aucun)::before { content: ''; position: absolute; inset: calc(-1 * var(--frw)); z-index: 2; border-radius: inherit; padding: var(--frw); pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  background: var(--frbg); animation: pkmFrSpin var(--frt, 4s) linear infinite; }
.pkm-fr:not(.pkm-fr-aucun)::after { content: ''; position: absolute; inset: calc(-1 * var(--frw)); z-index: 1; border-radius: inherit; pointer-events: none; box-shadow: 0 0 calc(var(--frw) * 3) var(--frglow, transparent); animation: pkmFrGlow var(--frg, 2.4s) ease-in-out infinite; }
@keyframes pkmFrSpin { to { --pkm-fra: 360deg; } }
@keyframes pkmFrGlow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
.pkm-fr-dore { --frbg: conic-gradient(from var(--pkm-fra), #7A4A00, #FFD60A, #FFF6C2, #F2A900, #7A4A00, #FFE46B, #7A4A00); --frglow: rgba(255, 214, 10, 0.55); --frt: 5s; }
.pkm-fr-arcenciel { --frbg: conic-gradient(from var(--pkm-fra), #FF4D6D, #FF9F1C, #FFE14D, #3BC48A, #3D8BFF, #9B6BFF, #FF4D6D); --frglow: rgba(255, 255, 255, 0.55); --frt: 3s; }
.pkm-fr-tempete { --frbg: conic-gradient(from var(--pkm-fra), #0E3B2E, #1E7F5C, #6EF2B4, #2F3A48, #0E3B2E, #3BC48A, #E8FFF4 52%, #1E7F5C 54%, #0E3B2E); --frglow: rgba(59, 196, 138, 0.7); --frt: 2.6s; --frg: 1.3s; }
.pkm-fr-tempete::after { animation-name: pkmFrStorm; }
@keyframes pkmFrStorm { 0%, 78%, 100% { opacity: 0.5; } 80% { opacity: 1; box-shadow: 0 0 calc(var(--frw) * 6) #E8FFF4; } 83% { opacity: 0.6; } 86% { opacity: 1; box-shadow: 0 0 calc(var(--frw) * 5) #6EF2B4; } }
.pkm-fr-vague { --frbg: conic-gradient(from var(--pkm-fra), #0B3D91, #3D8BFF, #BDE6FF, #3D8BFF, #0B3D91, #5EC8F0, #FFFFFF 40%, #5EC8F0 44%, #0B3D91); --frglow: rgba(61, 139, 255, 0.7); --frt: 3.4s; }
.pkm-fr-vague::after { animation-name: pkmFrWave; }
@keyframes pkmFrWave { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.04); opacity: 1; } }
.pkm-fr-lave { --frbg: conic-gradient(from var(--pkm-fra), #3A0A04, #C7260E, #FF6A00, #FFD60A, #FF6A00, #7A1A12, #FF9F1C, #3A0A04); --frglow: rgba(255, 106, 0, 0.8); --frt: 5s; --frg: 0.9s; }
.pkm-fr-lave::after { animation-name: pkmFrLava; }
@keyframes pkmFrLava { 0%, 100% { opacity: 0.6; } 30% { opacity: 1; } 55% { opacity: 0.75; } 70% { opacity: 1; } }
.pkm-fr-galaxie { --frbg: radial-gradient(circle at 20% 30%, #FFFFFF 0 1px, transparent 2px), radial-gradient(circle at 75% 70%, #FFFFFF 0 1px, transparent 2px), conic-gradient(from var(--pkm-fra), #1B0F3A, #6A3CEB, #FF5BE1, #2B3F7A, #1B0F3A, #9B6BFF, #1B0F3A); --frglow: rgba(155, 107, 255, 0.7); --frt: 6s; }
.pkm-fr-eclair { --frbg: conic-gradient(from var(--pkm-fra), #2A1E2E, #FFD60A 10%, #FFFFFF 12%, #FFD60A 14%, #2A1E2E 30%, #FFD60A 60%, #FFF6C2 62%, #2A1E2E 80%); --frglow: rgba(255, 214, 10, 0.9); --frt: 1.6s; --frg: 0.7s; }
.pkm-fr-glace { --frbg: conic-gradient(from var(--pkm-fra), #BDE6FF, #FFFFFF, #8FD3FF, #E8F7FF, #5EC8F0, #FFFFFF, #BDE6FF); --frglow: rgba(189, 230, 255, 0.85); --frt: 7s; }
.pkm-fr-neon { --frbg: conic-gradient(from var(--pkm-fra), #FF2BD6, #2BF0FF, #FF2BD6, #2BF0FF, #FF2BD6); --frglow: rgba(255, 43, 214, 0.9); --frt: 2.2s; --frg: 1s; }
.pkm-fr-brume { --frbg: conic-gradient(from var(--pkm-fra), #2A1E3E, #8A6BD8, #D9CCFF, #4A3A6B, #2A1E3E, #B9A6F0, #2A1E3E); --frglow: rgba(185, 166, 240, 0.7); --frt: 8s; --frg: 3.6s; }
.pkm-fr-sakura { --frbg: radial-gradient(circle at 15% 20%, #FFFFFF 0 1.5px, transparent 2.5px), radial-gradient(circle at 80% 85%, #FFFFFF 0 1.5px, transparent 2.5px), conic-gradient(from var(--pkm-fra), #FFB3DF, #FF7AC6, #FFF0F7, #FF9ACD, #FFB3DF, #FFE4F2, #FFB3DF); --frglow: rgba(255, 122, 198, 0.65); --frt: 6s; }
.pkm-fr-holo { --frbg: conic-gradient(from var(--pkm-fra), #FF8AD8, #8FD3FF, #A8F0C8, #FFE46B, #C9A6FF, #FF8AD8); --frglow: rgba(201, 166, 255, 0.7); --frt: 2.8s; }
@media (prefers-reduced-motion: reduce) { .pkm-fr::before, .pkm-fr::after { animation: none !important; } }
/* Aperçu : l'anneau entoure l'avatar ; bulle de l'en-tête et de Mon profil : anneau plus fin. */
.pkm-av-frwrap { display: block; border-radius: 52px; --frw: 6px; }
.pkm-av-ui1 .pkm-av-frwrap { border-radius: 44px; }
.pkm-av-ui2 .pkm-av-frwrap { width: 100%; border-radius: 22px; }
.pkm-av-ui3 .pkm-av-frwrap { width: 100%; border-radius: 0 0 36px 36px; }
.pkm-hh-me.pkm-fr { --frw: 3px; }
.pkm-pf-photo.pkm-fr { --frw: 4px; }
.pkm-av-frgrid { row-gap: 12px; }
.pkm-av-fropt { padding-top: 14px; }
.pkm-av-fropt .pkm-av-pro { top: -6px; right: -4px; z-index: 3; }
.pkm-av-frdot { display: block; width: 46px; height: 46px; border-radius: 50%; --frw: 5px; }
.pkm-av-frin { display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #FFF0A0, #F2A900); }
.pkm-av-frdot.pkm-fr-aucun .pkm-av-frin { box-shadow: inset 0 0 0 2px #5A6A8E; }

/* ——— Mon avatar v4 (2026-11-11, porteur) : écran coupé en trois. En haut (45 %, figé) l'avatar et les 2 lignes de
   rubriques ; au milieu (45 %) les choix, qui défilent au doigt ; en bas (10 %, figé) « Valider mon avatar ». L'écran
   couvre toute la hauteur (au-dessus de la barre du bas). ——— */
.pkm-av-full { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; background: var(--pkm-app, #FFD60A); color: var(--pkm-t1, #0B1120); }
.pkm-av-full .pkm-av-top { flex: none; height: 45%; height: 45dvh; min-height: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: calc(env(safe-area-inset-top, 0px) + 6px) 12px 6px; background: none; border-radius: 0; box-shadow: none; }
.pkm-av-head { flex: none; display: flex; align-items: center; gap: 10px; height: 38px; }
.pkm-av-head b { flex: 1; font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 600; }
.pkm-av-back { flex: none; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 19px; background: #0B1120; color: #FFFFFF; cursor: pointer; }
.pkm-av-back svg { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pkm-av-pa { flex: none; display: flex; align-items: center; gap: 5px; padding: 5px 10px 5px 6px; border-radius: 999px; background: #0B1120; color: #FFFFFF; font-size: 13.5px; font-weight: 800; }
.pkm-av-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.pkm-av-card { height: 100%; aspect-ratio: 1; max-width: 100%; box-sizing: border-box; padding: 7px; border-radius: 24px; background: linear-gradient(135deg, #FFE46B, #F2A900 40%, #FFF3B0 55%, #E8A100); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28); }
.pkm-av-full .pkm-av-frwrap { width: 100%; height: 100%; border-radius: 18px; --frw: 5px; }
.pkm-av-full .pkm-av-prev { width: 100%; height: 100%; border-radius: 18px; border: 3px solid #0B1120; box-shadow: none; box-sizing: border-box; }
.pkm-av-full .pkm-av-prev::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0.24) 45%, rgba(255, 255, 255, 0) 60%); background-size: 250% 100%; animation: pkmAvHolo 4s ease-in-out infinite; }
.pkm-av-full .pkm-av-tabs { flex: none; gap: 6px; padding: 0; border: 0; background: transparent; }
.pkm-av-full .pkm-av-tab { flex-direction: row; justify-content: center; gap: 5px; min-height: 38px; padding: 0 4px; border-radius: 14px; background: #111A2C; border: 2px solid #1E2B45; font-size: 12px; }
.pkm-av-full .pkm-av-tab svg { width: 18px; height: 18px; flex: none; padding: 0; background: none; }
.pkm-av-full .pkm-av-tab.pkm-av-tab-on { background: #FFD60A; border-color: #0B1120; color: #0B1120; }
.pkm-av-full .pkm-av-tab2.pkm-av-tab-on { background: linear-gradient(135deg, #FF7AC6, #B26BFF); border-color: #FFFFFF; color: #FFFFFF; }
.pkm-av-tab svg.pkm-av-ifill { fill: currentColor; stroke: none; }
.pkm-av-mid { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; padding: 8px 12px 14px; box-sizing: border-box; scrollbar-width: none; }
.pkm-av-mid::-webkit-scrollbar { display: none; }
.pkm-av-bot { flex: none; height: 10%; height: 10dvh; min-height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 6px 16px calc(env(safe-area-inset-bottom, 0px) + 6px); background: rgba(11, 17, 32, 0.08); border-top: 1px solid rgba(11, 17, 32, 0.12); }
.pkm-av-bot .pkm-av-savebtn { max-width: 440px; min-height: 50px; }
.pkm-av-full .pkm-av-trial { margin: 0; }
/* Grille des 171 Pokémon de l'avatar : tous en couleur ; débloqués cochés, les autres avec leur prix en PA. */
.pkm-av-full .pkm-av-pks { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pkm-av-full .pkm-av-pk { position: relative; gap: 2px; padding: 6px 2px 7px; background: #0B1120; border: 2px solid #1E2B45; }
.pkm-av-pk-own { border-color: rgba(59, 196, 138, 0.6) !important; }
.pkm-av-full .pkm-av-pk.pkm-av-on { border-color: #FFD60A !important; background: rgba(255, 214, 10, 0.12); }
.pkm-av-own { color: #3BC48A !important; font-weight: 800; font-size: 10.5px !important; }
.pkm-av-price { display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px 1px 3px; border-radius: 999px; background: rgba(178, 107, 255, 0.22); color: #E6D4FF !important; font-weight: 800; font-size: 10.5px !important; }
/* Taille, rotation, recentrer (Pokémon et accessoire). */
.pkm-av-ctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(46px, 1fr)); gap: 6px; }
.pkm-av-ctl button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; padding: 6px 2px; border: 1px solid #2A3A5C; border-radius: 14px; background: #0B1120; color: #F3F6FC; font: inherit; cursor: pointer; }
.pkm-av-ctl svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pkm-av-ctl small { font-size: 10.5px; font-weight: 700; color: #C9D3EA; }
.pkm-av-premnote { margin-top: -4px; font-size: 12px; text-align: center; }
.pkm-av-wrap { z-index: 80; }
.pkm-av-full .pkm-av-pk-l, .pkm-av-full .pkm-av-acc { transform-origin: 50% 50%; }
@media (prefers-reduced-motion: reduce) { .pkm-av-full .pkm-av-prev::after { animation: none; } }

/* ——— Mon avatar v5 (2026-11-11, soir, porteur) ——— */
/* Écran 50/50 : l'avatar et ses rubriques (moitié haute, figée) ; les choix qui défilent et « Valider mon avatar » (moitié basse). */
/* Répartition 58 / 32 / 10 (2026-11-13, porteur) : haut figé 58 %, choix qui défilent 32 %, « Valider mon avatar » 10 %. */
.pkm-av-full .pkm-av-top { height: 58%; height: 58dvh; min-height: 300px; }
.pkm-av-bot { height: 10%; height: 10dvh; min-height: 64px; }
/* Prix en PA : la goutte des PA à côté du nombre (plus de couronne dorée). */
.pkm-av-pro { display: inline-flex; align-items: center; gap: 2px; padding: 2px 7px 2px 3px; background: linear-gradient(135deg, #B26BFF, #6A3CEB); color: #FFFFFF; font-size: 10.5px; }
.pkm-av-pro::before { content: none; }
.pkm-av-pro img { flex: none; filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.8)); }
.pkm-av-pro-ok { padding: 2px 6px; background: #3BC48A; font-size: 11px; }
.pkm-av-pro-big { gap: 4px; padding: 4px 12px 4px 6px; font-size: 14px; }
/* Éclat de déblocage sur l'aperçu. */
.pkm-av-burst { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.pkm-av-burst b { padding: 6px 14px; border-radius: 999px; background: #3BC48A; color: #FFFFFF; font-size: 15px; font-weight: 900; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); animation: pkmAvBurstTxt 1.6s ease-out both; }
.pkm-av-burst i { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #FFE46B; box-shadow: 0 0 8px #FFE46B; animation: pkmAvBurst 1.1s ease-out both; }
.pkm-av-burst i:nth-child(2n) { background: #B26BFF; box-shadow: 0 0 8px #B26BFF; }
.pkm-av-burst i:nth-child(1) { --dx: 0; --dy: -90px; } .pkm-av-burst i:nth-child(2) { --dx: 64px; --dy: -64px; } .pkm-av-burst i:nth-child(3) { --dx: 90px; --dy: 0; } .pkm-av-burst i:nth-child(4) { --dx: 64px; --dy: 64px; }
.pkm-av-burst i:nth-child(5) { --dx: 0; --dy: 90px; } .pkm-av-burst i:nth-child(6) { --dx: -64px; --dy: 64px; } .pkm-av-burst i:nth-child(7) { --dx: -90px; --dy: 0; } .pkm-av-burst i:nth-child(8) { --dx: -64px; --dy: -64px; }
@keyframes pkmAvBurst { from { transform: translate(0, 0) scale(0.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; } }
@keyframes pkmAvBurstTxt { 0% { transform: scale(0.3); opacity: 0; } 25% { transform: scale(1.15); opacity: 1; } 40% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
@media (prefers-reduced-motion: reduce) { .pkm-av-burst i { display: none; } }
/* Nouveaux cadres animés (2026-11-11) : chacun son mouvement. */
.pkm-fr-feu { --frbg: conic-gradient(from var(--pkm-fra), #FF3D00, #FFD60A, #FF6A00, #C7260E, #FF9F1C, #FFE46B, #FF3D00); --frglow: rgba(255, 106, 0, 0.9); --frt: 1.4s; --frg: 0.35s; }
.pkm-fr-feu::after { animation-name: pkmFrFlick; }
@keyframes pkmFrFlick { 0%, 100% { opacity: 0.6; } 20% { opacity: 1; } 35% { opacity: 0.7; } 60% { opacity: 0.95; } 80% { opacity: 0.55; } }
.pkm-fr-electrique { --frbg: repeating-conic-gradient(from var(--pkm-fra), #FFD60A 0 12deg, #2BF0FF 12deg 20deg, #0B1120 20deg 30deg); --frglow: rgba(43, 240, 255, 0.9); --frt: 1.2s; --frg: 0.5s; }
.pkm-fr-electrique::before { animation-timing-function: steps(6); }
.pkm-fr-electrique::after { animation-name: pkmFrZap; }
@keyframes pkmFrZap { 0%, 49% { opacity: 0.3; } 50%, 60% { opacity: 1; } 61%, 100% { opacity: 0.4; } }
.pkm-fr-bulles { --frbg: radial-gradient(circle at 20% 20%, #FFFFFF 0 2px, transparent 3px), radial-gradient(circle at 70% 80%, #FFFFFF 0 2px, transparent 3px), conic-gradient(from var(--pkm-fra), #8FD3FF, #FFB3DF, #A8F0C8, #FFF3A6, #8FD3FF); --frglow: rgba(143, 211, 255, 0.7); --frt: 7s; }
.pkm-fr-bulles::after { animation-name: pkmFrWave; }
.pkm-fr-pixel { --frbg: repeating-conic-gradient(from var(--pkm-fra), #3BC48A 0 15deg, #0B1120 15deg 30deg, #FFD60A 30deg 45deg, #0B1120 45deg 60deg); --frglow: rgba(59, 196, 138, 0.6); --frt: 4s; }
.pkm-fr-pixel::before { animation-timing-function: steps(12); }
.pkm-fr-diamant { --frbg: linear-gradient(115deg, #BDE6FF 0%, #FFFFFF 18%, #8FD3FF 30%, #E8F7FF 45%, #FFFFFF 50%, #8FD3FF 62%, #FFFFFF 80%, #BDE6FF 100%); --frglow: rgba(255, 255, 255, 0.95); }
.pkm-fr-diamant::before { background-size: 300% 300%; animation: pkmFrSweep 2.4s linear infinite; }
@keyframes pkmFrSweep { from { background-position: 0% 50%; } to { background-position: 300% 50%; } }
.pkm-fr-ombre { --frbg: conic-gradient(from var(--pkm-fra), #0B0620, #4A2A7A, #0B0620, #2A1650, #0B0620); --frglow: rgba(122, 63, 216, 0.95); --frt: 9s; --frg: 2s; }
.pkm-fr-ombre::after { animation-name: pkmFrBreath; }
@keyframes pkmFrBreath { 0%, 100% { opacity: 0.3; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.05); } }
.pkm-fr-cosmique { --frbg: radial-gradient(circle at 30% 20%, #FFFFFF 0 1.5px, transparent 2.5px), radial-gradient(circle at 80% 60%, #FFFFFF 0 1.5px, transparent 2.5px), conic-gradient(from var(--pkm-fra), #FF5BE1, #6A3CEB, #2BF0FF, #FFD60A, #FF5BE1); --frglow: rgba(255, 91, 225, 0.8); --frt: 5s; }
.pkm-fr-cristal { --frbg: conic-gradient(from var(--pkm-fra), #E8F7FF, #8FD3FF, #FFFFFF, #C9A6FF, #E8F7FF, #8FD3FF, #FFFFFF); --frglow: rgba(201, 166, 255, 0.85); --frt: 3s; --frg: 1.2s; }
.pkm-fr-cristal::after { animation-name: pkmFrBreath; }

/* 2026-11-12 (porteur) : haut figé à 70 % de l'écran ; solde de PA bien lisible ; animation « Avatar enregistré ». */
.pkm-av-full .pkm-av-pa { padding: 6px 13px 6px 7px; gap: 6px; font-size: 16px; font-weight: 800; letter-spacing: 0.01em; color: #FFFFFF; background: #0B1120; border: 2px solid #FFFFFF; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
.pkm-av-full .pkm-av-pa img { width: 22px; height: 22px; }
.pkm-av-saved { position: absolute; inset: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(11, 17, 32, 0.82); color: #FFFFFF; animation: pkmAvSavedIn 0.25s ease-out both; }
.pkm-av-saved > b { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700; animation: pkmAvSavedTxt 0.5s 0.25s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
.pkm-av-saved-card { position: relative; width: 170px; height: 170px; border-radius: 30px; padding: 6px; background: linear-gradient(135deg, #FFE46B, #F2A900 40%, #FFF3B0 55%, #E8A100); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); animation: pkmAvSavedPop 0.6s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
.pkm-av-saved-img { width: 100%; height: 100%; border-radius: 24px; display: block; object-fit: cover; }
.pkm-av-saved-ok { position: absolute; right: -12px; bottom: -12px; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #22B35E; border: 4px solid #FFFFFF; animation: pkmAvSavedTxt 0.45s 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
.pkm-av-saved-ok path { fill: none; stroke: #FFFFFF; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: pkmAvSavedTick 0.4s 0.7s ease-out forwards; }
.pkm-av-saved-fx { position: absolute; left: 50%; top: 45%; width: 0; height: 0; pointer-events: none; }
.pkm-av-saved-fx i { position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 3px; background: #FFD60A; opacity: 0; animation: pkmAvSavedSpark 0.9s 0.35s ease-out forwards; }
.pkm-av-saved-fx i:nth-child(2n) { background: #FF7AC6; }
.pkm-av-saved-fx i:nth-child(3n) { background: #5EE0CF; }
.pkm-av-saved-fx i:nth-child(1) { --dx: 0px; --dy: -150px; } .pkm-av-saved-fx i:nth-child(2) { --dx: 106px; --dy: -106px; }
.pkm-av-saved-fx i:nth-child(3) { --dx: 150px; --dy: 0px; } .pkm-av-saved-fx i:nth-child(4) { --dx: 106px; --dy: 106px; }
.pkm-av-saved-fx i:nth-child(5) { --dx: 0px; --dy: 150px; } .pkm-av-saved-fx i:nth-child(6) { --dx: -106px; --dy: 106px; }
.pkm-av-saved-fx i:nth-child(7) { --dx: -150px; --dy: 0px; } .pkm-av-saved-fx i:nth-child(8) { --dx: -106px; --dy: -106px; }
@keyframes pkmAvSavedIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pkmAvSavedPop { 0% { transform: scale(0.4) rotate(-8deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes pkmAvSavedTxt { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes pkmAvSavedTick { to { stroke-dashoffset: 0; } }
@keyframes pkmAvSavedSpark { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4) rotate(160deg); } }
@media (prefers-reduced-motion: reduce) { .pkm-av-saved, .pkm-av-saved > b, .pkm-av-saved-card, .pkm-av-saved-ok, .pkm-av-saved-fx i { animation: none; opacity: 1; } .pkm-av-saved-ok path { stroke-dashoffset: 0; animation: none; } .pkm-av-saved-fx { display: none; } }
/* Un seul cadre (2026-11-12, porteur : « on a l'impression qu'il y a deux cadres l'un dans l'autre ») : avec un cadre
   choisi dans Décor, l'anneau de couleur du grade autour de l'image disparaît ; l'avatar remplit tout l'intérieur du
   cadre (en-tête et Mon profil). Sans cadre (« Aucun »), l'anneau du grade reste. */
.pkm-hh-me.pkm-fr:not(.pkm-fr-aucun) > img:first-of-type { width: 62px !important; height: 62px !important; margin: 0 !important; border: 0 !important; border-radius: 17px !important; }
.pkm-pf-photo.pkm-fr:not(.pkm-fr-aucun) > img:first-of-type { border: 0 !important; }

/* Mon profil (2026-11-13, porteur) : la bulle du crayon (en bas à gauche de l'avatar) passe devant le cadre choisi au lieu
   d'être coupée par lui ; même chose pour la pastille du grade. */
.pkm-pf-photo > .pkm-pf-cam { z-index: 3; }
.pkm-pf-photo > svg { z-index: 3; }
/* Emblème du grade retiré de l'avatar de Mon profil (2026-11-13, porteur) : il reste seulement en haut de l'accueil,
   au-dessus du logo Dropicards. */
.pkm-pf-photo > img.pkm-grade { display: none !important; }

/* App des stores (store.js, 2026-11-09) : aucune offre payante tant que l'achat intégré n'est pas branché. */
.pkm-store .pkm-prem-banner,
.pkm-store .pkm-prem-wrap,
.pkm-store .pkm-shop-tabs,
.pkm-store .pkm-pas,
.pkm-store .pkm-lockw-prem,
.pkm-store .pkm-lockw-premgo,
.pkm-store .pkm-av-premgo { display: none !important; }

/* Supprimer mon compte (profile.js, 2026-11-09) : discret, rouge, avec confirmation. */
.pkm-acct-del { align-self: flex-start; min-height: 40px; padding: 0 4px; border: 0; background: transparent; color: #FF8A8A; font: inherit; font-size: 13.5px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.pkm-acct-del-ask { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 16px; border: 1px solid #7A2A2A; background: #2A1416; }
.pkm-acct-del-ask p { margin: 0; font-size: 13px; line-height: 1.45; color: #F3F6FC; }
.pkm-acct-del-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pkm-acct-del-go { min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #E5484D; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
.pkm-acct-del-no { min-height: 44px; padding: 0 16px; border: 1px solid #2A3A5C; border-radius: 999px; background: transparent; color: #F3F6FC; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }

/* Achats réservés aux admins (store.js, 2026-11-12) : pas d'offre Premium ni de « Recharger mes PA » pour les joueurs. */
.pkm-nobuy .pkm-prem-banner,
.pkm-nobuy .pkm-lockw-prem,
.pkm-nobuy .pkm-lockw-premgo,
.pkm-nobuy .pkm-av-premgo,

<body>
<!-- Animation d'entrée « Ouverture de booster » (K1, 2026-10-09), insérée par build.mjs dans web/index.html.
     Un booster Dropicards tombe et tremble ; l'éclair du logo le déchire ; le haut s'envole ; des gemmes PK (la monnaie de
     l'app) jaillissent en éventail à la place des cartes (2026-10-25, porteur) ; la gemme du milieu grandit et laisse place
     au logo, qui reste affiché 0,5 s de plus. 3,5 s au plus (2026-10-25, porteur) ; un appui la passe.
     Version complète à chaque démarrage (2026-10-11, demande du porteur ; avant : une fois par jour, puis 0,6 s), y compris
     au retour dans l'app installée après 10 min en arrière-plan ; fondu simple si l'utilisateur limite les animations ; rien si le mode Admin coupe les animations, ni dans un navigateur piloté par des tests
     (?intro=1 force la version complète, ?intro=court la version éclair). Elle joue pendant le chargement de l'app, sans la retarder. Dessin en SVG, animations en CSS. -->
<style>
#pkm-intro { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer;
  background: radial-gradient(110% 60% at 100% 100%, rgba(255, 140, 0, 0.28), rgba(255, 140, 0, 0) 70%), linear-gradient(165deg, #FFE45C 0%, #FFD60A 45%, #FFB703 100%); }
#pkm-intro svg { width: min(100vw, 460px); height: auto; max-height: 100vh; overflow: visible; }
#pkm-intro g, #pkm-intro path, #pkm-intro rect, #pkm-intro image { transform-box: fill-box; transform-origin: center; }
/* Sortie (2026-10-25, porteur) : l'écran d'intro glisse vers le haut, opaque, au lieu de s'effacer par-dessus l'app :
   un fondu laissait voir l'en-tête à travers un voile jaune, comme flou. */
#pkm-intro.pi-out { animation: piWipe 0.3s cubic-bezier(0.5, 0, 0.75, 0) forwards; }
#pkm-intro.pi-full { animation: piWipe 0.38s cubic-bezier(0.5, 0, 0.75, 0) 3.12s forwards; }
#pkm-intro.pi-short { animation: piWipe 0.26s cubic-bezier(0.5, 0, 0.75, 0) 0.36s forwards; }
#pkm-intro.pi-calm { animation: piOut 0.3s ease-in 0.35s forwards; }
@keyframes piOut { to { opacity: 0; visibility: hidden; } }
@keyframes piWipe { to { transform: translateY(-100%); visibility: hidden; } }
/* Version complète : les temps de 2026-10-09 multipliés par 1,5, puis le logo seul tenu 0,5 s de plus (3,5 s, 2026-10-25) */
.pi-full .pi-pack { animation: piDrop 0.54s cubic-bezier(0.2, 0.9, 0.3, 1.25) both, piShake 0.42s ease-in-out 0.54s 1, piFall 0.63s cubic-bezier(0.5, 0, 0.9, 0.4) 1.62s forwards; }
.pi-full .pi-top { animation: piRip 0.54s cubic-bezier(0.3, 0.6, 0.4, 1) 1.05s forwards; }
.pi-full .pi-bolt { opacity: 0; animation: piBolt 0.45s ease-out 0.9s both; }
.pi-full .pi-flash { opacity: 0; animation: piFlash 0.33s ease-out 0.99s both; }
.pi-full .pi-card { opacity: 0; animation: piFan 0.69s cubic-bezier(0.2, 0.9, 0.3, 1.15) both, piAway 0.45s ease-in 1.89s forwards; }
.pi-full .pi-c6 { --x: -150px; --y: -140px; --r: -40deg; animation-delay: 1.2s, 1.86s; }
.pi-full .pi-c1 { --x: -112px; --y: -224px; --r: -24deg; animation-delay: 1.23s, 1.89s; }
.pi-full .pi-c2 { --x: -58px; --y: -268px; --r: -12deg; animation-delay: 1.26s, 1.935s; }
.pi-full .pi-c4 { --x: 58px; --y: -268px; --r: 12deg; animation-delay: 1.29s, 1.935s; }
.pi-full .pi-c5 { --x: 112px; --y: -224px; --r: 24deg; animation-delay: 1.32s, 1.89s; }
.pi-full .pi-c7 { --x: 150px; --y: -140px; --r: 40deg; animation-delay: 1.35s, 1.86s; }
.pi-full .pi-c3 { --x: 0px; --y: -290px; --r: 0deg; animation: piFan 0.69s cubic-bezier(0.2, 0.9, 0.3, 1.15) 1.2s both, piGrow 0.54s cubic-bezier(0.3, 0.7, 0.3, 1) 1.83s forwards; }
.pi-full .pi-logo { opacity: 0; animation: piPop 0.51s cubic-bezier(0.2, 0.9, 0.3, 1.3) 2.13s both; }
.pi-full .pi-spark { opacity: 0; animation: piSpark 0.75s ease-out 2.25s both; }
/* Version éclair et animations réduites : le logo seul */
.pi-short .pi-pack, .pi-short .pi-card, .pi-short .pi-bolt, .pi-short .pi-flash, .pi-short .pi-spark,
.pi-calm .pi-pack, .pi-calm .pi-card, .pi-calm .pi-bolt, .pi-calm .pi-flash, .pi-calm .pi-spark { display: none; }
.pi-short .pi-logo { animation: piPop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
@keyframes piDrop { from { opacity: 0; transform: translateY(-120px) scale(0.86); } to { opacity: 1; transform: none; } }
@keyframes piShake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-3.5deg); } 45% { transform: rotate(3.5deg); } 70% { transform: rotate(-2deg); } 85% { transform: rotate(1.5deg); } }
@keyframes piFall { to { transform: translateY(520px) rotate(8deg); opacity: 0; } }
@keyframes piRip { to { transform: translate(130px, -150px) rotate(38deg); opacity: 0; } }
@keyframes piBolt { 0% { opacity: 0; transform: scale(0.4) rotate(-12deg); } 35% { opacity: 1; transform: scale(1.12) rotate(4deg); } 100% { opacity: 0; transform: scale(1.3); } }
@keyframes piFlash { 0% { opacity: 0; } 30% { opacity: 0.85; } 100% { opacity: 0; } }
@keyframes piFan { 0% { opacity: 0; transform: translate(0, 40px) rotate(0); } 12% { opacity: 1; } 100% { opacity: 1; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }
@keyframes piAway { to { opacity: 0; transform: translate(calc(var(--x) * 1.8), calc(var(--y) - 60px)) rotate(calc(var(--r) * 1.6)) scale(0.8); } }
@keyframes piGrow { from { opacity: 1; transform: translate(0, -290px) scale(1); } to { opacity: 0; transform: translate(0, -150px) scale(2.6); } }
@keyframes piPop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
@keyframes piSpark { 0% { opacity: 0; transform: scale(0.3) rotate(0); } 40% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4) rotate(45deg); } }
</style>

<script>
(function () {
  var el = document.getElementById('pkm-intro');
  if (!el) return;
  var timer = 0, hiddenAt = 0;
  var done = function () { clearTimeout(timer); if (el) { el.style.display = 'none'; el.className = ''; } };
  var play = function (kind) {
    if (!el) return;
    el.style.display = '';
    el.className = '';
    void el.offsetWidth; // relance les animations CSS depuis le début
    el.className = kind;
    clearTimeout(timer);
    timer = setTimeout(done, kind === 'pi-full' ? 4500 : 1200); // filet de sécurité
  };
  try {
    var q = location.search, force = /[?&]intro=(1|court)(&|$)/.test(q);
    var admin = {};
    try { admin = (JSON.parse(localStorage.getItem('pkm-collection-v1') || '{}') || {}).admin || {}; } catch (e) { admin = {}; }
    if (!force && (navigator.webdriver || /[?&]intro=0(&|$)/.test(q) || (admin.on && admin.flags && admin.flags.motion === false))) { el.parentNode.removeChild(el); el = null; return; }
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var kind = function () { return calm ? 'pi-calm' : /[?&]intro=court(&|$)/.test(q) ? 'pi-short' : 'pi-full'; };
    el.addEventListener('animationend', function (e) { if (e.target === el) done(); });
    el.addEventListener('click', function () { if (el && el.className !== 'pi-out') { el.className = 'pi-out'; } });
    play(kind());
    // App installée sur le téléphone : elle reprend souvent sans recharger la page. Après 10 min en arrière-plan,
    // le retour compte comme un démarrage et rejoue l'animation complète.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') hiddenAt = Date.now();
      else if (hiddenAt && Date.now() - hiddenAt > 600000) { hiddenAt = 0; play(kind()); }
    });
  } catch (e) { done(); }
})();
</script>
