# Vérification de la démo web à chaque envoi : tests unitaires (marge, import, accueil, Radar, scan, thème), puis
# reconstruction de web/ ; échec si la démo publiée n'est pas celle que produisent les sources (build oublié).
# Puis tests navigateur (tools/web/e2e, Chromium) sur la démo servie localement ; captures jointes en cas d'échec.
# Tests unitaires des chaînes de données (boutiques, scellé, TCGdex, contrôle check_data.py), en Python.
name: Tests de la démo

on:
  workflow_dispatch: {}
  push:
    branches: [claude/pokemon-app-mockup-1mxt7p]
    paths:
      - .github/workflows/tests.yml
      - docs/12-maquette-v5/**
      - tools/web/**
      - tools/stores/**
      - tools/sealed/**
      - tools/tcgdex/**
      - tools/check_data.py
      - tools/test_check_data.py
      - tools/sprites/companions.json
      - web/app.js
      - web/index.html
      - web/sw.js

permissions:
  contents: read

jobs:
  pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tests des chaînes de données (Python)
        run: |
          python3 -m unittest discover -s tools/stores -p "test_*.py"
          python3 -m unittest discover -s tools/sealed -p "test_*.py"
          python3 -m unittest discover -s tools/tcgdex -p "test_*.py"
          python3 -m unittest discover -s tools -p "test_check_data.py"

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/web/package-lock.json
      - name: Dépendances
        working-directory: tools/web
        run: npm ci
      - name: Tests unitaires
        working-directory: tools/web
        run: npm test
      - name: Reconstruire la démo
        working-directory: tools/web
        run: npm run build
      - name: La démo publiée correspond aux sources
        run: git diff --stat --exit-code -- web/app.js web/index.html

  e2e:
    needs: unit
    # Ubuntu 24.04 et non « latest » (2026-11-01) : ubuntu-latest est passé à 26.04, que Playwright 1.56 ne sait pas
    # équiper (« Playwright does not support chromium on ubuntu26.04-x64 ») ; tous les tests échouaient à l'installation.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/web/package-lock.json
      - name: Dépendances
        working-directory: tools/web
        run: npm ci
      - name: Chromium
        working-directory: tools/web
        run: npx playwright-core install --with-deps chromium
      - name: Tests navigateur
        working-directory: tools/web
        run: npm run e2e
      - name: Captures (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-e2e
          path: tools/web/e2e/out/
          retention-days: 7
