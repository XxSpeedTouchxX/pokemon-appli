# Diagnostic manuel (2026-10-22) : les visuels des cartes (CDN TCGdex) répondent-ils, et s'affichent-ils dans la démo
# (Chromium et WebKit, format iPhone) ? N'écrit rien.
name: Vérification des visuels (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/web/package-lock.json
      - name: Dépendances
        working-directory: tools/web
        run: npm ci && npx playwright-core install --with-deps chromium webkit
      - name: CDN TCGdex
        run: |
          for u in https://assets.tcgdex.net/fr/sv/sv08/238/low.webp https://assets.tcgdex.net/fr/sv/sv08/238/high.webp https://assets.tcgdex.net/fr/me/30th/155/low.webp; do
            echo "== $u"; curl -sS -o /dev/null -D - "$u" | grep -iE "^HTTP|content-type" || echo "ÉCHEC"
          done
      - name: Visuels dans la démo (vrai CDN)
        working-directory: tools/web
        run: node e2e/diag-images.mjs
