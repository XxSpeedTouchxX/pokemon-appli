# Diagnostic manuel (2026-10-22) : les visuels des cartes (CDN TCGdex) répondent-ils ? N'écrit rien.
name: Vérification des visuels (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in \
            https://assets.tcgdex.net/fr/sv/sv08/238/low.webp \
            https://assets.tcgdex.net/fr/sv/sv08/238/high.webp \
            https://assets.tcgdex.net/fr/sv/sv08/238/high.png \
            https://assets.tcgdex.net/fr/me/me01/001/low.webp \
            https://assets.tcgdex.net/en/base/base1/4/low.webp \
            https://pokemon-appli.pages.dev/ \
            https://pokemon-appli.pages.dev/data/cards-base.json ; do
            echo "== $u"; curl -sS -o /dev/null -D - -A "Mozilla/5.0 (iPhone)" -H "Referer: https://pokemon-appli.pages.dev/" "$u" | grep -iE "^HTTP|content-type|content-length|access-control|cross-origin|location" || echo "ÉCHEC"
          done
