# Catalogue scellé, à la demande : liste les produits de la galerie officielle Pokémon France et leurs
# correspondances Cardmarket possibles (tools/sealed/candidates.json, rapport de travail), puis télécharge
# les visuels des produits retenus (tools/sealed/products.json) dans web/img/products/.
# Il construit aussi web/data/sealed.json ; les prix du scellé sont ensuite mis à jour chaque jour par le
# workflow « Catalogue TCGdex ».
name: Catalogue scellé

on:
  workflow_dispatch: {}
  push:
    branches: [claude/pokemon-app-mockup-1mxt7p]
    paths:
      - .github/workflows/sealed.yml
      - tools/sealed/discover.py
      - tools/sealed/fetch_images.py
      - tools/sealed/build_sealed.py
      - tools/sealed/products.json

permissions:
  contents: write

concurrency:
  group: sealed-catalog
  cancel-in-progress: false

jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pokemon-app-mockup-1mxt7p

      # La découverte (lecture de la galerie) ne tourne qu'à la demande ou si discover.py change ;
      # une nouvelle liste de produits ne déclenche que le téléchargement des visuels manquants.
      - name: Produits de la galerie officielle et candidats Cardmarket
        if: github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'tools/sealed/discover.py')
        run: python3 tools/sealed/discover.py

      - name: Visuels des produits retenus
        run: |
          if [ -f tools/sealed/fetch_images.py ] && [ -f tools/sealed/products.json ]; then
            pip install --quiet pillow
            python3 tools/sealed/fetch_images.py
          fi

      - name: Prix du scellé (guide public Cardmarket)
        run: |
          python3 -m unittest discover -s tools/sealed -p "test_*.py"
          python3 tools/sealed/build_sealed.py

      - name: Publier sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f tools/sealed/candidates.json ]; then git add tools/sealed/candidates.json; fi
          if [ -d web/img/products ]; then git add web/img/products; fi
          git add web/data/sealed.json
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Met à jour le catalogue scellé ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4; do
            git pull --rebase origin claude/pokemon-app-mockup-1mxt7p && git push origin HEAD:claude/pokemon-app-mockup-1mxt7p && exit 0
            sleep $((i * 5))
          done
          exit 1
