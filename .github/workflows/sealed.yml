# Catalogue scellé, chaque jour : télécharge les visuels manquants des produits retenus
# (tools/sealed/products.json) dans web/img/products/, puis construit web/data/sealed.json avec les prix du
# jour (guide public Cardmarket). C'est le seul workflow qui écrit ces fichiers. Un guide de plus de 30 h, vide ou
# trop court est refusé (prix de la veille gardés) ; tools/check_data.py contrôle ensuite sealed.json et met à jour
# web/data/status.json. Les visuels et status.json sont publiés quoi qu'il arrive ; le job échoue sur une anomalie.
# À la demande (ou si discover.py change), il liste aussi les produits de la galerie officielle Pokémon France
# et leurs correspondances Cardmarket possibles (tools/sealed/candidates.json, rapport de travail).
name: Catalogue scellé

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * *" # chaque jour vers 06:17 (heure de Paris en été), après la mise à jour du guide Cardmarket
  push:
    branches: [claude/pokemon-app-mockup-1mxt7p]
    paths:
      - .github/workflows/sealed.yml
      - tools/sealed/discover.py
      - tools/sealed/fetch_images.py
      - tools/sealed/build_sealed.py
      - tools/sealed/products.json

permissions:
  contents: write

concurrency:
  group: sealed-catalog
  cancel-in-progress: false

jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pokemon-app-mockup-1mxt7p

      # La découverte (lecture de la galerie) ne tourne qu'à la demande ou si discover.py change ;
      # une nouvelle liste de produits ne déclenche que le téléchargement des visuels manquants.
      - name: Produits de la galerie officielle et candidats Cardmarket
        if: github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'tools/sealed/discover.py')
        run: python3 tools/sealed/discover.py

      - name: Visuels des produits retenus
        run: |
          if [ -f tools/sealed/fetch_images.py ] && [ -f tools/sealed/products.json ]; then
            pip install --quiet pillow
            python3 tools/sealed/fetch_images.py
          fi

      - name: Prix du scellé (guide public Cardmarket)
        id: build
        continue-on-error: true
        run: |
          python3 -m unittest discover -s tools/sealed -p "test_*.py"
          python3 tools/sealed/build_sealed.py

      - name: Contrôle des données (status.json)
        id: check
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 tools/check_data.py sealed --revert

      - name: Publier sur la branche
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f tools/sealed/candidates.json ]; then git add tools/sealed/candidates.json; fi
          if [ -d web/img/products ]; then git add web/img/products; fi
          git add web/data/sealed.json web/data/status.json
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Met à jour le catalogue scellé ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4; do
            git pull --rebase origin claude/pokemon-app-mockup-1mxt7p && git push origin HEAD:claude/pokemon-app-mockup-1mxt7p && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Échec signalé (guide refusé ou anomalie)
        if: ${{ !cancelled() && (steps.build.outcome == 'failure' || steps.check.outcome == 'failure') }}
        run: |
          echo "::error::Scellé : guide des prix refusé ou anomalie (voir le résumé du job et web/data/status.json)."
          exit 1
