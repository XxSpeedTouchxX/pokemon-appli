# Disponibilité des visuels d'une extension (diagnostic manuel, 2026-11-20) : pour chaque carte, quelles sources ont une
# image (TCGdex dans plusieurs langues, pokemontcg.io). Lecture seule, rien n'est écrit dans l'app.
name: Disponibilité des visuels

on:
  workflow_dispatch:
    inputs:
      set:
        description: "Extension du catalogue (ex. base1)"
        required: true
      langs:
        description: "Langues TCGdex à essayer"
        required: false
        default: "fr,en,de,it,es,pt"
      detail:
        description: "Langue à détailler (formats et comparaison avec l'anglais), vide sinon"
        required: false
        default: ""
      thumbs:
        description: "Cartes dont la vignette est écrite dans le journal (ex. base1-4,base1-58)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pokemon-app-mockup-1mxt7p
      - name: Visuels
        env:
          SET: ${{ github.event.inputs.set }}
          LANGS: ${{ github.event.inputs.langs }}
          DETAIL: ${{ github.event.inputs.detail }}
          THUMBS: ${{ github.event.inputs.thumbs }}
        run: |
          pip install --quiet pillow
          python3 tools/visuels/check_set.py "$SET" --langs "$LANGS" --detail "$DETAIL" --thumbs "$THUMBS" | tee "$RUNNER_TEMP/visuels.txt"
          tail -1 "$RUNNER_TEMP/visuels.txt" >> "$GITHUB_STEP_SUMMARY"
