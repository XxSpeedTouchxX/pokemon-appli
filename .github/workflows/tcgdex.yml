# Catalogue TCGdex : télécharge toutes les cartes françaises et leurs prix, complétées par les autres
# versions (extensions sans version française, visuels manquants), construit web/data/cards.json
# (catalogue compact chargé par la démo web) et le publie sur la branche. Le serveur dédié de dropicards.fr récupère ensuite la branche.
# Les prix du scellé sont mis à jour par le workflow « Catalogue scellé » (un seul workflow par fichier publié).
# Chaque mise à jour est un commit : l'historique git de cards.json sert d'archive quotidienne des prix.
# Garde-fous (2026-10-11) : build_index.py n'écrit pas un catalogue en baisse face à la veille (cartes −2 %, extension
# disparue, cotes −5 %, compléments anglais et visuels de repli en chute) ; tools/check_data.py contrôle ensuite les
# trois fichiers et met à jour web/data/status.json. Des échecs de téléchargement restants après la reprise, un
# catalogue refusé ou une anomalie font échouer le job à la fin (courriel au porteur), après publication de status.json.
name: Catalogue TCGdex

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Publier malgré une baisse face à la veille (vérifiée à la main)"
        type: boolean
        default: false
  schedule:
    - cron: "47 4 * * *" # chaque jour vers 06:47 (heure de Paris en été)
  push:
    branches: [claude/pokemon-app-mockup-1mxt7p]
    paths:
      - .github/workflows/tcgdex.yml
      - tools/tcgdex/sync_tcgdex.py
      - tools/tcgdex/build_index.py
      - tools/tcgdex/ptcg.py
      - tools/tcgdex/complete.py
      - tools/tcgdex/test_complete.py
      - tools/tcgdex/test_ptcg.py
      - tools/tcgdex/test_build_index.py
      - tools/tcgdex/split_catalog.py
      - tools/tcgdex/test_split_catalog.py
      - tools/tcgdex/cmfiles.py
      - tools/tcgdex/test_cmfiles.py
      - tools/tcgdex/history.py
      - tools/tcgdex/test_history.py

permissions:
  contents: write

concurrency:
  group: tcgdex-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pokemon-app-mockup-1mxt7p

      - name: Télécharger le catalogue TCGdex (sans les images)
        run: python3 tools/tcgdex/sync_tcgdex.py --skip-images --workers 6 --out data/tcgdex

      - name: Relancer pour les éventuels échecs (reprise)
        run: |
          if [ "$(python3 -c 'import json;print(len(json.load(open("data/tcgdex/failures.json"))))')" != "0" ]; then
            python3 tools/tcgdex/sync_tcgdex.py --skip-images --workers 2 --out data/tcgdex
          fi

      # Après la reprise, il ne doit plus rester d'échec : sinon des cartes perdraient leur prix sans bruit.
      # Le catalogue est quand même construit (garde-fous de build_index.py), et le job échoue à la fin.
      - name: Échecs restants après la reprise
        id: failures
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, sys
          f = json.load(open("data/tcgdex/failures.json"))
          for x in f[:30]:
              print(f"::error::TCGdex : {x['type']} {x['id']} : {x['error']}")
          if f:
              sys.exit(f"{len(f)} échec(s) de téléchargement après la reprise (data/tcgdex/failures.json)")
          print("Aucun échec restant.")
          PY

      # Autres versions, sans le détail des cartes (une requête par extension) : elles complètent les
      # visuels absents en français (même dessin officiel) ; l'anglais liste aussi les extensions sans
      # version française dans TCGdex.
      - name: Autres versions (visuels de repli)
        continue-on-error: true
        run: |
          for lang in en de it es; do
            python3 tools/tcgdex/sync_tcgdex.py --lang "$lang" --skip-images --skip-details --workers 6 --out "data/tcgdex-$lang" || true
          done

      # Détail en anglais : extensions sans version française, et extensions françaises auxquelles il manque
      # des cartes que la version anglaise a (promos, kits…) : ces cartes sont ajoutées en anglais (complete.py).
      - name: Extensions sans version française et cartes manquantes (détail et prix, en anglais)
        continue-on-error: true
        run: |
          for id in $(python3 tools/tcgdex/build_index.py --src data/tcgdex --en data/tcgdex-en --list-en-only) \
                    $(python3 tools/tcgdex/build_index.py --src data/tcgdex --en data/tcgdex-en --list-en-extra); do
            python3 tools/tcgdex/sync_tcgdex.py --lang en --skip-images --only-set "$id" --workers 6 --out data/tcgdex-en
          done

      # Dernier recours pour les cartes que TCGdex n'illustre dans aucune langue : scans anglais de
      # pokemontcg.io (données publiques sur GitHub ; arrêt du service prévu le 1er mars 2027). Si le dépôt
      # ne répond pas, les correspondances déjà validées (tools/tcgdex/ptcg_images.json) servent.
      - name: Données pokemontcg.io (dernier recours)
        continue-on-error: true
        run: git clone --depth 1 https://github.com/PokemonTCG/pokemon-tcg-data data/ptcg

      - name: Tests du rapprochement des visuels
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s tools/tcgdex -p "test_*.py"

      # Cote = Cardmarket uniquement (décision du porteur du 2026-10-18). Cartes que TCGdex ne relie pas à Cardmarket
      # (30ᵉ Anniversaire…) : prix des fichiers publics de Cardmarket (cmfiles.py), comme pour le scellé. Si ces
      # fichiers ne répondent pas, les prix de la veille sont gardés.
      # Comparé au catalogue publié la veille : pas d'écriture en cas de baisse (cartes, extensions, cotes,
      # compléments anglais cardsEn, visuels de repli imgAlt, cartes sans visuel imgNone), sauf « force ».
      # Puis partie fixe et prix du jour en deux fichiers : la démo ne retélécharge chaque jour que les prix.
      - name: Construire et découper le catalogue compact
        id: build
        continue-on-error: true
        run: |
          python3 tools/tcgdex/build_index.py --src data/tcgdex --en data/tcgdex-en \
            --alt de=data/tcgdex-de --alt it=data/tcgdex-it --alt es=data/tcgdex-es --ptcg data/ptcg --cardmarket \
            --out web/data/cards.json ${{ inputs.force && '--force' || '' }}
          python3 tools/tcgdex/split_catalog.py --src web/data/cards.json

      - name: Contrôle des données (status.json)
        id: check
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 tools/check_data.py cards --revert ${{ inputs.force && '--force' || '' }}

      # Archive quotidienne de la cote de chaque carte (2026-10-31, historique du prix de la fiche) : le jour du
      # catalogue publié (après le contrôle, qui peut avoir gardé celui de la veille) est ajouté à web/data/hist/.
      - name: Archiver la cote du jour
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 tools/tcgdex/history.py

      - name: Publier sur la branche
        if: ${{ !cancelled() }}
        run: |
          tools/publish_data.sh cards "Met à jour le catalogue TCGdex ($(date -u +%Y-%m-%d))" web/data/cards.json web/data/cards-base.json web/data/cards-prices.json web/data/status.json web/data/hist tools/tcgdex/ptcg_images.json

      - name: Échec signalé (échecs restants, catalogue refusé ou anomalie)
        if: ${{ !cancelled() && (steps.failures.outcome == 'failure' || steps.build.outcome == 'failure' || steps.check.outcome == 'failure') }}
        run: |
          echo "::error::Catalogue TCGdex : voir le résumé du job et web/data/status.json."
          exit 1
