# Pub TikTok (docs/15-pub-tiktok-30ans) : enregistre le vrai Radar de la démo avec son fond de carte OpenFreeMap,
# injoignable depuis le bac à sable de développement. Produit tools/promo/radar-demo.mp4 et le publie sur la branche.
name: Pub · enregistrement du Radar

on:
  workflow_dispatch: {}
  push:
    branches: [claude/pokemon-app-mockup-1mxt7p]
    paths:
      - .github/workflows/promo-radar.yml
      - tools/promo/record-radar.mjs

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pokemon-app-mockup-1mxt7p
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/web/package-lock.json
      - name: Dépendances
        working-directory: tools/web
        run: npm ci
      - name: Chromium et ffmpeg
        working-directory: tools/web
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user pillow
      - name: Enregistrer le Radar
        run: node tools/promo/record-radar.mjs
      - name: Contrôle
        run: cat tools/promo/out/radar-store.json
      - name: Publier sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/promo/radar-demo.mp4
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Pub : enregistrement du Radar avec fond de carte ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4; do
            git pull --rebase origin claude/pokemon-app-mockup-1mxt7p && git push origin HEAD:claude/pokemon-app-mockup-1mxt7p && exit 0
            sleep $((i * 5))
          done
          exit 1
