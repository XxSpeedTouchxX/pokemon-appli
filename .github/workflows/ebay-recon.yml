# Reconnaissance des ventes réussies eBay (2026-10-18, décision du porteur) : lancée à la main, n'écrit rien.
name: Reconnaissance eBay (ventes réussies)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ebay/recon_ebay.py
