# Cartes de l'éventail du premier écran (2026-10-30) : copies réduites des visuels TCGdex dans web/img/onb/, à la
# demande. Commite s'il y a du changement.
name: Cartes du premier écran

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cartes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cartes
        run: pip install --quiet pillow && python tools/brand/fetch_onb_cards.py
      - name: Commit
        run: |
          git add web/img/onb
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cartes du premier écran (copies des visuels TCGdex)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
