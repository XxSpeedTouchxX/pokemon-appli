# Boutiques réelles : chaque semaine, liste depuis OpenStreetMap (API Overpass) les boutiques de France
# métropolitaine susceptibles de vendre des produits Pokémon, avec leur commune, et publie web/data/stores.json
# pour Territoire, le Radar et l'accueil. Données © les contributeurs d'OpenStreetMap (ODbL). La liste n'est
# pas remplacée si la réponse paraît incomplète.
name: Boutiques OpenStreetMap

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 3 * * 1" # chaque lundi vers 05:23 (heure de Paris en été)
  push:
    branches: [claude/pokemon-app-mockup-1mxt7p]
    paths:
      - .github/workflows/stores.yml
      - tools/stores/sync_stores.py

permissions:
  contents: write

concurrency:
  group: osm-stores
  cancel-in-progress: false

jobs:
  stores:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pokemon-app-mockup-1mxt7p

      - name: Tests
        run: python3 -m unittest discover -s tools/stores -v

      # Ville de chaque boutique : contours des communes (france-geojson, données IGN, Licence Ouverte) et noms
      # officiels avec leur article (code officiel géographique de l'INSEE, paquet npm @etalab/decoupage-administratif).
      # Fichiers de travail dans data/ (non publiés). S'ils manquent, les villes viennent d'OpenStreetMap seulement.
      - name: Communes (contours et noms officiels)
        run: |
          mkdir -p data
          curl -fsSL --retry 3 -o data/communes.geojson https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/communes.geojson \
            || echo "::warning::Contours des communes indisponibles"
          curl -fsSL --retry 3 https://registry.npmjs.org/@etalab/decoupage-administratif/-/decoupage-administratif-6.0.0.tgz \
            | tar -xzO package/data/communes.json > data/communes-noms.json || rm -f data/communes-noms.json

      - name: Boutiques depuis OpenStreetMap
        run: python3 tools/stores/sync_stores.py

      - name: Publier sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/stores.json
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Met à jour les boutiques OpenStreetMap ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4; do
            git pull --rebase origin claude/pokemon-app-mockup-1mxt7p && git push origin HEAD:claude/pokemon-app-mockup-1mxt7p && exit 0
            sleep $((i * 5))
          done
          exit 1
