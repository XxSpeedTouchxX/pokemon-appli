# Cadrage des cartes (2026-11-13, porteur : « certaines cartes sont tordues, arrange cela dans le cadrage ») :
# tools/cadrage/redresse.py repère les visuels TCGdex qui sont des photos de travers (carte tournée sur un fond uni),
# les redresse et les recadre (web/img/fix/), et publie la liste lue par l'app (web/data/img-fix.json) avec des
# planches avant / après (tools/cadrage/apercu/).
# Depuis le premier passage du 13 novembre 2026 (scans droits pris à tort pour des photos de travers, annulé) :
# un lancement à la main fait un ESSAI À BLANC (tools/cadrage/essai/ : rapport, mesures, planches, aucun visuel de
# l'app changé) ; la publication se fait seulement avec « publier = oui », après vérification des planches.
# Lancé à la main seulement : les nouvelles extensions sont des scans officiels, droits.
name: Cadrage des cartes

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Seulement ces cartes (ids séparés par des virgules), vide = tout le catalogue"
        required: false
        default: ""
      publier:
        description: "oui = publier les visuels redressés dans l'app ; non = essai à blanc (rapport et planches)"
        required: false
        default: "non"

permissions:
  contents: write

concurrency:
  group: cadrage
  cancel-in-progress: false

jobs:
  cadrage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pokemon-app-mockup-1mxt7p
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install opencv-python-headless==4.10.0.84 numpy pillow
      - name: Tests du redressement
        run: python3 -m unittest discover -s tools/cadrage -p "test_*.py" -v
      # Petits visuels déjà téléchargés par le workflow « Empreintes des cartes » (même dossier, mêmes noms).
      - name: Visuels déjà connus
        uses: actions/cache@v4
        with:
          path: |
            .cache/scan/img
            .cache/cadrage
          key: cadrage-${{ github.run_id }}
          restore-keys: |
            cadrage-
            scan-prints-
      - name: Redressement
        run: |
          if [ "${{ github.event.inputs.publier }}" = "oui" ]; then
            python3 tools/cadrage/redresse.py --only "${{ github.event.inputs.only }}"
          else
            python3 tools/cadrage/redresse.py --essai --only "${{ github.event.inputs.only }}"
          fi
      - name: Publier
        run: |
          if [ "${{ github.event.inputs.publier }}" = "oui" ]; then
            git add -A web/img/fix web/data/img-fix.json tools/cadrage/apercu
            msg="Cadrage des cartes : visuels de travers redressés ($(date -u +%Y-%m-%d))"
          else
            git add -A tools/cadrage/essai
            msg="Cadrage des cartes : essai à blanc ($(date -u +%Y-%m-%d))"
          fi
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$msg"
          git pull --rebase origin claude/pokemon-app-mockup-1mxt7p
          git push origin HEAD:claude/pokemon-app-mockup-1mxt7p
