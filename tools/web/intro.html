<!-- Animation d'entrée « Ouverture de booster » (K1, 2026-10-09), insérée par build.mjs dans web/index.html.
     Booster Dropicards portant le logo de l'app (le « D » et la carte à la gemme, 2026-11-26, porteur : « mets sur le booster
     le logo Dropicards de l'appli avec le D et la carte ») ; à la fin, ce logo et le nom « Dropicards », tenus 0,5 s.
     4 variantes proposées au porteur, même durée (3,5 s au plus, 2026-10-25) ; ?introvis=1 à 4 ; **la 2 « La carte sort »
     choisie par le porteur** (2026-11-26), les autres pour essai :
       1 Déchirure : le booster tombe et tremble, l'éclair le déchire, le haut s'envole, les gemmes PK jaillissent en éventail,
         la gemme du milieu grandit et laisse place au logo ;
       2 La carte sort (choisie par le porteur) : une découpe horizontale tranche le haut du booster (2026-11-26, porteur :
         « à la place de l'éclair, la même découpe que pour la 4, mais horizontale en haut du booster » ; 4 ouvertures
         proposées le 2026-11-27, sans trait ni éclair blanc : ciseaux, sabre, bouchon, languette ; ?introcut=1 à 4), le haut s'envole, la carte du
         logo sort du bas, se retourne et brille, puis se pose et le « D » arrive par la gauche ;
       3 Holo : le booster tourne sur lui-même avec un reflet arc-en-ciel, gonfle et éclate en gemmes qui tourbillonnent
         jusqu'au centre, où le logo apparaît dans une onde de choc ;
       4 Coupé en deux : un éclair tranche le booster en diagonale, les deux moitiés s'écartent et le logo monte dans les rayons.
     Un appui la passe. Version complète à chaque démarrage (2026-10-11), y compris au retour dans l'app installée après
     10 min en arrière-plan ; fondu simple si l'utilisateur limite les animations ; rien si le mode Admin coupe les
     animations, ni dans un navigateur piloté par des tests (?intro=1 force la version complète, ?intro=court la version
     éclair). Elle joue pendant le chargement de l'app, sans la retarder. Dessin en SVG, animations en CSS. -->
<style>
#pkm-intro { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer;

<script>
(function () {
  var el = document.getElementById('pkm-intro');
  if (!el) return;
  var timer = 0, hiddenAt = 0;
  var done = function () { clearTimeout(timer); if (el) { el.style.display = 'none'; el.className = ''; } };
  var play = function (kind) {
    if (!el) return;
    el.style.display = '';
    el.className = '';
    void el.offsetWidth; // relance les animations CSS depuis le début
    el.className = kind;
    clearTimeout(timer);
    timer = setTimeout(done, kind === 'pi-full' ? 4500 : 1200); // filet de sécurité
  };
  try {
    var q = location.search, force = /[?&]intro=(1|court)(&|$)/.test(q);
    var admin = {};
    try { admin = (JSON.parse(localStorage.getItem('pkm-collection-v1') || '{}') || {}).admin || {}; } catch (e) { admin = {}; }
    if (!force && (navigator.webdriver || /[?&]intro=0(&|$)/.test(q) || (admin.on && admin.flags && admin.flags.motion === false))) { el.parentNode.removeChild(el); el = null; return; }
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var kind = function () { return calm ? 'pi-calm' : /[?&]intro=court(&|$)/.test(q) ? 'pi-short' : 'pi-full'; };
    el.addEventListener('animationend', function (e) { if (e.target === el) done(); });
    el.addEventListener('click', function () { if (el && el.className !== 'pi-out') { el.className = 'pi-out'; } });
    // Variante (2026-11-26, porteur : « propose-moi des animations du booster, avec le logo Dropicards, le D et la
    // carte ») : ?introvis=1 à 4 ; la 2 « La carte sort » par défaut (choix du porteur, même jour).
    el.setAttribute('data-v', (/[?&]introvis=([1-4])(&|$)/.exec(q) || [])[1] || '2');
    // Ouverture de la 2 (2026-11-27, porteur : « propose-m'en plusieurs, avec une coupe nette satisfaisante ») :
    // ?introcut=4 Languette (choix du porteur, 2026-11-27), 1 Ciseaux, 2 Sabre, 3 Bouchon, 0 version précédente.
    el.setAttribute('data-k', (/[?&]introcut=([0-4])(&|$)/.exec(q) || [])[1] || '4');
    // Sortie de la carte (2026-11-27, porteur : « directement une forme de carte qui sorte du booster ») :
    // ?introcarte=1 Glisse et se pose (choisie par le porteur, avec reflet blanc), 2 Tourbillon, 3 Bond, 4 Lévitation holo, 0 ancienne.
    el.setAttribute('data-o', (/[?&]introcarte=([0-4])(&|$)/.exec(q) || [])[1] || '1');
    play(kind());
    // App installée sur le téléphone : elle reprend souvent sans recharger la page. Après 10 min en arrière-plan,
    // le retour compte comme un démarrage et rejoue l'animation complète.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') hiddenAt = Date.now();
      else if (hiddenAt && Date.now() - hiddenAt > 600000) { hiddenAt = 0; play(kind()); }
    });
  } catch (e) { done(); }
})();
</script>
