# Configuration nginx de dropicards.fr dans Coolify (projet « PKM », ressource « dropicards », Build strategy « Static »,
# serveur web nginx:alpine, dossier /web). À coller dans Configuration › General › Build & deploy › « Custom Nginx
# configuration », puis Save et Redeploy (la configuration est copiée dans l'image au déploiement).
# Base : la configuration par défaut générée par Coolify v4.6.0 (2026-11-05), avec les en-têtes de web/_headers
# (que seul Cloudflare lisait) et des protections de base. Pas encore de Content-Security-Policy (à essayer d'abord
# en mode « rapport seulement »). Retour en arrière : vider le champ (ou « Generate Default »), Save, Redeploy.
# Rappel nginx : un add_header placé dans un location remplace ceux du server ; ils y sont donc répétés.
server {
    root /usr/share/nginx/html;
    index index.html index.htm;
    server_tokens off;

    # Compression des fichiers texte (app.js, catalogue des cartes).
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    # Protections envoyées avec chaque page.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
    }

    # Page d'accueil, application et service worker : toujours revérifiés, pour que les téléphones prennent la
    # dernière version.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /app.js {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Cartes, prix et historiques : mis à jour chaque jour, toujours revérifiés.
    location /data/ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Moteur de lecture du scan : fichiers versionnés (dossier 7.0.0), gardés un an.
    location /vendor/tesseract/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Fichiers réservés à Cloudflare : jamais servis.
    location ~ ^/_(headers|redirects)$ {
        return 404;
    }

    # Handle 404 errors
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Handle server errors (50x)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
