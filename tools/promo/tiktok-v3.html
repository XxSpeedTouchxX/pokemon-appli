<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dropicards · pub TikTok v3</title>
<!-- Pub verticale 1080 × 1920, 35,8 s, montée sur « Montagem Uranium (slowed) » (2026-10-10, demande du porteur).
     Synchro : grille des coups de grosse caisse mesurée sur la musique, G(k) = 0,662 + 0,55921 × k s (107,3 BPM).
     Prises réelles de l'app (tools/promo/record-app.mjs, images extraites par render.mjs dans out/play/) et
     motion design calculé image par image par render(t). Sert depuis la racine du dépôt. -->
<style>
@font-face { font-family: 'Luckiest Guy'; src: url(../../web/fonts/luckiest-guy-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Luckiest Guy'; src: url(../../web/fonts/luckiest-guy-latin-ext-400-normal.woff2) format('woff2'); unicode-range: U+0100-024F, U+1E00-1EFF; }
@font-face { font-family: 'Sora'; font-weight: 700; src: url(../../web/fonts/sora-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Sora'; font-weight: 600; src: url(../../web/fonts/sora-latin-600-normal.woff2) format('woff2'); }
:root { --y: #FFD21F; --navy: #0A1130; --ink: #04060F; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); font-family: 'Sora', sans-serif; color: #fff; }
.L { position: absolute; inset: 0; }
.abs { position: absolute; }
.big { font-family: 'Luckiest Guy', cursive; line-height: .95; letter-spacing: 1px; -webkit-text-stroke: 12px #000; paint-order: stroke fill; }
.sora { font-family: 'Sora', sans-serif; font-weight: 700; }
.ctr { left: 0; right: 0; text-align: center; }
canvas { position: absolute; left: 0; top: 0; }
#full, #phone .scr { overflow: hidden; }
#full { position: absolute; inset: 0; opacity: 0; }
#full img, #phone .scr img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#phone { position: absolute; left: 0; top: 0; width: 740px; height: 1600px; border-radius: 92px; background: #07090f; padding: 20px; opacity: 0;
  box-shadow: 0 0 0 5px var(--y), 0 0 60px rgba(255,210,31,.55), 0 60px 120px rgba(0,0,0,.6); }
#phone .scr { position: relative; width: 700px; height: 1560px; border-radius: 74px; background: #0B1120; }
#phone .notch { position: absolute; left: 50%; top: 36px; width: 170px; height: 46px; margin-left: -85px; border-radius: 30px; background: #000; z-index: 3; }
.t { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; white-space: pre-line; }
.plate { display: inline-block; padding: 10px 26px; border-radius: 18px; background: rgba(10,17,48,.88); border: 2px solid rgba(255,210,31,.6); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,.65) 100%); opacity: 0; }
#scan { position: absolute; inset: 0; pointer-events: none; opacity: .07; background: repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 2px, transparent 2px 6px); }
#topfade { position: absolute; left: 0; right: 0; top: 0; height: 640px; background: linear-gradient(180deg, rgba(4,6,15,.88) 0%, rgba(4,6,15,.55) 60%, rgba(4,6,15,0) 100%); opacity: 0; }
.px { image-rendering: pixelated; }
.prod { position: absolute; opacity: 0; border-radius: 30px; overflow: hidden; border: 6px solid #000; box-shadow: 0 0 0 4px var(--y), 0 40px 80px rgba(0,0,0,.55); }
.prod img { display: block; width: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam" class="L">
    <canvas id="bg" width="1080" height="1920"></canvas>
    <div id="full"><img id="fullImg" alt=""></div>
    <div id="phone"><div class="notch"></div><div class="scr"><img id="phoneImg" alt=""></div></div>
    <canvas id="fx" width="1080" height="1920"></canvas>
    <div id="prods" class="L">
      <div class="prod" id="pDeck" style="width: 760px"><img src="../../web/img/products/30th-celebration-battle-deck-espeon-ex-umbreon-ex.webp" alt=""></div>
      <div class="prod" id="pEtb" style="width: 760px"><img src="../../web/img/products/30th-celebration-elite-trainer-box.webp" alt=""></div>
      <div class="prod" id="pDitto" style="width: 760px"><img src="../../web/img/products/30th-celebration-ditto-premium-collection.webp" alt=""></div>
      <div class="prod" id="pFig" style="width: 760px"><img src="../../web/img/products/30th-celebration-figure-collection.webp" alt=""></div>
      <div class="abs" id="upcL" style="width: 430px; height: 488px; overflow: hidden; opacity: 0; border-radius: 22px"><img src="../../web/img/products/30th-celebration-ultra-premium-collections-day-night.webp" style="position: absolute; left: 0; top: 0; width: 860px; height: 488px" alt=""></div>
      <div class="abs" id="upcR" style="width: 430px; height: 488px; overflow: hidden; opacity: 0; border-radius: 22px"><img src="../../web/img/products/30th-celebration-ultra-premium-collections-day-night.webp" style="position: absolute; left: -430px; top: 0; width: 860px; height: 488px" alt=""></div>
      <img id="logo30" class="abs" src="../../web/img/logo-30-anniversaire.webp" style="width: 520px; left: 280px; opacity: 0" alt="">
    </div>
    <div id="topfade"></div>
    <div id="texts" class="L">
      <div id="tA" class="t big"></div>
      <div id="tB" class="t big"></div>
      <div id="tC" class="t sora"></div>
      <div id="tD" class="t sora"></div>
    </div>
    <img id="logo" class="abs" src="../../web/img/brand/dropicards-header.png" style="width: 860px; left: 110px; opacity: 0" alt="">
    <img id="gem" class="abs" src="../../web/img/brand/pk.svg" style="width: 150px; opacity: 0" alt="">
    <img id="pika" class="abs px" src="../../web/img/pokemon/25.png" style="width: 230px; opacity: 0" alt="">
    <div id="legal" class="abs" style="left: 60px; width: 820px; top: 1290px; opacity: 0">
      <div class="plate" style="font-size: 27px; line-height: 1.35; font-weight: 600; text-align: center">Application indépendante, non affiliée à Nintendo, GAME FREAK ou The Pokémon Company.</div>
      <div style="margin-top: 10px; font-size: 22px; color: rgba(255,255,255,.75); text-align: center">Fond de carte : © contributeurs OpenStreetMap · OpenFreeMap</div>
    </div>
  </div>
  <div id="vig"></div>
  <div id="scan"></div>
  <div id="flash"></div>
</div>

<script>
// ——— Temps ———
const BPM0 = 0.662, BEAT = 0.55921, b = k => BPM0 + BEAT * k; // coup n° k de la grille
const DURATION = 35.79; // b(64) − b(0) : la boucle retombe en rythme
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const prog = (t, a, c) => clamp((t - a) / (c - a));
const eOut = x => 1 - Math.pow(1 - x, 3), eIn = x => x * x * x;
const eIO = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eBack = x => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const eEl = x => (x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI) / 3) + 1);
const lerp = (a, c, x) => a + (c - a) * x;
const $ = id => document.getElementById(id);
const css = (el, o) => { el = typeof el === 'string' ? $(el) : el; for (const k in o) el.style[k] = o[k]; };
const nf = n => Math.round(n).toLocaleString('fr-FR').replace(/\s/g, ' ');
// Coup qui vient de tomber (0..1 sur d secondes) ; « impact » pour les secousses et les flashs.
const hit = (t, at, d = .3) => { const x = (t - at) / d; return x >= 0 && x < 1 ? 1 - x : 0; };

// ——— Données : prises de l'app, France et boutiques ———
let TK = {}, FR = [], SHOPS = [];
const C = { x: 480, y: 960, r: 400 }; // disque du radar néon (hors des boutons TikTok)
const K = 78, KX = K * Math.cos(46.6 * Math.PI / 180), LON0 = 2.2, LAT0 = 46.2;
const proj = (lon, lat, z = 1, cx = C.x, cy = C.y) => [cx + (lon - LON0) * KX * z, cy - (lat - LAT0) * K * z];
async function load() {
  const [tk, geo, st] = await Promise.all(['takes/takes.json', '../../web/data/geo/regions.json', '../../web/data/stores.json'].map(u => fetch(u).then(r => r.json())));
  TK = tk;
  geo.features.forEach(f => { const g = f.geometry; (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).forEach(p => FR.push(p[0])); });
  const F = {}; st.fields.forEach((k, i) => { F[k] = i; });
  SHOPS = st.stores.filter(s => s[F.lat] > 41 && s[F.lat] < 51.5 && s[F.lon] > -5.5 && s[F.lon] < 10).map((s, i) => {
    const [x, y] = proj(s[F.lon], s[F.lat]);
    return { lon: s[F.lon], lat: s[F.lat], a: (Math.atan2(x - C.x, -(y - C.y)) + 2 * Math.PI) % (2 * Math.PI), r: (i * 7919 % 1000) / 1000 };
  });
  SHOPS.sort((p, q) => p.a - q.a);
}
// Image d'une prise : n° d'image, borné.
const frameOf = (take, f) => Math.max(0, Math.min((TK[take] ? TK[take].frames : 1) - 1, Math.round(f)));
// Correspondance temps de la pub → image de la prise, par segments [t, image].
const seg = (t, pts) => { for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) return lerp(pts[i - 1][1], pts[i][1], prog(t, pts[i - 1][0], pts[i][0])); return pts[pts.length - 1][1]; };
const countAt = (take, f) => { let c = 0; ((TK[take] || {}).counts || []).forEach(([i, v]) => { if (i <= f) c = v; }); return c; };
let pending = [];
function showFrame(imgId, take, f) {
  const src = 'out/play/' + take + '/' + String(frameOf(take, f)).padStart(4, '0') + '.jpg', img = $(imgId);
  if (img.getAttribute('src') !== src) { img.setAttribute('src', src); if (img.decode) pending.push(img.decode().catch(() => null)); }
}
// Vue plein écran d'une prise (pixels CSS de l'app 390 × 844, images ×2) : point (cx, cy) de l'app placé en (X, Y), échelle k.
function full(take, f, cx, cy, X, Y, k, op = 1) {
  showFrame('fullImg', take, f);
  css('full', { opacity: op, visibility: op > 0 ? 'visible' : 'hidden' });
  css('fullImg', { transform: `translate(${X - cx * k}px, ${Y - cy * k}px) scale(${k / 2})` });
}
// Téléphone néon : position, rotation, et caméra dans l'écran (point (cx, cy) de l'app au centre, zoom z).
function phone(take, f, o) {
  showFrame('phoneImg', take, f);
  const z = o.z || 1, k = 700 / 390 * z, cx = o.cx == null ? 195 : o.cx, cy = o.cy == null ? 422 : o.cy;
  const tx = Math.min(0, Math.max(700 - 390 * k, 350 - cx * k)), ty = Math.min(0, Math.max(1560 - 844 * k, 780 - cy * k));
  css('phoneImg', { transform: `translate(${tx}px, ${ty}px) scale(${k / 2})` });
  css('phone', { opacity: o.op == null ? 1 : o.op, visibility: (o.op == null ? 1 : o.op) > 0 ? 'visible' : 'hidden',
    transform: `translate(${o.x}px, ${o.y}px) perspective(1800px) rotateY(${o.ry || 0}deg) rotate(${o.rz || 0}deg) scale(${o.s || 1})` });
}
// Textes : jusqu'à 4 lignes (A, B : titres ; C, D : sous-titres).
function txt(id, text, o = {}) {
  const el = $(id);
  if (!text) { el.style.opacity = 0; return; }
  if (el.textContent !== text) { el.innerHTML = ''; const sp = document.createElement('span'); sp.style.display = 'inline-block'; sp.textContent = text; el.appendChild(sp); }
  const at = o.at == null ? -9 : o.at, p = o.t == null ? 1 : prog(o.t, at, at + (o.d || .22));
  const sc = o.pop === false ? 1 : lerp(o.from || 2.3, 1, eBack(p));
  const gl = o.glitch ? hit(o.t, at, .12) : 0;
  css(el, { top: o.y + 'px', fontSize: o.size + 'px', color: o.color || '#fff', opacity: p > 0 ? (o.op == null ? 1 : o.op) : 0,
    transform: `translateX(${o.dx || 0}px) scale(${sc}) rotate(${o.rot || 0}deg)`,
    textShadow: gl ? `${10 * gl}px 0 rgba(255,0,80,.9), ${-10 * gl}px 0 rgba(0,255,255,.9)` : (o.shadow || 'none'),
    webkitTextStroke: o.stroke == null ? '' : o.stroke + 'px #000', letterSpacing: o.ls || '' });
  const w = el.firstChild ? el.firstChild.offsetWidth : 0, max = o.max || 960;
  if (w > max) el.style.fontSize = (o.size * max / w) + 'px';
}
function clearScene() {
  ['tA', 'tB', 'tC', 'tD'].forEach(id => txt(id, ''));
  ['full', 'phone', 'logo', 'gem', 'pika', 'legal', 'logo30', 'upcL', 'upcR', 'pDeck', 'pEtb', 'pDitto', 'pFig', 'topfade', 'vig'].forEach(id => { $(id).style.opacity = 0; });
  $('full').style.visibility = $('phone').style.visibility = 'hidden';
}

// ——— Dessins ———
const bg = () => $('bg').getContext('2d'), fxc = () => $('fx').getContext('2d');
function grid(ctx, a) { ctx.save(); ctx.strokeStyle = `rgba(120,150,255,${a})`; ctx.lineWidth = 1; for (let x = 0; x <= 1080; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1920); ctx.stroke(); } for (let y = 0; y <= 1920; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1080, y); ctx.stroke(); } ctx.restore(); }
function rings(ctx, cx, cy, r, a, ticks = true) {
  ctx.save(); ctx.strokeStyle = `rgba(255,210,31,${a})`; ctx.lineWidth = 2;
  for (let i = 1; i <= 4; i++) { ctx.beginPath(); ctx.arc(cx, cy, r * i / 4, 0, 2 * Math.PI); ctx.stroke(); }
  if (ticks) for (let d = 0; d < 360; d += 10) { const q = d * Math.PI / 180, l = d % 30 ? 10 : 24; ctx.beginPath(); ctx.moveTo(cx + Math.sin(q) * r, cy - Math.cos(q) * r); ctx.lineTo(cx + Math.sin(q) * (r + l), cy - Math.cos(q) * (r + l)); ctx.stroke(); }
  ctx.restore();
}
// Faisceau : angle a (radians depuis 12 h, sens horaire), traîne de 70°.
function beam(ctx, cx, cy, r, a, alpha = 1, color = '255,210,31') {
  if (!ctx.createConicGradient) return;
  ctx.save(); ctx.translate(cx, cy);
  const g = ctx.createConicGradient(a - Math.PI / 2 - 1.22, 0, 0);
  g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(.194, `rgba(${color},${.5 * alpha})`); g.addColorStop(.1945, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a - Math.PI / 2 - 1.22, a - Math.PI / 2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${.95 * alpha})`; ctx.lineWidth = 5; ctx.shadowColor = `rgba(${color},1)`; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(a) * r, -Math.cos(a) * r); ctx.stroke();
  ctx.restore();
}
function progressRing(ctx, cx, cy, r, frac, alpha = 1) {
  ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = `rgba(255,210,31,${alpha})`; ctx.lineWidth = 10; ctx.shadowColor = 'rgba(255,210,31,.9)'; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * frac); ctx.stroke(); ctx.restore();
}
function shock(ctx, cx, cy, p, rmax, color = '255,255,255') { if (p <= 0 || p >= 1) return; ctx.save(); ctx.strokeStyle = `rgba(${color},${1 - p})`; ctx.lineWidth = 10 * (1 - p) + 2; ctx.beginPath(); ctx.arc(cx, cy, rmax * eOut(p), 0, 2 * Math.PI); ctx.stroke(); ctx.restore(); }
function rays(ctx, t, color, n = 18, cx = 540, cy = 900) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .35); ctx.fillStyle = color; for (let i = 0; i < n; i++) { ctx.rotate(Math.PI * 2 / n); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-80, -1700); ctx.lineTo(80, -1700); ctx.closePath(); ctx.fill(); } ctx.restore(); }
function sparks(ctx, t, color, n = 30, seed = 1) {
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const s = Math.sin(i * 12.9898 + seed) * 43758.5453, r = s - Math.floor(s), r2 = Math.abs((Math.sin(i * 78.233 + seed) * 12345.678) % 1);
    const x = r * 1080, y = ((r2 * 1920 - t * (90 + r * 160)) % 1920 + 1920) % 1920, k = (Math.sin(t * 5 + i) + 1) / 2, sz = 5 + 14 * k * r;
    ctx.beginPath(); ctx.moveTo(x, y - sz); ctx.quadraticCurveTo(x, y, x + sz, y); ctx.quadraticCurveTo(x, y, x, y + sz); ctx.quadraticCurveTo(x, y, x - sz, y); ctx.quadraticCurveTo(x, y, x, y - sz); ctx.fill();
  }
}
function burst(ctx, cx, cy, p, n = 20, color = '255,210,31') { if (p <= 0 || p >= 1) return; ctx.save(); ctx.fillStyle = `rgba(${color},${1 - p})`; for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI + i, d = 60 + 420 * eOut(p) * (.6 + .4 * Math.sin(i * 7)); ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 9 * (1 - p) + 2, 0, 2 * Math.PI); ctx.fill(); } ctx.restore(); }
// France en néon, points des boutiques allumés jusqu'à l'angle « sweep » (radians, > 2π = tout allumé).
function france(ctx, sweep, o = {}) {
  const z = o.z || 1, cx = o.cx || C.x, cy = o.cy || C.y, glow = o.glow == null ? 1 : o.glow;
  ctx.save(); ctx.lineJoin = 'round'; ctx.strokeStyle = `rgba(255,210,31,${.95 * glow})`; ctx.lineWidth = 4; ctx.shadowColor = 'rgba(255,210,31,.8)'; ctx.shadowBlur = 18 * glow;
  ctx.fillStyle = `rgba(40,62,150,${.28 * glow})`;
  FR.forEach(ring => { ctx.beginPath(); ring.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat, z, cx, cy); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.fill(); ctx.stroke(); });
  ctx.restore();
  let lit = 0;
  for (const s of SHOPS) {
    const [x, y] = proj(s.lon, s.lat, z, cx, cy), seen = sweep - s.a;
    if (seen < 0) { ctx.fillStyle = `rgba(150,165,200,${.35 * glow})`; ctx.fillRect(x - 1.5, y - 1.5, 3, 3); continue; }
    lit++;
    const fl = clamp(1 - seen / .35), rr = 2.6 + 5 * fl + (o.pulse || 0) * 3;
    ctx.fillStyle = fl > 0 ? `rgba(255,255,255,${.7 + .3 * fl})` : `rgba(255,210,31,${.85 * glow})`;
    ctx.beginPath(); ctx.arc(x, y, rr, 0, 2 * Math.PI); ctx.fill();
  }
  return lit;
}

// ——— Rendu d'une image ———
function render(T) {
  pending = [];
  const t = ((T % DURATION) + DURATION) % DURATION;
  clearScene();
  const g = bg(), f = fxc();
  g.clearRect(0, 0, 1080, 1920); f.clearRect(0, 0, 1080, 1920);
  // Secousses et flashs sur les coups forts.
  const big = [b(0), b(8), b(24), b(40), b(50), b(53), b(56)], small = [];
  for (let k = 24; k <= 36; k++) small.push(b(k)); for (let k = 41; k <= 54; k++) small.push(b(k));
  let sh = 0; big.forEach(h => { sh = Math.max(sh, hit(t, h, .4) * 30); }); small.forEach(h => { sh = Math.max(sh, hit(t, h, .22) * 9); });
  css('cam', { transform: `translate(${Math.sin(t * 97) * sh}px, ${Math.cos(t * 83) * sh}px)` });
  let fl = 0; big.forEach(h => { fl = Math.max(fl, hit(t, h, .12)); });
  css('flash', { opacity: fl * .85 });
  $('stage').style.background = '#0A1130';

  // 1. Accroche : le radar néon (avant le premier coup, puis un tour complet en 4 temps)
  if (t < b(5)) {
    grid(g, .06);
    const a = t < b(0) ? 0 : t < b(4) ? 2 * Math.PI * prog(t, b(0), b(4)) : 7;
    const zoom = t > b(4) ? 1 + 7 * eIn(prog(t, b(4) + .3, b(5))) : 1 + .06 * hit(t, b(1), .5);
    const zc = [C.x + (proj(4.835, 45.76)[0] - C.x), C.y + (proj(4.835, 45.76)[1] - C.y)]; // Lyon
    g.save(); g.translate(zc[0], zc[1]); g.scale(zoom, zoom); g.translate(-zc[0], -zc[1]);
    rings(g, C.x, C.y, C.r, .16 + .1 * hit(t, b(4), .5));
    const lit = france(g, a, { pulse: hit(t, b(4), .4) });
    beam(g, C.x, C.y, C.r + 20, a < 7 ? a : 2 * Math.PI, t < b(0) ? .35 : t < b(4) + .35 ? 1 : 1 - prog(t, b(4) + .1, b(4) + .5));
    shock(g, C.x, C.y, prog(t, b(4), b(4) + .35), C.r + 60);
    g.restore();
    // Réticule avant le premier coup
    if (t < b(0)) { const s = lerp(1.4, 1, prog(t, 0, b(0))); g.save(); g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 4; g.beginPath(); g.arc(C.x, C.y, 60 * s, 0, 2 * Math.PI); g.stroke(); g.restore(); }
    const n = t >= b(4) ? 3397 : Math.round(lit * 3397 / Math.max(1, SHOPS.length));
    if (t < b(0)) { txt('tA', 'UPC 30 ANS', { y: 250, size: 200, color: 'rgba(255,210,31,.35)', stroke: 6, pop: false }); txt('tC', 'le 6 novembre…', { y: 470, size: 54, op: .5, pop: false }); }
    else if (t < b(1)) { txt('tA', 'UPC 30 ANS', { y: 240, size: 210, color: '#FFD21F', t, at: b(0) }); txt('tB', 'LE 6 NOVEMBRE', { y: 450, size: 96, t, at: b(0) + .08 }); }

      else { txt('tA', '06.11', { y: 260, size: 260, color: '#FFD21F', t, at: b(51), rot: -6, from: 3 }); txt('tB', 'JOURNÉE OU SOIRÉE', { y: 1230, size: 76, t, at: b(51) + .08 }); }
    }
  }
  // 17. Prix de lancement et précommandes, sur la fiche réelle
  else if (t < b(53)) {
    const O = TK.sorties || {};
    rays(g, t, 'rgba(255,210,31,.08)', 16, 540, 900);
    const p = eOut(prog(t, b(52), b(52) + .2)), half = b(52) + BEAT / 2;
    const cam = t < half ? { cx: 105, cy: 690, z: lerp(1.2, 2.2, p) } : { cx: 290, cy: 690, z: 2.2 };
    phone('sorties', O.upc + 30, Object.assign({ x: 170, y: 560, ry: 10 }, cam));
    txt('tA', t < half ? 'PRIX DE' : 'PRÉCOS', { y: 210, size: 140, t, at: t < half ? b(52) : half }); txt('tB', t < half ? 'LANCEMENT' : 'CARDMARKET', { y: 350, size: 120, color: '#FFD21F', t, at: (t < half ? b(52) : half) + .05 });
  }
  // 18. Le radar revient : repère tes boutiques avant le 6/11, puis le faisceau révèle le logo
  else if (t < b(56)) {
    grid(g, .06);
    const a = 2 * Math.PI * prog(t, b(53), b(55));
    rings(g, C.x, C.y, C.r, .18);
    france(g, 7, { pulse: hit(t, b(54), .3) });
    if (t < b(55)) beam(g, C.x, C.y, C.r + 20, a, 1);
    if (t >= b(55)) txt('tA', '');
    if (t < b(54)) { txt('tA', 'REPÈRE TES', { y: 220, size: 130, t, at: b(53) }); txt('tB', 'BOUTIQUES', { y: 350, size: 150, color: '#FFD21F', t, at: b(53) + .05 }); }
    else if (t < b(55)) { txt('tA', 'AVANT', { y: 220, size: 150, t, at: b(54) }); txt('tB', 'LE 6/11', { y: 360, size: 170, color: '#FFD21F', t, at: b(54) + .05 }); }
    else {
      const p = prog(t, b(55), b(56));
      g.save(); g.globalAlpha = Math.min(1, p * 5); g.fillStyle = '#0A1130'; g.fillRect(0, 0, 1080, 1920); g.restore();
      rings(g, 540, 618, 420, .2 * Math.min(1, p * 5), false);
      beam(g, 540, 618, 700, 2 * Math.PI * p, 1);
      // Le faisceau découvre le logo (masque conique qui suit l'angle).
      const m = `conic-gradient(from 0deg at 50% 50%, #000 ${360 * p}deg, transparent ${360 * p}deg)`;
      css('logo', { top: '560px', opacity: 1, transform: 'scale(.92)', webkitMaskImage: m, maskImage: m });
    }
  }
  // 19. Fin : logo, GRATUIT, lien en bio, mention ; retour à l'image du début pour la boucle
  else {
    rays(g, t, 'rgba(255,210,31,.10)', 18, 540, 700); sparks(f, t, 'rgba(255,210,31,.85)', 26, 7);
    const fadeOut = prog(t, b(62), b(63));
    const p = eEl(prog(t, b(56), b(56) + .5)), breath = 1 + .03 * Math.sin((t - b(56)) / BEAT * Math.PI);
    css('logo', { top: '340px', opacity: 1 - fadeOut, transform: `scale(${p * breath})`, webkitMaskImage: 'none', maskImage: 'none' });
    burst(f, 540, 420, prog(t, b(56), b(56) + .5), 24);
    txt('tB', 'GRATUIT', { y: 560, size: 150, color: '#FFD21F', t, at: b(56) + .08, rot: -8, from: 3, op: 1 - fadeOut });
    const gp = eBack(prog(t, b(56) + .1, b(56) + .35));
    css('gem', { left: '70px', top: '560px', opacity: (gp > 0 ? 1 : 0) * (1 - fadeOut), transform: `scale(${gp}) rotate(${t * 60}deg)` });
    if (t >= b(57)) txt('tA', 'LIEN EN BIO', { y: 830, size: 120 * (1 + .04 * hit(t, b(57) + Math.floor((t - b(57)) / BEAT) * BEAT, .3)), t, at: b(57), op: 1 - fadeOut, dx: -60 });
    if (t >= b(58)) txt('tC', 'web app · avant-première', { y: 990, size: 46, op: 1 - fadeOut, pop: false, dx: -60 });
    const pk = eOut(prog(t, b(58), b(58) + .5)), hop = Math.abs(Math.sin((t - b(58)) * 6)) * 50;
    css('pika', { left: lerp(-240, 600, pk) + 'px', top: 1060 - hop + 'px', opacity: (pk > 0 ? 1 : 0) * (1 - fadeOut), transform: 'scaleX(-1)' });
    css('legal', { opacity: t < b(63) + .2 ? eOut(prog(t, b(56), b(56) + .2)) : 1 - prog(t, b(63) + .2, b(63) + .4) });
    // Dernier temps : retour au radar néon du début (boucle sans couture)
    if (t > b(63)) { const q = prog(t, b(63), DURATION); g.save(); g.globalAlpha = q; grid(g, .06); rings(g, C.x, C.y, C.r, .16); france(g, 0); beam(g, C.x, C.y, C.r + 20, 0, .35); g.restore(); }
  }
  return pending.length ? Promise.all(pending) : null;
}
window.render = render;
window.DURATION = DURATION;
window.ready = (async () => {
  await load();
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => (i.complete || !i.getAttribute('src') ? 0 : new Promise(r => { i.onload = i.onerror = r; }))));
  await render(0);
  return true;
})();
if (!/render=1/.test(location.search)) window.ready.then(() => { const t0 = performance.now(); const loop = () => { render((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); });
</script>
